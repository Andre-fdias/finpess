<section id="sec-calendar" class="module-section" aria-labelledby="title-calendar">
  <!-- Cabeçalho Principal do Calendário -->
  <div class="card page-header-card">
    <div class="page-header-content">
      <div class="page-icon-badge page-icon-purple">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </div>
      <div>
        <h1 id="title-calendar" class="page-title">Calendário Financeiro</h1>
        <p class="page-subtitle">Acompanhe vencimentos, receitas previstas e pagamentos realizados nas visões Mês, Dia e Ano.</p>
      </div>
    </div>
    <div class="page-header-actions">
      <!-- Botão de Sincronização com Agenda Própria Google Calendar -->
      <button type="button" class="btn btn-secondary btn-sm" onclick="App.syncGoogleCalendar()" id="btn-sync-google-calendar" style="display:inline-flex; align-items:center; gap:0.4rem; height:32px; font-size:0.78rem;" title="Conectar / Sincronizar com Agenda Própria no Google Calendar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
        <span>Google Agenda</span>
      </button>

      <!-- Filtros com suporte às novas regras do sistema -->
      <select id="cal-filtro-tipo" class="form-control" style="width:130px; height:32px; font-size:0.78rem;" onchange="App.loadCalendar()" title="Filtrar por tipo financeiro">
        <option value="">Todos Tipos</option>
        <option value="ENTRADA">↑ Receitas</option>
        <option value="SAIDA">↓ Despesas</option>
        <option value="CONSIGNADO_FOLHA">🏢 Consignados</option>
        <option value="INFORMATIVO">📊 Agenda Mercado</option>
      </select>

      <select id="cal-filtro-origem" class="form-control" style="width:145px; height:32px; font-size:0.78rem;" onchange="App.loadCalendar()" title="Filtrar por módulo / origem">
        <option value="">Todas Origens</option>
        <option value="LANCAMENTOS">Lançamentos Manuais</option>
        <option value="EMPRESTIMO">Empréstimos & Financiamentos</option>
        <option value="INVESTIMENTO">Investimentos</option>
        <option value="DIVIDA">Dívidas & Acordos</option>
        <option value="RECORRENTE">Contas Recorrentes</option>
        <option value="MERCADO">Agenda Econômica B3/Copom</option>
      </select>

      <label style="display:inline-flex; align-items:center; gap:0.35rem; font-size:0.78rem; font-weight:600; color:var(--text-secondary); cursor:pointer; margin:0;" title="Exibir datas de reuniões do Copom, IPCA, Fed e proventos no calendário">
        <input type="checkbox" id="cal-check-mercado" checked onchange="App.loadCalendar()" style="accent-color:var(--primary); cursor:pointer;" />
        <span>Agenda Mercado</span>
      </label>
      <input type="hidden" id="cal-visao" value="MENSAL" />
      <input type="hidden" id="cal-data-ref" />
    </div>
  </div>

  <!-- Card do Calendário Interativo Estilo FullCalendar -->
  <div class="card" style="padding:1.15rem;">
    <!-- Toolbar FullCalendar -->
    <div class="fc-toolbar">
      <div class="fc-nav-buttons">
        <button type="button" class="btn btn-secondary btn-sm" onclick="App.calendarPrev()" aria-label="Período anterior" title="Anterior">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="App.calendarToday()">Hoje</button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="App.calendarNext()" aria-label="Próximo período" title="Próximo">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <div class="fc-title-container">
        <h2 id="fc-current-title" class="fc-title">Carregando Calendário...</h2>
      </div>

      <div class="fc-view-buttons">
        <div class="fc-btn-group">
          <button type="button" class="fc-btn active" id="btn-fc-view-month" onclick="App.calendarSetView('MENSAL')">Mês</button>
          <button type="button" class="fc-btn" id="btn-fc-view-day" onclick="App.calendarSetView('DIARIA')">Dia</button>
          <button type="button" class="fc-btn" id="btn-fc-view-year" onclick="App.calendarSetView('ANUAL')">Ano</button>
          <button type="button" class="fc-btn" id="btn-fc-view-list" onclick="App.calendarSetView('LISTA')">Lista</button>
        </div>
      </div>
    </div>

    <!-- Barra de Resumo Financeiro do Período -->
    <div id="calendar-summary-header" class="fc-summary-bar">
      <!-- Preenchido dinamicamente via App.loadCalendar -->
    </div>

    <!-- Contêiner do Calendário Visual (Grade Mensal, Diária, Anual ou Lista) -->
    <div id="calendar-events-container">
      <!-- Grade FullCalendar renderizada aqui -->
    </div>
  </div>
</section>
