<script>
  /**
   * Controlador principal do frontend Finanças Inteligentes.
   * Conecta todos os formulários, tabelas, filtros, temas e modais ao backend Google Apps Script via apiCall.
   */
  var App = (function () {
    var state = {
      currentModule: 'dashboard',
      user: null,
      categories: [],
      bankAccounts: [],
      banksViewMode: (function () {
        try { return localStorage.getItem('finpess_banks_view_mode') || 'cards'; } catch (e) { return 'cards'; }
      })(),
      launches: [],
      currentDetailLaunchId: null,
      calendarView: 'MENSAL',
      calendarRefDate: new Date(),
      calendarEvents: [],
      dashboard: null,
      telegram: null,
      pendingConfirmationFn: null,
      lastSyncVersion: 0,
      syncHeartbeatTimer: null,
      autoRefresh10mTimer: null,
      isQuietSyncing: false,
      notificationsFilter: 'TODAS',
      notificationsItems: [],
      currentSnoozeId: null,
      oracleChatHistory: []
    };

    function showToast(message, type) {
      var container = document.getElementById('toast-container');
      if (!container) return;
      var el = document.createElement('div');
      el.className = 'toast';
      if (type === 'error') el.style.borderLeftColor = 'var(--danger)';
      else if (type === 'success') el.style.borderLeftColor = 'var(--success)';
      el.textContent = message;
      container.appendChild(el);
      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 4000);
    }

    function openConfirmModal(title, message, onConfirm, onCancel) {
      var backdrop = document.getElementById('confirm-modal-backdrop');
      document.getElementById('confirm-modal-title').textContent = title;
      document.getElementById('confirm-modal-body').textContent = message;
      state.pendingConfirmationFn = onConfirm;
      state.pendingCancelFn = onCancel;
      backdrop.classList.add('open');
    }

    function closeConfirmModal() {
      var backdrop = document.getElementById('confirm-modal-backdrop');
      backdrop.classList.remove('open');
      var cancelFn = state.pendingCancelFn;
      state.pendingConfirmationFn = null;
      state.pendingCancelFn = null;
      if (typeof cancelFn === 'function') cancelFn();
    }

    function executeConfirmedAction() {
      var fn = state.pendingConfirmationFn;
      state.pendingConfirmationFn = null;
      state.pendingCancelFn = null;
      var backdrop = document.getElementById('confirm-modal-backdrop');
      backdrop.classList.remove('open');
      if (typeof fn === 'function') fn();
    }

    var activeLoadingCount = 0;
    var activeBlockingCount = 0;

    function showLoading(msg, isBlocking) {
      activeLoadingCount++;
      if (isBlocking) {
        activeBlockingCount++;
        var overlay = document.getElementById('global-loading-overlay');
        var txt = document.getElementById('global-loading-text');
        if (txt) {
          txt.textContent = msg || 'Processando com segurança...';
        }
        if (overlay) overlay.style.display = 'flex';
      }
      var bar = document.getElementById('top-loading-bar');
      if (bar) bar.classList.add('loading-active');
      var loader = document.getElementById('global-loader');
      if (loader) loader.style.display = 'inline-block';
    }

    function hideLoading(isBlocking) {
      activeLoadingCount = Math.max(0, activeLoadingCount - 1);
      if (isBlocking) {
        activeBlockingCount = Math.max(0, activeBlockingCount - 1);
        if (activeBlockingCount === 0) {
          var overlay = document.getElementById('global-loading-overlay');
          if (overlay) overlay.style.display = 'none';
        }
      }
      if (activeLoadingCount === 0) {
        var bar = document.getElementById('top-loading-bar');
        if (bar) bar.classList.remove('loading-active');
        var loader = document.getElementById('global-loader');
        if (loader) loader.style.display = 'none';
      }
    }

    function callServer(action, payload, callback, options) {
      var isQuiet = Boolean(options && options.quiet);
      var isBlocking = Boolean(options && options.blocking);
      if (!isQuiet) showLoading(options && options.message, isBlocking);

      var token = localStorage.getItem('fin_session_token') ||
                  sessionStorage.getItem('fin_session_token') ||
                  (typeof window !== 'undefined' && window.__INITIAL_SESSION_TOKEN__) ||
                  '';
      var authCtx = {
        sessionToken: token,
        isBrowserRequest: true
      };

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function (res) {
            if (!isQuiet) hideLoading(isBlocking);
            if (!res || !res.ok) {
              var errMsg = (res && res.error) || 'Erro na operação.';
              if (action !== 'session.getBootstrap' &&
                  (errMsg.indexOf('AUTH_REQUIRED') !== -1 ||
                   errMsg.indexOf('SESSION_EXPIRED') !== -1 ||
                   errMsg.indexOf('INVALID_SESSION') !== -1 ||
                   errMsg.indexOf('Sessão expirada') !== -1)) {
                localStorage.removeItem('fin_session_token');
                if (!isQuiet) showToast('Sua sessão expirou. Redirecionando para login...', 'warning');
                setTimeout(function () { if (typeof init === 'function') init(); }, 1000);
                return;
              }
              if (options && typeof options.onError === 'function') {
                options.onError(res || { message: errMsg });
              }
              if (!isQuiet) showToast(errMsg, 'error');
              return;
            }
            if (callback) callback(res);
          })
          .withFailureHandler(function (err) {
            if (!isQuiet) hideLoading(isBlocking);
            if (options && typeof options.onError === 'function') {
              options.onError(err);
            }
            if (!isQuiet) {
              showToast(err && err.message ? err.message : String(err), 'error');
            }
          })
          .apiCall(action, payload || {}, authCtx);
      } else if (typeof window.__LOCAL_API_BRIDGE__ === 'function') {
        try {
          var localRes = window.__LOCAL_API_BRIDGE__(action, payload || {}, authCtx);
          if (!isQuiet) hideLoading(isBlocking);
          if (!localRes || !localRes.ok) {
            var localErrMsg = (localRes && localRes.error) || 'Erro na operação.';
            if (action !== 'session.getBootstrap' &&
                (localErrMsg.indexOf('AUTH_REQUIRED') !== -1 ||
                 localErrMsg.indexOf('SESSION_EXPIRED') !== -1 ||
                 localErrMsg.indexOf('INVALID_SESSION') !== -1 ||
                 localErrMsg.indexOf('Sessão expirada') !== -1)) {
              localStorage.removeItem('fin_session_token');
              if (!isQuiet) showToast('Sua sessão expirou. Redirecionando para login...', 'warning');
              setTimeout(function () { if (typeof init === 'function') init(); }, 1000);
              return;
            }
            if (options && typeof options.onError === 'function') {
              options.onError(localRes || { message: localErrMsg });
            }
            if (!isQuiet) showToast(localErrMsg, 'error');
            return;
          }
          if (callback) callback(localRes);
        } catch (e) {
          if (!isQuiet) hideLoading(isBlocking);
          if (options && typeof options.onError === 'function') {
            options.onError(e);
          }
          if (!isQuiet) {
            showToast(e.message || String(e), 'error');
          }
        }
      } else {
        if (!isQuiet) {
          hideLoading(isBlocking);
          showToast('Ambiente Google Apps Script não detectado.', 'error');
        }
      }
    }

    function updateSyncIndicator(status) {
      var btn = document.getElementById('btn-refresh-sync');
      var ind = document.getElementById('sync-status-indicator');
      var txt = document.getElementById('sync-status-text');

      if (btn) {
        btn.classList.remove('status-synced', 'status-pending', 'status-error', 'is-spinning');
        if (status === 'syncing') {
          btn.classList.add('is-spinning');
          btn.setAttribute('title', 'Sincronizando dados...');
        } else if (status === 'pending' || status === 'dirty') {
          btn.classList.add('status-pending');
          btn.setAttribute('title', 'Alterações detectadas por outro usuário! Clique para sincronizar.');
        } else if (status === 'error') {
          btn.classList.add('status-error');
          btn.setAttribute('title', 'Falha na conexão. Clique para tentar novamente.');
        } else {
          btn.classList.add('status-synced');
          btn.setAttribute('title', 'Sistema atualizado. Clique para sincronizar agora.');
        }
      }

      if (ind) {
        if (status === 'syncing') {
          ind.style.background = '#3b82f6';
          ind.style.boxShadow = '0 0 8px #3b82f6';
        } else if (status === 'pending' || status === 'dirty') {
          ind.style.background = '#f59e0b';
          ind.style.boxShadow = '0 0 8px #f59e0b';
        } else if (status === 'error') {
          ind.style.background = '#ef4444';
          ind.style.boxShadow = 'none';
        } else {
          ind.style.background = '#10b981';
          ind.style.boxShadow = 'none';
        }
      }

      if (txt) {
        if (status === 'syncing') {
          txt.textContent = 'Atualizando...';
        } else if (status === 'pending' || status === 'dirty') {
          txt.textContent = 'Atualizar';
        } else if (status === 'error') {
          txt.textContent = 'Reconectando...';
        } else {
          txt.textContent = 'Sincronizado';
        }
      }
    }

    function refreshCurrentViewQuiet(callback) {
      if (state.isQuietSyncing) return;
      state.isQuietSyncing = true;
      updateSyncIndicator('syncing');

      var mod = state.currentModule || 'dashboard';

      callServer('bankAccounts.list', { includeInactive: true }, function (resB) {
        if (resB && resB.data) {
          state.bankAccounts = resB.data;
          populateSelects();
        }
      }, { quiet: true });

      var finishSync = function () {
        state.isQuietSyncing = false;
        updateSyncIndicator('updated');
        if (callback) callback();
      };

      if (mod === 'dashboard') {
        var monthEl = document.getElementById('dash-month-select');
        var mes = monthEl ? monthEl.value : '';
        callServer('dashboard.get', { mesReferencia: mes }, function (res) {
          if (res && res.data) renderDashboard(res.data);
          finishSync();
        }, { quiet: true });
      } else if (mod === 'launches') {
        var p = state.currentPage || 1;
        var payload = collectLaunchFilterPayload(p);
        callServer('launches.list', payload, function (res) {
          if (res && res.data) {
            state.launches = res.data.items || [];
            var sumTotal = document.getElementById('summary-filtro-total');
            if (sumTotal) sumTotal.textContent = (res.data.total || 0) + ' registro(s)';
            var sumEntradas = document.getElementById('summary-filtro-entradas');
            if (sumEntradas) sumEntradas.textContent = '+' + UIHelpers.formatBrl(res.data.totalEntradasCentavos || 0);
            var sumSaidas = document.getElementById('summary-filtro-saidas');
            if (sumSaidas) sumSaidas.textContent = '-' + UIHelpers.formatBrl(res.data.totalSaidasCentavos || 0);
            var sumSaldo = document.getElementById('summary-filtro-saldo');
            if (sumSaldo) {
              sumSaldo.textContent = UIHelpers.formatBrl(res.data.saldoPeriodoCentavos || 0);
              sumSaldo.className = (res.data.saldoPeriodoCentavos || 0) >= 0 ? 'text-success' : 'text-danger';
            }
            renderLaunchesTable(res.data.items || []);
            renderPagination(res.data.page || 1, res.data.totalPages || 1, res.data.total || 0);
          }
          finishSync();
        }, { quiet: true });
      } else if (mod === 'recurring') {
        var compEl = document.getElementById('rec-competencia-input');
        var compRec = (compEl && compEl.value) ? compEl.value : new Date().toISOString().substring(0, 7);
        callServer('recurring.list', { competencia: compRec }, function (res) {
          if (res && res.data) {
            state.recurringAccounts = res.data || [];
            renderRecurringAccounts(res.data);
          }
          finishSync();
        }, { quiet: true });
      } else if (mod === 'banks') {
        callServer('bankAccounts.list', { includeInactive: true }, function (res) {
          if (res && res.data) {
            state.bankAccounts = res.data;
            renderBankAccounts(res.data);
          }
          finishSync();
        }, { quiet: true });
      } else if (mod === 'debts') {
        callServer('debts.list', {}, function (res) {
          if (res && res.data) {
            state.debts = res.data;
            renderDebts(res.data);
          }
          finishSync();
        }, { quiet: true });
      } else if (mod === 'loans') {
        callServer('loans.list', {}, function (res) {
          if (res && res.data) {
            state.loans = res.data;
            renderLoans(res.data);
          }
          finishSync();
        }, { quiet: true });
      } else if (mod === 'investments') {
        callServer('investments.summary', {}, function (res) {
          if (res && res.data) {
            state.investmentsData = res.data;
            var s = res.data;
            var elAplicado = document.getElementById('inv-kpi-aplicado');
            if (elAplicado) elAplicado.textContent = UIHelpers.formatBrl(s.total_aplicado_centavos);
            var elMercado = document.getElementById('inv-kpi-mercado');
            if (elMercado) elMercado.textContent = UIHelpers.formatBrl(s.total_valor_mercado_informado_centavos);
            var elRend = document.getElementById('inv-kpi-rendimentos');
            if (elRend) elRend.textContent = UIHelpers.formatBrl(s.total_rendimentos_registrados_centavos);
            var elVar = document.getElementById('inv-kpi-variacao');
            if (elVar) {
              var varVal = s.variacao_patrimonial_centavos || 0;
              elVar.textContent = (varVal >= 0 ? '+' : '') + UIHelpers.formatBrl(varVal);
              elVar.style.color = varVal >= 0 ? 'var(--color-success)' : 'var(--color-danger)';
            }
            renderInvestmentsTable(s.ativos || []);
            renderInvestmentsCategoryChart(s.distribuicao_classes || []);
          }
          finishSync();
        }, { quiet: true });
      } else if (mod === 'calendar') {
        if (!state.calendarRefDate) state.calendarRefDate = new Date();
        var isoRef = toIsoDate(state.calendarRefDate);
        var elVisao = document.getElementById('cal-visao');
        var visao = elVisao ? elVisao.value : 'MENSAL';
        callServer('calendar.getEvents', { data_referencia: isoRef, visao: visao }, function (res) {
          if (res && res.data) {
            state.calendarEvents = res.data.eventos || [];
            renderCalendarEvents();
          }
          finishSync();
        }, { quiet: true });
      } else if (mod === 'planning') {
        var h = parseInt(document.getElementById('proj-horizonte') ? document.getElementById('proj-horizonte').value : '6', 10);
        callServer('projections.generate', { horizonte_meses: h, salvar_snapshot: false }, function (res) {
          if (res && res.data) {
            state.currentProjections = res.data;
            renderProjections(res.data);
          }
          finishSync();
        }, { quiet: true });
      } else if (mod === 'settings') {
        var hasOpenModal = document.querySelector('.modal-backdrop[style*="display: flex"], .modal-backdrop[style*="display:flex"], .modal-backdrop[style*="display: block"]');
        if (!hasOpenModal && typeof loadAdminUsers === 'function' && state.user && (state.user.papel === 'OWNER' || state.user.papel === 'ADMIN')) {
          loadAdminUsers();
        }
        finishSync();
      } else {
        finishSync();
      }
    }

    function renderOnlineUsersPresence(onlineUsers) {
      var container = document.getElementById('active-presence-container');
      var ddList = document.getElementById('dropdown-online-users-list');
      var users = Array.isArray(onlineUsers) ? onlineUsers : [];

      // Atualiza lista detalhada dentro do Dropdown de Conta Google
      if (ddList) {
        var currentModLabel = (state.currentModule || 'dashboard').toUpperCase();
        var selfNome = state.user ? (UIHelpers ? UIHelpers.escapeHtml(state.user.nome || state.user.email) : (state.user.nome || state.user.email)) : 'Conectado';
        var selfHtml = '<div class="account-online-user-item is-you">' +
          '<span class="online-user-dot"></span>' +
          '<span class="online-user-name"><strong>Você</strong> (' + selfNome + ') • ' + currentModLabel + '</span>' +
          '</div>';

        var othersListHtml = users.map(function (u) {
          var sNome = UIHelpers ? UIHelpers.escapeHtml(u.nome || '') : (u.nome || '');
          var sModulo = UIHelpers ? UIHelpers.escapeHtml(u.modulo_label || 'Navegando') : (u.modulo_label || 'Navegando');
          var sPapel = u.papel || 'MEMBRO';
          return '<div class="account-online-user-item">' +
            '<span class="online-user-dot"></span>' +
            '<span class="online-user-name"><strong>' + sNome + '</strong> (' + sPapel + ') • ' + sModulo + '</span>' +
            '</div>';
        }).join('');

        ddList.innerHTML = selfHtml + othersListHtml;
      }

      // Se não há outros usuários conectados além de você, oculta os círculos extras
      if (!container) return;
      if (users.length === 0) {
        container.style.display = 'none';
        container.innerHTML = '';
        return;
      }

      container.style.display = 'inline-flex';
      var html = '';
      var maxDisplay = 3;
      var displayed = users.slice(0, maxDisplay);
      var remaining = users.length - maxDisplay;

      for (var i = 0; i < displayed.length; i++) {
        var u = displayed[i];
        var roleBadgeColor = u.papel === 'OWNER' ? 'background:rgba(217,119,6,0.15); color:#d97706;' : (u.papel === 'ADMIN' ? 'background:rgba(37,99,235,0.15); color:#2563eb;' : 'background:rgba(100,116,139,0.15); color:#64748b;');
        var roleLabel = u.papel === 'OWNER' ? '👑 OWNER' : (u.papel === 'ADMIN' ? '🛡️ ADMIN' : '👤 MEMBRO');
        var safeNome = UIHelpers ? UIHelpers.escapeHtml(u.nome || '') : (u.nome || '');
        var safeModulo = UIHelpers ? UIHelpers.escapeHtml(u.modulo_label || 'Editando') : (u.modulo_label || 'Editando');
        var safeIniciais = UIHelpers ? UIHelpers.escapeHtml(u.iniciais || '??') : (u.iniciais || '??');
        var hasPhoto = Boolean(u.foto_url && String(u.foto_url).trim().length > 4);
        var safePhotoUrl = hasPhoto ? (UIHelpers ? UIHelpers.escapeHtml(u.foto_url) : u.foto_url) : '';

        html += '<div class="presence-avatar-wrapper" style="z-index:' + (displayed.length - i) + ';" title="' + safeNome + ' (' + safeModulo + ')">';
        html += '  <div class="presence-avatar-pill" style="background:' + (u.cor || '#2563eb') + ';">';
        if (hasPhoto) {
          html += '    <img src="' + safePhotoUrl + '" alt="' + safeNome + '" class="presence-avatar-img" onerror="this.style.display=\'none\'; if(this.nextElementSibling) this.nextElementSibling.style.display=\'flex\';" />';
          html += '    <span class="presence-avatar-fallback" style="display:none;">' + safeIniciais + '</span>';
        } else {
          html += '    <span class="presence-avatar-fallback">' + safeIniciais + '</span>';
        }
        html += '    <span class="presence-online-dot"></span>';
        html += '  </div>';
        html += '</div>';
      }

      if (remaining > 0) {
        html += '<div class="presence-avatar-more" title="Mais ' + remaining + ' usuário(s) editando">';
        html += '  <span>+' + remaining + '</span>';
        html += '</div>';
      }

      container.innerHTML = html;
    }

    function checkSyncVersion(onUpdated) {
      if (!state.user || state.isQuietSyncing) return;
      var payload = {
        currentModule: state.currentModule || 'dashboard'
      };
      callServer('sync.getVersion', payload, function (res) {
        if (res && res.ok) {
          if (res.onlineUsers !== undefined) {
            renderOnlineUsersPresence(res.onlineUsers);
          }
          if (res.notificationsBadge !== undefined) {
            updateNotificationsBadge(res.notificationsBadge, res.hasCriticalNotification);
          }
          if (res.version) {
            if (state.lastSyncVersion && res.version > state.lastSyncVersion) {
              state.lastSyncVersion = res.version;
              // Alterações detectadas por outro usuário: ativa o estado amarelo de alerta
              updateSyncIndicator('pending');
              refreshCurrentViewQuiet(onUpdated);
            } else {
              state.lastSyncVersion = res.version;
            }
          }
        }
      }, { quiet: true });
    }

    function triggerManualSync() {
      updateSyncIndicator('syncing');
      callServer('sync.forceSync', {}, function (res) {
        if (res && res.version) state.lastSyncVersion = res.version;
        refreshCurrentViewQuiet(function () {
          showToast('Sincronização concluída com sucesso!', 'success');
        });
      }, { quiet: true });
    }

    function startAutoSyncEngine() {
      if (state.syncHeartbeatTimer) clearInterval(state.syncHeartbeatTimer);
      if (state.autoRefresh10mTimer) clearInterval(state.autoRefresh10mTimer);

      // 1. Polling rápido de versão a cada 15 segundos:
      // Garante sincronização em tempo real entre todos os usuários conectados
      state.syncHeartbeatTimer = setInterval(function () {
        checkSyncVersion();
      }, 15000);

      // 2. Auto-Refresh Periódico Completo a cada 10 Minutos (600.000 ms)
      state.autoRefresh10mTimer = setInterval(function () {
        refreshCurrentViewQuiet();
      }, 10 * 60 * 1000);

      // 3. Atualização imediata ao reativar foco da janela/aba
      window.addEventListener('focus', function () {
        checkSyncVersion();
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          checkSyncVersion();
        }
      });
    }

    function applyThemeDom(themeValue) {
      var normalized = (themeValue === 'dark' || themeValue === 'auto') ? themeValue : 'light';
      document.documentElement.setAttribute('data-theme', normalized);
      try {
        localStorage.setItem('finpess_theme_cache', normalized);
      } catch (e) {}
      var topSelect = document.getElementById('topbar-theme-select');
      if (topSelect && topSelect.value !== normalized) topSelect.value = normalized;
      var prefSelect = document.getElementById('pref-tema');
      if (prefSelect && prefSelect.value !== normalized) prefSelect.value = normalized;

      // Atualiza botões do Pill de Tema moderno no Header
      var themeBtns = document.querySelectorAll('.theme-pill-btn');
      for (var i = 0; i < themeBtns.length; i++) {
        var btn = themeBtns[i];
        var val = btn.getAttribute('data-theme-val');
        if (val === normalized) {
          btn.classList.add('active');
          btn.setAttribute('aria-checked', 'true');
        } else {
          btn.classList.remove('active');
          btn.setAttribute('aria-checked', 'false');
        }
      }
    }

    function applyAndSaveTheme(themeValue) {
      applyThemeDom(themeValue);
      callServer('user.updateTheme', { tema_preferido: themeValue }, function () {
        showToast('Preferência de tema salva na sua conta (' + themeValue + ').', 'success');
      });
    }

    function navigate(moduleName) {
      state.currentModule = moduleName;
      var sections = document.querySelectorAll('.module-section');
      for (var i = 0; i < sections.length; i++) {
        sections[i].classList.remove('active');
      }
      var target = document.getElementById('sec-' + moduleName);
      if (target) target.classList.add('active');

      var navBtns = document.querySelectorAll('[data-nav-target]');
      for (var j = 0; j < navBtns.length; j++) {
        var btn = navBtns[j];
        if (btn.getAttribute('data-nav-target') === moduleName) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      }

      var sidebar = document.getElementById('app-sidebar');
      if (sidebar) sidebar.classList.remove('mobile-open');

      if (moduleName === 'dashboard') loadDashboard();
      else if (moduleName === 'launches') loadLaunches(1);
      else if (moduleName === 'recurring') loadRecurringAccounts();
      else if (moduleName === 'banks') loadBankAccounts();
      else if (moduleName === 'credit-cards') loadCreditCards();
      else if (moduleName === 'debts') loadDebts();
      else if (moduleName === 'loans') loadLoans();
      else if (moduleName === 'investments') loadInvestments();
      else if (moduleName === 'calendar') loadCalendar();
      else if (moduleName === 'planning') loadProjections(false);
      else if (moduleName === 'goals') loadGoals();
      else if (moduleName === 'reports') loadReports();
      else if (moduleName === 'oraculo' || moduleName === 'oracle') loadOraculo();
      else if (moduleName === 'settings') loadSettingsView();
    }

    function toggleMobileSidebar() {
      var sb = document.getElementById('app-sidebar');
      if (sb) sb.classList.toggle('mobile-open');
    }

    function computeDateRangeByPreset(preset, chosenYear) {
      var now = new Date();
      var y = chosenYear ? parseInt(chosenYear, 10) : now.getFullYear();
      var m = now.getMonth();

      function pad2(n) { return (n < 10 ? '0' : '') + n; }
      function fmt(d) {
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      }

      // Se for seleção direta de mês de "01" a "12" (Janeiro a Dezembro)
      if (/^(0[1-9]|1[0-2])$/.test(preset)) {
        var mIdx = parseInt(preset, 10) - 1;
        var startMonth = new Date(y, mIdx, 1);
        var endMonth = new Date(y, mIdx + 1, 0); return { inicio: fmt(startMonth), fim: fmt(endMonth) };
      }

      if (preset === 'THIS_MONTH') {
        var start = new Date(y, m, 1);
        var end = new Date(y, m + 1, 0); return { inicio: fmt(start), fim: fmt(end) };
      } else if (preset === 'LAST_MONTH') {
        var startLast = new Date(y, m - 1, 1);
        var endLast = new Date(y, m, 0); return { inicio: fmt(startLast), fim: fmt(endLast) };
      } else if (preset === 'LAST_7_DAYS') {
        var d7 = new Date(now.getTime() - (6 * 24 * 60 * 60 * 1000)); return { inicio: fmt(d7), fim: fmt(now) };
      } else if (preset === 'LAST_30_DAYS') {
        var d30 = new Date(now.getTime() - (29 * 24 * 60 * 60 * 1000)); return { inicio: fmt(d30), fim: fmt(now) };
      } else if (preset === 'THIS_YEAR') { return { inicio: y + '-01-01', fim: y + '-12-31' };
      } else if (preset === 'ALL') { return { inicio: '', fim: '' };
      }
      return null;
    }

    function onDatePresetChange() {
      var presetEl = document.getElementById('filter-lan-preset');
      if (!presetEl) return;
      var preset = presetEl.value;
      if (preset === 'CUSTOM') {
        var startInput = document.getElementById('filter-lan-data-inicio');
        if (startInput) startInput.focus();
        updateFilterActiveBadge();
        return;
      }

      var qYearEl = document.getElementById('quick-launch-year-select');
      var chosenYear = qYearEl ? qYearEl.value : new Date().getFullYear();

      var range = computeDateRangeByPreset(preset, chosenYear);
      if (range) {
        var startEl = document.getElementById('filter-lan-data-inicio');
        var endEl = document.getElementById('filter-lan-data-fim');
        if (startEl) startEl.value = range.inicio;
        if (endEl) endEl.value = range.fim;
      }

      // Sincroniza o seletor rápido no topo da tabela
      var qMonthEl = document.getElementById('quick-launch-month-select');
      if (qMonthEl) {
        if (/^(0[1-9]|1[0-2])$/.test(preset)) {
          qMonthEl.value = preset;
        } else if (preset === 'THIS_MONTH') {
          qMonthEl.value = String(new Date().getMonth() + 1).padStart(2, '0');
        } else if (preset === 'ALL' || preset === 'THIS_YEAR') {
          qMonthEl.value = 'ALL';
        }
      }

      updateFilterActiveBadge();
      loadLaunches(1);
    }

    function onQuickMonthSelectChange() {
      var qMonthEl = document.getElementById('quick-launch-month-select');
      var qYearEl = document.getElementById('quick-launch-year-select');
      if (!qMonthEl || !qYearEl) return;

      var monthVal = qMonthEl.value;
      var yearVal = qYearEl.value;

      var presetEl = document.getElementById('filter-lan-preset');
      var range;
      if (monthVal === 'ALL') {
        range = { inicio: yearVal + '-01-01', fim: yearVal + '-12-31' };
        if (presetEl) presetEl.value = 'THIS_YEAR';
      } else {
        range = computeDateRangeByPreset(monthVal, yearVal);
        if (presetEl) presetEl.value = monthVal;
      }

      if (range) {
        var startEl = document.getElementById('filter-lan-data-inicio');
        var endEl = document.getElementById('filter-lan-data-fim');
        if (startEl) startEl.value = range.inicio;
        if (endEl) endEl.value = range.fim;

    function navigateLaunchMonth(direction) {
      var qMonthEl = document.getElementById('quick-launch-month-select');
      var qYearEl = document.getElementById('quick-launch-year-select');
      if (!qMonthEl || !qYearEl) return;

      var curM = parseInt(qMonthEl.value, 10);
      if (isNaN(curM) || curM < 1 || curM > 12) {
        curM = new Date().getMonth() + 1;
      }
      var curY = parseInt(qYearEl.value, 10) || new Date().getFullYear();

      curM += direction;
      if (curM > 12) {
        curM = 1;
        curY += 1;
      } else if (curM < 1) {
        curM = 12;
        curY -= 1;
      }

      var newMStr = String(curM).padStart(2, '0');
      qMonthEl.value = newMStr;

      var foundYear = false;
      for (var i = 0; i < qYearEl.options.length; i++) {
        if (qYearEl.options[i].value === String(curY)) {
          foundYear = true;
          break;
        }
      }
      if (!foundYear) {
        var opt = document.createElement('option');
        opt.value = String(curY);
        opt.textContent = String(curY);
        qYearEl.appendChild(opt);
      }
      qYearEl.value = String(curY);

      onQuickMonthSelectChange();
    }

    function updateFilterActiveBadge() {

      if (!badge) return;
      var parts = [];

      var busca = document.getElementById('filter-lan-busca') ? document.getElementById('filter-lan-busca').value.trim() : '';
      if (busca) parts.push('Busca: "' + busca + '"');

      var preset = document.getElementById('filter-lan-preset') ? document.getElementById('filter-lan-preset').value : '';
      var dIni = document.getElementById('filter-lan-data-inicio') ? document.getElementById('filter-lan-data-inicio').value : '';
      var dFim = document.getElementById('filter-lan-data-fim') ? document.getElementById('filter-lan-data-fim').value : '';

      var monthNames = {
        '01': 'Janeiro', '02': 'Fevereiro', '03': 'Março', '04': 'Abril',
        '05': 'Maio', '06': 'Junho', '07': 'Julho', '08': 'Agosto',
        '09': 'Setembro', '10': 'Outubro', '11': 'Novembro', '12': 'Dezembro'
      };

      if (monthNames[preset]) {
        var qY = document.getElementById('quick-launch-year-select');
        var yrStr = qY ? qY.value : '';
        parts.push('Mês: ' + monthNames[preset] + (yrStr ? '/' + yrStr : ''));
      } else if (preset === 'THIS_MONTH') {
        parts.push('Período: Este Mês');
      } else if (preset === 'LAST_MONTH') {
        parts.push('Período: Mês Passado');
      } else if (preset === 'LAST_7_DAYS') {
        parts.push('Período: Últimos 7 dias');
      } else if (preset === 'LAST_30_DAYS') {
        parts.push('Período: Últimos 30 dias');
      } else if (preset === 'THIS_YEAR') {
        parts.push('Período: Este Ano');
      } else if (preset === 'ALL') {
        parts.push('Período: Todos');
      } else if (dIni || dFim) {
        parts.push('De ' + (dIni ? UIHelpers.formatDateBr(dIni) : 'Início') + ' até ' + (dFim ? UIHelpers.formatDateBr(dFim) : 'Fim'));
      }

      var tipo = document.getElementById('filter-lan-tipo') ? document.getElementById('filter-lan-tipo').value : '';
      if (tipo) parts.push(tipo === 'ENTRADA' ? 'Entradas' : 'Saídas');

      var situacao = document.getElementById('filter-lan-situacao') ? document.getElementById('filter-lan-situacao').value : '';
      if (situacao) parts.push(situacao);

      var conta = document.getElementById('filter-lan-conta') ? document.getElementById('filter-lan-conta').value : '';
      if (conta) parts.push('Conta filtrada');

      var cat = document.getElementById('filter-lan-categoria') ? document.getElementById('filter-lan-categoria').value : '';
      if (cat) parts.push('Categoria filtrada');

      badge.innerHTML = '<span class="badge" style="background:var(--primary-soft); color:var(--primary); font-size:0.75rem;">' + (parts.length > 0 ? parts.join(' • ') : 'Mês Atual') + '</span>';
    }

    function initDefaultDates() {
      var now = new Date();
      var today = now.toISOString().substring(0, 10);
      var currentMonth = today.substring(0, 7);
      var curYear = now.getFullYear();
      var curMonthNum = String(now.getMonth() + 1).padStart(2, '0');

      var dateIds = ['lan-data', 'lan-competencia', 'rec-inicio', 'bank-data-inicial', 'trf-data', 'div-data-origem', 'inv-data-ref', 'mvi-data', 'cal-data-ref'];
      for (var i = 0; i < dateIds.length; i++) {
        var el = document.getElementById(dateIds[i]);
        if (el && !el.value) el.value = today;
      }

      // Data de 1º vencimento de empréstimo: padrão 30 dias à frente (próximo mês), nunca hoje
      var dNextEmp = new Date(now.getFullYear(), now.getMonth() + 1, now.getDate());
      var nextMonthEmpIso = dNextEmp.getFullYear() + '-' + String(dNextEmp.getMonth() + 1).padStart(2, '0') + '-' + String(dNextEmp.getDate()).padStart(2, '0');
      var empDataEl = document.getElementById('emp-data-inicial');
      if (empDataEl && (!empDataEl.value || empDataEl.value === today)) {
        empDataEl.value = nextMonthEmpIso;
      }
      var monthIds = ['dash-month-select', 'rec-competencia-input'];
      for (var j = 0; j < monthIds.length; j++) {
        var mEl = document.getElementById(monthIds[j]);
        if (mEl && !mEl.value) mEl.value = currentMonth;
      }

      // Popula anos no quick selector de Lançamentos (ano atual - 2 até ano atual + 3)
      var qYearEl = document.getElementById('quick-launch-year-select');
      if (qYearEl && qYearEl.options.length === 0) {
        for (var yr = curYear - 2; yr <= curYear + 3; yr++) {
          var opt = document.createElement('option');
          opt.value = String(yr);
          opt.textContent = String(yr);
          if (yr === curYear) opt.selected = true;
          qYearEl.appendChild(opt);
        }
      }

      var qMonthEl = document.getElementById('quick-launch-month-select');
      if (qMonthEl) {
        qMonthEl.value = curMonthNum;
      }

      // Por padrão SEMPRE define o Mês Atual para os filtros de lançamentos
      var presetEl = document.getElementById('filter-lan-preset');
      if (presetEl) {
        presetEl.value = 'THIS_MONTH';
      }

      var defaultRange = computeDateRangeByPreset('THIS_MONTH', curYear);
      var dIniEl = document.getElementById('filter-lan-data-inicio');
      var dFimEl = document.getElementById('filter-lan-data-fim');
      if (defaultRange) {
        if (dIniEl && !dIniEl.value) dIniEl.value = defaultRange.inicio;
        if (dFimEl && !dFimEl.value) dFimEl.value = defaultRange.fim;
      }

      updateFilterActiveBadge();
    }

    function init() {
      try {
        var ua = navigator.userAgent || '';
        var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        var isSmallWindow = (window.innerWidth <= 768 && window.innerWidth > 0);
        if (isSmallWindow || (isMobileUA && window.innerWidth < 768)) {
          document.documentElement.classList.add('is-mobile-device');
          document.body.classList.add('is-mobile-device');
        } else {
          document.documentElement.classList.remove('is-mobile-device');
          document.body.classList.remove('is-mobile-device');
        }
        window.addEventListener('resize', function () {
          if (window.innerWidth >= 768) {
            document.documentElement.classList.remove('is-mobile-device');
            document.body.classList.remove('is-mobile-device');
            var sb = document.querySelector('.sidebar');
            if (sb) sb.classList.remove('mobile-open');
          } else {
            document.documentElement.classList.add('is-mobile-device');
            document.body.classList.add('is-mobile-device');
          }
        });
      } catch (eMobile) {}

      try {
        var cachedTheme = localStorage.getItem('finpess_theme_cache');
        if (cachedTheme) applyThemeDom(cachedTheme);
      } catch (e) {}

      try {
        if (localStorage.getItem('fin_privacy_masked') === 'true') {
          document.body.classList.add('privacy-masked');
          var btnPriv = document.getElementById('btn-privacy-toggle');
          if (btnPriv) {
            btnPriv.setAttribute('title', 'Exibir valores financeiros (Modo Privacidade ativo)');
            var eyeSvg = btnPriv.querySelector('svg');
            if (eyeSvg) {
              eyeSvg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            }
          }
          var pText = document.getElementById('privacy-toggle-text');
          if (pText) pText.textContent = 'Exibir';
        }
      } catch (e) {}

      try {
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (isStandalone) {
          document.body.classList.add('is-pwa-standalone');
          var btnPwa = document.getElementById('btn-pwa-install');
          if (btnPwa) btnPwa.style.display = 'none';
        }
      } catch (ePwa) {}

      initDefaultDates();

      var storedToken = localStorage.getItem('fin_session_token') ||
                        sessionStorage.getItem('fin_session_token') ||
                        '';

      var authBox = document.getElementById('auth-screen-container');
      var mainBox = document.getElementById('main-authorized-content');
      var lockBox = document.getElementById('unauthorized-lock-screen');

      // Se não há token gravado no navegador, exibe a tela de login imediatamente sem requisição inútil
      if (!storedToken) {
        if (mainBox) mainBox.style.display = 'none';
        if (lockBox) lockBox.style.display = 'none';
        if (authBox) authBox.style.display = 'flex';
        return;
      }

      callServer('session.getBootstrap', {}, function (res) {

        if (res.authenticated === false) {
          if (mainBox) mainBox.style.display = 'none';
          if (lockBox) lockBox.style.display = 'none';
          if (authBox) authBox.style.display = 'flex';
          return;
        }

        if (!res.authorized) {
          if (res.user && res.user.tema_preferido) applyThemeDom(res.user.tema_preferido);
          if (mainBox) mainBox.style.display = 'none';
          if (authBox) authBox.style.display = 'none';
          if (lockBox) {
            lockBox.style.display = 'block';
            var elEmail = document.getElementById('lock-user-email');
            var elStatus = document.getElementById('lock-user-status');
            if (elEmail) elEmail.textContent = (res.user && res.user.email) || '';
            if (elStatus) elStatus.textContent = (res.user && res.user.status) || 'PENDENTE';
          }
          return;
        }

        if (res.sessionToken) {
          try {
            localStorage.setItem('fin_session_token', res.sessionToken);
            sessionStorage.setItem('fin_session_token', res.sessionToken);
          } catch (eStorage) {}
        }

        if (authBox) authBox.style.display = 'none';
        if (lockBox) lockBox.style.display = 'none';
        if (mainBox) mainBox.style.display = 'grid';

        state.user = res.profile.user;
        if (res.user && res.user.hasPassword !== undefined) {
          state.user.hasPassword = res.user.hasPassword;
        }
        state.categories = res.categories || [];
        state.dashboard = res.dashboard;
        state.bankAccounts = (res.dashboard && res.dashboard.contas_bancarias) || [];
        state.telegram = res.telegram;

        // Prevalece preferência salva do usuário no servidor sobre configuração automática
        if (state.user && state.user.tema_preferido) {
          applyThemeDom(state.user.tema_preferido);
        }

        updateUserAvatarDom();

        populateSelects();
        renderDashboard(state.dashboard);
        renderTelegramStatus();
        populateFilterSelects();
        renderCategoriesTable();
        if (typeof UIHelpers !== 'undefined' && UIHelpers.attachCurrencyMasks) {
          UIHelpers.attachCurrencyMasks();
        }
        state.lastSyncVersion = res.syncVersion || Date.now();
        if (res.onlineUsers) {
          renderOnlineUsersPresence(res.onlineUsers);
        }
        startAutoSyncEngine();
        updateSyncIndicator('updated');
        if (res.notificationsBadge !== undefined) {
          updateNotificationsBadge(res.notificationsBadge, res.hasCriticalNotification);
        }
        checkAndShowInitialPopup();
      }, { blocking: true, message: 'Inicializando o Finpess...' });
    }

    function loginWithGoogle(emailOverride) {
      var btn1 = document.getElementById('btn-auth-google-login');
      var btn2 = document.getElementById('btn-auth-google-reg');
      if (btn1) { btn1.disabled = true; btn1.style.opacity = '0.7'; }
      if (btn2) { btn2.disabled = true; btn2.style.opacity = '0.7'; }

      var payload = {};
      if (emailOverride && typeof emailOverride === 'string') {
        payload.email = emailOverride.trim().toLowerCase();
      }

      callServer('auth.googleLogin', payload, function (res) {
        if (btn1) { btn1.disabled = false; btn1.style.opacity = '1'; }
        if (btn2) { btn2.disabled = false; btn2.style.opacity = '1'; }

        if (!res || !res.ok) {
          if (res && res.needEmailInput) {
            var typed = prompt('Por favor, informe seu e-mail do Google (ex: davisdias2811@gmail.com):');
            if (typed && typed.trim() && typed.indexOf('@') !== -1) {
              loginWithGoogle(typed.trim().toLowerCase());
            } else if (typed !== null) {
              showToast('E-mail do Google inválido.', 'error');
            }
            return;
          }
          if (res && res.requirePassword) {
            var pass = prompt('Identificado como Proprietário em janela anônima. Para sua segurança, digite sua senha de acesso do proprietário:');
            if (pass && pass.trim()) {
              callServer('auth.login', { email: payload.email, senha: pass.trim() }, function (loginRes) {
                if (loginRes && loginRes.ok) {
                  if (loginRes.sessionToken) {
                    localStorage.setItem('fin_session_token', loginRes.sessionToken);
                    sessionStorage.setItem('fin_session_token', loginRes.sessionToken);
                  }
                  showToast('Identidade de Proprietário confirmada com sucesso!', 'success');
                  init();
                } else {
                  showToast((loginRes && loginRes.error) || 'Senha de proprietário incorreta.', 'error');
                }
              }, { blocking: true, message: 'Validando credenciais do proprietário...' });
            }
            return;
          }
          showToast((res && res.error) || 'Não foi possível conectar com a Conta Google.', 'error');
          return;
        }

        if (res.status === 'PENDENTE') {
          var authBox = document.getElementById('auth-screen-container');
          var mainBox = document.getElementById('main-authorized-content');
          var lockBox = document.getElementById('unauthorized-lock-screen');
          if (mainBox) mainBox.style.display = 'none';
          if (authBox) authBox.style.display = 'none';
          if (lockBox) {
            lockBox.style.display = 'block';
            var elEmail = document.getElementById('lock-user-email');
            var elStatus = document.getElementById('lock-user-status');
            if (elEmail) elEmail.textContent = (res.user && res.user.email) || '';
            if (elStatus) elStatus.textContent = 'PENDENTE';
          }
          if (res.sessionToken) {
            localStorage.setItem('fin_session_token', res.sessionToken);
            sessionStorage.setItem('fin_session_token', res.sessionToken);
          }
          showToast(res.message || 'Cadastro realizado com Conta Google! Aguarde a aprovação do proprietário.', 'info');
          return;
        }

        if (res.sessionToken) {
          localStorage.setItem('fin_session_token', res.sessionToken);
          sessionStorage.setItem('fin_session_token', res.sessionToken);
        }
        showToast(res.message || 'Login com Conta Google realizado com sucesso!', 'success');
        init();
      }, { blocking: true, message: 'Autenticando com Conta Google...' });
    }

    function submitLogin(event) {
      if (event && event.preventDefault) event.preventDefault();
      var emailEl = document.getElementById('login-email');
      var senhaEl = document.getElementById('login-senha');
      var email = emailEl ? emailEl.value.trim().toLowerCase() : '';
      var senha = senhaEl ? senhaEl.value.trim() : '';
      var btn = document.getElementById('btn-login-submit');

      if (!email || !senha) {
        showToast('Preencha seu e-mail e sua senha de acesso.', 'error');
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Verificando credenciais...</span>';
      }

      callServer('auth.login', { email: email, senha: senha }, function (res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<span>Acessar Painel Financeiro</span>';
        }
        if (!res || !res.ok) {
          if (res && res.status === 'PENDENTE') {
            var authBox = document.getElementById('auth-screen-container');
            var mainBox = document.getElementById('main-authorized-content');
            var lockBox = document.getElementById('unauthorized-lock-screen');
            if (mainBox) mainBox.style.display = 'none';
            if (authBox) authBox.style.display = 'none';
            if (lockBox) {
              lockBox.style.display = 'block';
              var elEmail = document.getElementById('lock-user-email');
              var elStatus = document.getElementById('lock-user-status');
              if (elEmail) elEmail.textContent = email;
              if (elStatus) elStatus.textContent = 'PENDENTE';
            }
            showToast('Acesso aguardando aprovação do proprietário da planilha.', 'warning');
            return;
          }
          showToast((res && res.error) || 'Falha ao autenticar.', 'error');
          return;
        }
        if (res.sessionToken) {
          localStorage.setItem('fin_session_token', res.sessionToken);
          sessionStorage.setItem('fin_session_token', res.sessionToken);
        }
        showToast('Login realizado com sucesso! Bem-vindo(a).', 'success');
        init();
      });
    }

    function switchAuthTab(tab) {

      var tabReg = document.getElementById('tab-auth-register');
      var formLogin = document.getElementById('form-auth-login');
      var formReg = document.getElementById('form-auth-register');

        ' | Pendentes: ' + UIHelpers.formatBrl(dash.pendentes.receitas_pendentes_mes_centavos);

      document.getElementById('kpi-despesas-confirmadas').textContent = UIHelpers.formatBrl(dash.confirmados.despesas_pagas_mes_centavos);
      document.getElementById('kpi-despesas-previstas-sub').textContent =

        ' | Pendentes: ' + UIHelpers.formatBrl(dash.pendentes.despesas_pendentes_mes_centavos);

      document.getElementById('kpi-resultado-realizado').textContent = UIHelpers.formatBrl(dash.confirmados.resultado_mensal_realizado_centavos);
      document.getElementById('kpi-resultado-projetado-sub').textContent =
        'Projetado c/ previsões: ' + UIHelpers.formatBrl(dash.estimados.resultado_mensal_projetado_centavos);

      // Renderiza mini-gráficos Sparklines para os 4 cards principais de KPI
      function renderSparkline(containerId, color, baseVal) {
        var el = document.getElementById(containerId);
        if (!el) return;
        var seed = Math.max(Math.abs(baseVal || 100), 1000);
        var pts = [
          seed * 0.72, seed * 0.85, seed * 0.81, seed * 0.94, seed * 0.89, seed * 0.98, seed
        ];
        var w = 180, h = 28;
        var min = Math.min.apply(null, pts);
        var max = Math.max.apply(null, pts);
        var range = (max - min) || 1;
        var coords = pts.map(function (v, idx) {
          var x = (idx / (pts.length - 1)) * w;
          var y = h - ((v - min) / range) * (h - 8) - 4;
          return x.toFixed(1) + ',' + y.toFixed(1);
        });
        var pathD = 'M ' + coords.join(' L ');
        var fillD = pathD + ' L ' + w + ',' + h + ' L 0,' + h + ' Z';
        el.innerHTML =
          '<svg width="100%" height="28" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="display:block;">' +
            '<path d="' + fillD + '" fill="' + color + '" fill-opacity="0.12" />' +
            '<path d="' + pathD + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />' +
          '</svg>';
      }

      renderSparkline('sparkline-saldo', 'var(--primary)', dash.confirmados.saldo_bancario_consolidado_centavos);
      renderSparkline('sparkline-receitas', 'var(--success)', dash.confirmados.receitas_realizadas_mes_centavos);
      renderSparkline('sparkline-despesas', 'var(--danger)', dash.confirmados.despesas_pagas_mes_centavos);
      renderSparkline('sparkline-resultado', 'var(--predicted)', dash.confirmados.resultado_mensal_realizado_centavos);

      // Cálculo do Índice de Saúde Financeira (0 a 100)
      var rec = dash.confirmados.receitas_realizadas_mes_centavos || 0;
      var desp = dash.confirmados.despesas_pagas_mes_centavos || 0;
      var vencidas = dash.pendentes.contas_vencidas_total_centavos || 0;
      var score = 100;
      if (vencidas > 0) score -= 35;
      if (rec > 0) {
        var ratio = desp / rec;
        if (ratio > 1.0) score -= 40;
        else if (ratio > 0.8) score -= 20;
        else if (ratio > 0.6) score -= 10;
      } else if (desp > 0) {
        score -= 25;
      }
      if (score < 15) score = 15;
      if (score > 100) score = 100;

      var elScoreVal = document.getElementById('health-score-val');
      var elScoreBadge = document.getElementById('health-score-badge');
      var elScoreRadial = document.getElementById('health-score-radial');
      var elScoreDesc = document.getElementById('health-score-desc');
      if (elScoreVal) elScoreVal.textContent = String(score);
      if (elScoreBadge) {
        if (score >= 80) {
          elScoreBadge.textContent = 'Excelente';
          elScoreBadge.className = 'badge badge-confirmado';
          if (elScoreRadial) elScoreRadial.style.background = 'conic-gradient(var(--success) ' + score + '%, var(--border-color) 0)';
          if (elScoreDesc) elScoreDesc.textContent = 'Seus gastos essenciais e compromissos estão saudáveis em relação às receitas.';
        } else if (score >= 50) {
          elScoreBadge.textContent = 'Atenção';
          elScoreBadge.className = 'badge badge-pendente';
          if (elScoreRadial) elScoreRadial.style.background = 'conic-gradient(#f59e0b ' + score + '%, var(--border-color) 0)';
          if (elScoreDesc) elScoreDesc.textContent = 'Atenção ao percentual de despesas e contas próximas ao vencimento.';
        } else {
          elScoreBadge.textContent = 'Crítico';
          elScoreBadge.className = 'badge badge-vencido';
          if (elScoreRadial) elScoreRadial.style.background = 'conic-gradient(var(--danger) ' + score + '%, var(--border-color) 0)';
          if (elScoreDesc) elScoreDesc.textContent = 'Despesas superaram as receitas ou existem contas vencidas que demandam ação.';
        }
      }

      document.getElementById('kpi-contas-vencidas').textContent = UIHelpers.formatBrl(dash.pendentes.contas_vencidas_total_centavos);
      document.getElementById('kpi-contas-vencidas-qtd').textContent = dash.pendentes.contas_vencidas_quantidade + ' compromisso(s) vencido(s)';

      document.getElementById('kpi-contas-a-vencer').textContent = UIHelpers.formatBrl(dash.pendentes.contas_a_vencer_total_centavos);
      document.getElementById('kpi-contas-a-vencer-qtd').textContent = dash.pendentes.contas_a_vencer_quantidade + ' compromisso(s) a vencer';

      document.getElementById('kpi-saldo-projetado-mes').textContent = UIHelpers.formatBrl(dash.estimados.saldo_final_mes_projetado_centavos);
      var comp = dash.estimados.composicao_patrimonio;
      document.getElementById('kpi-patrimonio-estimado').textContent = UIHelpers.formatBrl(comp.patrimonio_liquido_estimado_centavos);

      document.getElementById('dash-chart-evolucao').innerHTML = UIHelpers.renderMonthlyBarChartSvg(dash.evolucao_mensal);

      // Gastos por categoria (Bento Grid / Zen Budget Bar)
      var catRows = (dash.evolucao_gastos_por_categoria || []).map(function (c) {
        var totalGasto = (c.confirmado_centavos || 0) + (c.previsto_centavos || 0) + (c.pendente_centavos || 0);
        var budgetBar = UIHelpers.renderCategoryBudgetBar(totalGasto, c.orcamento_centavos);
        return (
          '<tr>' +
          '<td><strong>' + UIHelpers.escapeHtml(c.categoria_nome) + '</strong></td>' +
          '<td class="col-money">' + UIHelpers.formatBrl(c.confirmado_centavos) + '</td>' +
          '<td class="col-money">' + UIHelpers.formatBrl(c.previsto_centavos + c.pendente_centavos) + '</td>' +
          '<td style="min-width:180px;">' + budgetBar + '</td>' +
          '</tr>'
        );
      }).join('');
      document.getElementById('dash-categorias-list').innerHTML = catRows
        ? '<table class="data-table"><thead><tr><th>Categoria</th><th class="col-money">Confirmado</th><th class="col-money">Previsto/Pend.</th><th>Orçamento & Limite Zen</th></tr></thead><tbody>' + catRows + '</tbody></table>'
        : '<p style="color:var(--text-muted);">Nenhuma despesa registrada neste mês.</p>';

      // Vencimentos
      var vencItems = (dash.pendentes.contas_vencidas || []).concat(dash.pendentes.contas_a_vencer || []);
      var vencRows = vencItems.slice(0, 10).map(function (v) {
        return (
          '<tr>' +
          '<td>' + UIHelpers.formatDateBr(v.data_lancamento) + '</td>' +
          '<td>' + UIHelpers.escapeHtml(v.descricao) + '</td>' +
          '<td>' + UIHelpers.renderBadge(v.situacao) + '</td>' +
          '<td class="col-money">' + UIHelpers.formatBrl(v.valor_centavos) + '</td>' +
          '<td><button type="button" class="btn btn-success btn-sm" onclick="App.confirmLaunchById(\'' + UIHelpers.escapeHtml(v.id) + '\')">Confirmar</button></td>' +
          '</tr>'
        );
      }).join('');
      document.getElementById('dash-vencimentos-list').innerHTML = vencRows
        ? '<table class="data-table"><thead><tr><th>Vencimento</th><th>Descrição</th><th>Status</th><th class="col-money">Valor</th><th>Ação</th></tr></thead><tbody>' + vencRows + '</tbody></table>'
        : '<p style="color:var(--text-muted);">Não há compromissos pendentes ou vencidos.</p>';

      // Composição do patrimônio
      document.getElementById('dash-patrimonio-detalhe').innerHTML =
        '<table class="data-table"><tbody>' +
        '<tr><td>Saldo Bancário Consolidado (Confirmado)</td><td>' + UIHelpers.renderBadge('CONFIRMADO') + '</td><td class="col-money">' + UIHelpers.formatBrl(comp.saldo_bancario_confirmado_centavos) + '</td></tr>' +
        '<tr><td>Carteira de Investimentos (Valor Informado)</td><td>' + UIHelpers.renderBadge('ESTIMADO') + '</td><td class="col-money">' + UIHelpers.formatBrl(comp.carteira_investimentos_informada_centavos) + '</td></tr>' +
        '<tr><td>(-) Saldo Devedor de Empréstimos Ativos</td><td>' + UIHelpers.renderBadge('PREVISTO') + '</td><td class="col-money">-' + UIHelpers.formatBrl(comp.passivos_emprestimos_ativos_centavos) + '</td></tr>' +
        '<tr><td>(-) Acordos Ativos de Dívidas</td><td>' + UIHelpers.renderBadge('PREVISTO') + '</td><td class="col-money">-' + UIHelpers.formatBrl(comp.passivos_dividas_acordo_ativo_centavos) + '</td></tr>' +
        '<tr><td><strong>(=) Patrimônio Líquido Estimado</strong></td><td>' + UIHelpers.renderBadge('ESTIMADO') + '</td><td class="col-money"><strong>' + UIHelpers.formatBrl(comp.patrimonio_liquido_estimado_centavos) + '</strong></td></tr>' +

      if (UIHelpers && UIHelpers.initInfoPopovers) {

      }

    function submitLaunch(ev) {
      ev.preventDefault();
      if (state.isSubmittingLaunch) return;

      var valorCentavos = UIHelpers.parseInputToCentavos(document.getElementById('lan-valor').value);
      if (valorCentavos <= 0) {
        showToast('Informe um valor maior que zero.', 'error');
        return;
      }

      var form = ev.target;
      var btnSubmit = form ? form.querySelector('button[type="submit"]') : null;
      var originalBtnText = btnSubmit ? btnSubmit.innerHTML : 'Registrar Lançamento';

      state.isSubmittingLaunch = true;
      if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<span>Registrando...</span>';
      }

      var payload = {
        tipo: document.getElementById('lan-tipo').value,
        descricao: document.getElementById('lan-descricao').value,
        valor_centavos: valorCentavos,
        data_lancamento: document.getElementById('lan-data').value,
        data_competencia: document.getElementById('lan-competencia').value || document.getElementById('lan-data').value,
        categoria_id: document.getElementById('lan-categoria').value,
        subcategoria_id: document.getElementById('lan-subcategoria').value,

      };

      callServer('launches.create', payload, function () {

          btnSubmit.disabled = false;

        }
        showToast('Lançamento registrado com sucesso!', 'success');

          btnSubmit.disabled = false;

    function toggleNewLaunchCard(forceOpen) {
      var card = document.getElementById('card-new-launch');
      var label = document.getElementById('label-btn-new-launch');
      if (!card) return;
      var isOpen = card.style.display !== 'none';
      var shouldOpen = typeof forceOpen === 'boolean' ? forceOpen : !isOpen;
      if (shouldOpen) {
        card.style.display = 'block';
        if (label) label.textContent = '✕ Fechar Formulário';
        var descInput = document.getElementById('lan-descricao');
        if (descInput) {
          descInput.focus();
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      } else {
        card.style.display = 'none';
        if (label) label.textContent = '+ Novo Lançamento';
      }
    }

    function closeAllActionDropdowns() {
      var menus = document.querySelectorAll('.table-dropdown-menu');
      for (var i = 0; i < menus.length; i++) {
        menus[i].classList.remove('show');
        menus[i].classList.remove('dropup');
      }
      var btns = document.querySelectorAll('.btn-dots-action.active');
      for (var j = 0; j < btns.length; j++) {
        btns[j].classList.remove('active');
        var parent = btns[j].closest('.table-actions-dropdown');
        if (parent) parent.classList.remove('active');
      }
    }

    function toggleRowDropdown(ev, dropdownId) {
      if (ev) {
        ev.stopPropagation();
        ev.preventDefault();
      }
      var target = document.getElementById(dropdownId);
      if (!target) return;
      var wasOpen = target.classList.contains('show');
      closeAllActionDropdowns();
      if (!wasOpen) {
        if (ev && ev.currentTarget) {
          var btn = ev.currentTarget;
          btn.classList.add('active');
          var parent = btn.closest('.table-actions-dropdown');
          if (parent) parent.classList.add('active');

          // Verifica se a linha clicada está na parte inferior da tabela ou da tela
          var tr = btn.closest('tr');
          var tbody = tr ? tr.parentElement : null;
          var isBottomRow = false;
          if (tbody && tr) {
            var rows = Array.prototype.slice.call(tbody.children);
            var idx = rows.indexOf(tr);
            if (rows.length <= 3 && idx > 0) {
              isBottomRow = true;
            } else if (idx >= Math.max(0, rows.length - 2)) {
              isBottomRow = true;
            }
          }

          var rect = btn.getBoundingClientRect();
          var spaceBelow = window.innerHeight - rect.bottom;
          if (isBottomRow || spaceBelow < 210) {
            target.classList.add('dropup');
          } else {
            target.classList.remove('dropup');
          }
        }
        target.classList.add('show');
      }
    }

    function handleReceiptFile(event) {
      var file = event.target && event.target.files && event.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        showToast('A imagem excede o tamanho máximo permitido de 10 MB.', 'error');
        return;
      }
      var reader = new FileReader();
      var btn = document.getElementById('btn-scan-receipt');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Lendo cupom...</span>';
      }
      showToast('Lendo dados do cupom fiscal com inteligência artificial...', 'info');

      reader.onload = function (e) {
        var dataUrl = e.target.result;
        var base64 = dataUrl.split(',')[1];
        var mimeType = file.type || 'image/jpeg';

        callServer('receipt.scan', { imageBase64: base64, mimeType: mimeType }, function (res) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg><span>📸 Ler Cupom (Foto)</span>';
          }
          var d = res.data;
          if (document.getElementById('lan-tipo')) document.getElementById('lan-tipo').value = 'SAIDA';
          if (document.getElementById('lan-descricao')) document.getElementById('lan-descricao').value = d.descricao;
          if (document.getElementById('lan-valor')) {
            document.getElementById('lan-valor').value = UIHelpers.formatCentavosToBrlInput(d.valor_centavos);
          }
          if (document.getElementById('lan-data')) document.getElementById('lan-data').value = d.data;
          if (document.getElementById('lan-competencia')) document.getElementById('lan-competencia').value = d.data;
          if (document.getElementById('lan-forma')) document.getElementById('lan-forma').value = d.forma_pagamento;
          if (d.categoria_id && document.getElementById('lan-categoria')) {
            document.getElementById('lan-categoria').value = d.categoria_id;
            populateSubcategoriesForLaunch();
            if (d.subcategoria_id && document.getElementById('lan-subcategoria')) {
              document.getElementById('lan-subcategoria').value = d.subcategoria_id;
            }
          }
          if (d.conta_bancaria_id && document.getElementById('lan-conta')) {
            document.getElementById('lan-conta').value = d.conta_bancaria_id;
          }
          if (document.getElementById('lan-obs')) {
            document.getElementById('lan-obs').value = 'Importado via foto do cupom fiscal';
          }
          toggleNewLaunchCard(true);

          showToast('Cupom fiscal lido com sucesso! Revise os campos e clique em Registrar.', 'success');
        }, function (err) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg><span>📸 Ler Cupom (Foto)</span>';
          }
          showToast('Erro ao ler cupom fiscal: ' + err.message, 'error');
        });
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function collectLaunchFilterPayload(page) {
      var buscaEl = document.getElementById('filter-lan-busca');
      var tipoEl = document.getElementById('filter-lan-tipo');
      var sitEl = document.getElementById('filter-lan-situacao');
      var contaEl = document.getElementById('filter-lan-conta');
      var catEl = document.getElementById('filter-lan-categoria');
      var dIniEl = document.getElementById('filter-lan-data-inicio');
      var dFimEl = document.getElementById('filter-lan-data-fim');

      var situacaoVal = sitEl ? sitEl.value : '';

      var dIni = dIniEl ? dIniEl.value : '';
      var dFim = dFimEl ? dFimEl.value : '';
      var preset = (document.getElementById('filter-lan-preset') || {}).value || 'THIS_MONTH';

        situacao: situacaoVal,

    function loadLaunches(page, forceRefresh) {
      state.currentPage = page || 1;
      var curMonth = new Date().toISOString().substring(0, 7);
      if (!state.recurringForecastsSyncedMonth) {
        state.recurringForecastsSyncedMonth = curMonth;
        callServer('recurring.generateForecasts', { competencia: curMonth }, function () {
          if (state.currentModule === 'launches') {
            var pSync = collectLaunchFilterPayload(state.currentPage || 1);
            callServer('launches.list', pSync, function (rSync) {
              state.launchesData = rSync.data;
              renderLaunchesView(rSync.data);
            }, { quiet: true });
          }
        }, { quiet: true });
      }

      var payload = collectLaunchFilterPayload(page);
      if (state.launchesData && (page === 1 || page === state.currentPage) && !forceRefresh) {
        renderLaunchesView(state.launchesData);
        callServer('launches.list', payload, function (res) {
          state.launchesData = res.data;
          renderLaunchesView(res.data);
        }, { quiet: true });
        return;
      }

      callServer('launches.list', payload, function (res) {
        state.launchesData = res.data;
        renderLaunchesView(res.data);
      });
    }

    function changeLaunchSituation(launchId, newStatus, previousStatus, selectEl) {
      if (!launchId || !newStatus || newStatus === previousStatus) return;

      if (newStatus === 'CANCELADO') {
        openConfirmModal(
          'Excluir Lançamento Financeiro',
          'Tem certeza de que deseja excluir este lançamento? Os efeitos financeiros deste registro serão removidos dos saldos e o registro não será mais listado.',
          function () {
            if (selectEl) selectEl.disabled = true;
            callServer('launches.cancel', { id: launchId, motivo: 'Cancelado via alteração rápida de situação' }, function () {
              showToast('Lançamento cancelado com sucesso!', 'success');
              loadDashboard();
              loadLaunches(state.currentPage || 1);
            }, function (err) {
              if (selectEl) {
                selectEl.disabled = false;
                selectEl.value = previousStatus;
                selectEl.className = 'status-select-pill status-' + previousStatus;
              }
              showToast('Erro ao cancelar lançamento: ' + (err && err.message ? err.message : err), 'error');
            });
          },
          function () {
            if (selectEl) {
              selectEl.value = previousStatus;
              selectEl.className = 'status-select-pill status-' + previousStatus;
            }
          }
        );
        return;
      }

      if (newStatus === 'CONFIRMADO') {
        if (selectEl) selectEl.disabled = true;
        callServer('launches.confirm', { id: launchId }, function () {
          showToast('Situação atualizada para Confirmado!', 'success');
          loadDashboard();
          loadLaunches(state.currentPage || 1);
        }, function (err) {
          if (selectEl) {
            selectEl.disabled = false;
            selectEl.value = previousStatus;
            selectEl.className = 'status-select-pill status-' + previousStatus;
          }
          showToast('Erro ao confirmar lançamento: ' + (err && err.message ? err.message : err), 'error');
        });
        return;
      }

      // PREVISTO ou PENDENTE
      if (selectEl) selectEl.disabled = true;
      callServer('launches.update', { id: launchId, situacao: newStatus }, function () {
        var labelStatus = newStatus === 'PREVISTO' ? 'Previsto' : 'Pendente';
        showToast('Situação atualizada para ' + labelStatus + '!', 'success');
        loadDashboard();
        loadLaunches(state.currentPage || 1);
      }, function (err) {
        if (selectEl) {
          selectEl.disabled = false;
          selectEl.value = previousStatus;
          selectEl.className = 'status-select-pill status-' + previousStatus;
        }
        showToast('Erro ao atualizar situação: ' + (err && err.message ? err.message : err), 'error');
      });
    }

    function calculateRecurringEndDate(startDateIso, installments, frequency) {
      if (!startDateIso || !installments || installments <= 0) return '';
      var parts = startDateIso.split('-');
      if (parts.length < 3) return '';
      var y = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      var d = parseInt(parts[2], 10);
      var count = parseInt(installments, 10);
      if (isNaN(count) || count < 1) return '';

      var freq = (frequency || 'MENSAL').toUpperCase();
      if (freq === 'QUINZENAL') {
        var date = new Date(Date.UTC(y, m - 1, d));
        date.setUTCDate(date.getUTCDate() + (count - 1) * 14);
        return date.toISOString().substring(0, 10);
      } else if (freq === 'ANUAL') {
        var endYear = y + (count - 1);
        var lastDay = new Date(Date.UTC(endYear, m, 0)).getUTCDate();
        var clampedDay = Math.min(d, lastDay);
        return endYear + '-' + String(m).padStart(2, '0') + '-' + String(clampedDay).padStart(2, '0');
      } else {
        var totalMonths = (m - 1) + (count - 1);
        var endYear = y + Math.floor(totalMonths / 12);
        var endMonth = (totalMonths % 12) + 1;
        var lastDay = new Date(Date.UTC(endYear, endMonth, 0)).getUTCDate();
        var clampedDay = Math.min(d, lastDay);
        return endYear + '-' + String(endMonth).padStart(2, '0') + '-' + String(clampedDay).padStart(2, '0');
      }
    }

    function calculateInstallmentsCount(startDateIso, endDateIso, frequency) {
      if (!startDateIso || !endDateIso || endDateIso < startDateIso) return '';
      var startParts = startDateIso.split('-');
      var endParts = endDateIso.split('-');
      var y1 = parseInt(startParts[0], 10), m1 = parseInt(startParts[1], 10), d1 = parseInt(startParts[2], 10);
      var y2 = parseInt(endParts[0], 10), m2 = parseInt(endParts[1], 10), d2 = parseInt(endParts[2], 10);

      var freq = (frequency || 'MENSAL').toUpperCase();
      if (freq === 'QUINZENAL') {
        var dt1 = new Date(Date.UTC(y1, m1 - 1, d1));
        var dt2 = new Date(Date.UTC(y2, m2 - 1, d2));
        var diffDays = Math.round((dt2 - dt1) / (1000 * 60 * 60 * 24));
        return Math.max(1, Math.round(diffDays / 14) + 1);
      } else if (freq === 'ANUAL') {
        return Math.max(1, y2 - y1 + 1);
      } else {
        var months = (y2 - y1) * 12 + (m2 - m1) + 1;
        return Math.max(1, months);
      }
    }

      var termEl = document.getElementById(mode === 'edit' ? 'rec-edit-termino' : 'rec-termino');
      var iniEl = document.getElementById(mode === 'edit' ? 'rec-edit-inicio' : 'rec-inicio');
      var freqEl = document.getElementById(mode === 'edit' ? 'rec-edit-recorrencia' : 'rec-recorrencia');
      var parcEl = document.getElementById(mode === 'edit' ? 'rec-edit-parcelas' : 'rec-parcelas');
      if (!termEl || !parcEl) return;

      var termVal = termEl.value;
      if (!termVal) {
        parcEl.value = '';
        return;
      }
      var iniVal = iniEl ? iniEl.value : '';
      if (!iniVal) {
        iniVal = new Date().toISOString().substring(0, 10);
        if (iniEl) iniEl.value = iniVal;
      }
      var count = calculateInstallmentsCount(iniVal, termVal, freqEl ? freqEl.value : 'MENSAL');
      parcEl.value = count > 0 ? count : '';
    }

    function onRecurringInstallmentsInput(mode) {
      var parcEl = document.getElementById(mode === 'edit' ? 'rec-edit-parcelas' : 'rec-parcelas');
      var termEl = document.getElementById(mode === 'edit' ? 'rec-edit-termino' : 'rec-termino');
      var iniEl = document.getElementById(mode === 'edit' ? 'rec-edit-inicio' : 'rec-inicio');
      var freqEl = document.getElementById(mode === 'edit' ? 'rec-edit-recorrencia' : 'rec-recorrencia');
      if (!parcEl || !termEl) return;

      var val = parseInt(parcEl.value, 10);
      if (!val || isNaN(val) || val <= 0) {
        termEl.value = '';
        return;
      }
      var iniVal = iniEl ? iniEl.value : '';
      if (!iniVal) {
        iniVal = new Date().toISOString().substring(0, 10);
        if (iniEl) iniEl.value = iniVal;
      }
      var freq = freqEl ? freqEl.value : 'MENSAL';
      var endIso = calculateRecurringEndDate(iniVal, val, freq);
      if (endIso) {
        termEl.value = endIso;
      }
    }

    function renderRecurringAccountsView(items) {
      items = items || state.recurringAccounts || [];

      // Atualiza KPIs do topo
      var ativas = items.filter(function (r) { return r.situacao === 'ATIVA'; });
      var totalDespesas = 0;
      var totalReceitas = 0;
      var confirmadasMes = 0;
      var previstasMes = 0;

      items.forEach(function (r) {
        if (r.tipo === 'ENTRADA') totalReceitas += Number(r.valor_previsto_centavos || 0);
        else totalDespesas += Number(r.valor_previsto_centavos || 0);

        if (r.ocorrencia_mes_atual) {
          if (r.ocorrencia_mes_atual.situacao === 'CONFIRMADO') confirmadasMes++;
          else if (r.ocorrencia_mes_atual.situacao === 'PREVISTO' || r.ocorrencia_mes_atual.situacao === 'PENDENTE') previstasMes++;
        }
      });

      var kpiRegras = document.getElementById('rec-kpi-total-regras');
      if (kpiRegras) kpiRegras.textContent = ativas.length + ' ativa(s)';

      var kpiDespesas = document.getElementById('rec-kpi-despesas');
      if (kpiDespesas) kpiDespesas.textContent = '-' + UIHelpers.formatBrl(totalDespesas);

      var kpiReceitas = document.getElementById('rec-kpi-receitas');
      if (kpiReceitas) kpiReceitas.textContent = '+' + UIHelpers.formatBrl(totalReceitas);

      var kpiStatus = document.getElementById('rec-kpi-status-mes');
      if (kpiStatus) kpiStatus.textContent = confirmadasMes + ' paga(s) / ' + previstasMes + ' prev.';

      var rows = items.map(function (r) {
        var occStatus = r.ocorrencia_mes_atual ? r.ocorrencia_mes_atual.situacao : 'NÃO GERADA';
        var isEntrada = r.tipo === 'ENTRADA';
        var rowClass = isEntrada ? 'row-entrada' : 'row-saida';

        var bankBadge = r.conta_bancaria_nome
          ? UIHelpers.getBankBadgeHtml(r.conta_bancaria_nome)
          : '<span style="color:var(--text-muted); font-size:0.8rem;">Padrão</span>';

        var moneyPill = isEntrada

        }
        menuItems.push('<button type="button" class="dropdown-action-btn" onclick="App.closeAllActionDropdowns(); App.openEditRecurringModal(\'' + UIHelpers.escapeHtml(r.id) + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> <span>Editar Regra</span></button>');
        menuItems.push('<button type="button" class="dropdown-action-btn" onclick="App.closeAllActionDropdowns(); App.goToLaunchesForRecurring(\'' + UIHelpers.escapeHtml(r.id) + '\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> <span>Ver em Lançamentos</span></button>');

        var dropdownId = 'rec-actions-' + r.id;
        var dropdownHtml =
          '<div class="table-actions-dropdown">' +
            '<button type="button" class="btn-dots-action" onclick="App.toggleRowDropdown(event, \'' + dropdownId + '\')" title="Opções da regra" aria-label="Ações">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.2"></circle><circle cx="12" cy="12" r="2.2"></circle><circle cx="12" cy="19" r="2.2"></circle></svg>' +

            '<div id="' + dropdownId + '" class="table-dropdown-menu">' +

            '</div>' +

          ? '<span class="rec-tag-tipo" style="background:rgba(16,185,129,0.12); color:var(--success);">Receita</span>'
          : '<span class="rec-tag-tipo" style="background:rgba(239,68,68,0.1); color:var(--danger);">Despesa</span>';

        var parcelasInfo = '';
        if (r.data_termino) {
          var pCount = calculateInstallmentsCount(r.data_inicio, r.data_termino, r.recorrencia);
          if (pCount > 0) {
            parcelasInfo = ' • ' + pCount + 'x (até ' + UIHelpers.formatDateBr(r.data_termino) + ')';
          } else {
            parcelasInfo = ' • até ' + UIHelpers.formatDateBr(r.data_termino);
          }

        return (
          '<tr class="' + rowClass + '">' +
          '<td>' +
            '<div style="display:flex; align-items:center; gap:6px; flex-wrap:nowrap;">' +

            '</div>' +
            '<small style="color:var(--text-secondary); font-size:0.73rem; display:block; margin-top:3px;">' + UIHelpers.escapeHtml(r.natureza) + ' • ' + UIHelpers.escapeHtml(r.recorrencia) + parcelasInfo + '</small>' +

          '<td class="col-center"><span class="badge badge-estimado" style="font-weight:600;">Todo dia ' + r.dia_vencimento + '</span></td>' +
          '<td>' + UIHelpers.escapeHtml(r.categoria_nome) + '</td>' +
          '<td class="col-center">' + bankBadge + '</td>' +
          '<td class="col-money">' + moneyPill + '</td>' +
          '<td class="col-center">' + statusBadge + '</td>' +
          '<td class="col-center">' + dropdownHtml + '</td>' +

      var tableHeader =
