          (isOwner ? 'title="Proprietário Principal (Papel protegido pelo sistema)" disabled style="opacity:0.95; cursor:default;"' : 'title="Clique para alterar o papel/nível de acesso"') + '>' +
            '<option value="MEMBRO"' + (roleVal === 'MEMBRO' ? ' selected' : '') + '>👤 USUÁRIO (Membro)</option>' +
            '<option value="ADMIN"' + (roleVal === 'ADMIN' ? ' selected' : '') + '>🛡️ ADMIN (Gestor)</option>' +
            '<option value="OWNER"' + (roleVal === 'OWNER' ? ' selected' : '') + '>👑 OWNER (Proprietário)</option>' +
          '</select>';

        // Seletor Interativo de Status com cores
        var statusSelectHtml =
          '<select class="select-status-table" data-status="' + UIHelpers.escapeHtml(u.status) + '" onchange="App.changeUserStatus(\'' + UIHelpers.escapeHtml(u.id) + '\', this.value)" ' +
          (isOwner ? 'title="O Proprietário Principal permanece sempre aprovado" disabled style="opacity:0.95; cursor:default;"' : 'title="Clique para alterar o status do usuário"') + '>' +
            '<option value="APROVADO"' + (u.status === 'APROVADO' ? ' selected' : '') + '>🟢 Aprovado</option>' +
            '<option value="PENDENTE"' + (u.status === 'PENDENTE' ? ' selected' : '') + '>🟡 Pendente</option>' +
            '<option value="BLOQUEADO"' + (u.status === 'BLOQUEADO' ? ' selected' : '') + '>🔴 Bloqueado</option>' +
            '<option value="REVOGADO"' + (u.status === 'REVOGADO' ? ' selected' : '') + '>⚪ Revogado</option>' +
          '</select>';

        var actionsHtml = '<div style="display:flex; gap:0.35rem; align-items:center; flex-wrap:wrap;">';

        if (!isOwner && u.status === 'PENDENTE') {
          actionsHtml += '<button type="button" class="btn btn-success btn-sm" onclick="App.changeUserStatus(\'' + UIHelpers.escapeHtml(u.id) + '\', \'APROVADO\')" title="Aprovar e liberar acesso completo" style="padding:0.3rem 0.65rem; font-size:0.75rem; font-weight:700; background:#059669; border-color:#059669; color:#fff;">✅ Aprovar</button>';
        }

        // Botão Visualizar Cadastro & Logs (Para todos)
        actionsHtml += '<button type="button" class="btn btn-secondary btn-sm" onclick="App.viewUserDetails(\'' + UIHelpers.escapeHtml(u.id) + '\')" title="Visualizar ficha cadastral e histórico de acessos" style="padding:0.25rem 0.5rem; font-size:0.75rem;">👁️ Ver</button>';

        // Botão Editar (Acessível para todos, inclusive para o OWNER gerenciar seu nome/senha/cadastro)
        actionsHtml += '<button type="button" class="btn btn-secondary btn-sm" onclick="App.openEditUserModal(\'' + UIHelpers.escapeHtml(u.id) + '\')" title="Editar dados cadastrais, papel e senha" style="padding:0.25rem 0.5rem; font-size:0.75rem;">✏️ Editar</button>';

        if (!isOwner) {
          // Ações Rápidas de Ativação / Bloqueio
          if (u.status === 'BLOQUEADO' || u.status === 'REVOGADO') {
            actionsHtml += '<button type="button" class="btn btn-success btn-sm" onclick="App.changeUserStatus(\'' + UIHelpers.escapeHtml(u.id) + '\', \'APROVADO\')" title="Reativar acesso" style="padding:0.25rem 0.5rem; font-size:0.75rem;">Reativar</button>';
          } else if (u.status === 'APROVADO') {
            actionsHtml += '<button type="button" class="btn btn-danger btn-sm" onclick="App.changeUserStatus(\'' + UIHelpers.escapeHtml(u.id) + '\', \'BLOQUEADO\')" title="Bloquear acesso temporariamente" style="padding:0.25rem 0.5rem; font-size:0.75rem;">Bloquear</button>';
          }

          // Botão Excluir
          actionsHtml += '<button type="button" class="btn btn-danger btn-sm" onclick="App.deleteAdminUser(\'' + UIHelpers.escapeHtml(u.id) + '\', \'' + UIHelpers.escapeHtml(u.nome) + '\')" title="Excluir usuário do sistema" style="padding:0.25rem 0.45rem; font-size:0.75rem;">🗑️</button>';
        } else {
          actionsHtml += '<span style="font-size:0.72rem; color:var(--primary); font-weight:700; padding:0.2rem 0.4rem; background:rgba(22,133,255,0.08); border-radius:4px;">Principal</span>';
        }
        actionsHtml += '</div>';

        var dtAcesso = u.ultimo_acesso ? String(u.ultimo_acesso).substring(0, 19).replace('T', ' ') : 'Nunca';
        var rowStyle = (u.status === 'PENDENTE') ? ' style="background:rgba(234, 179, 8, 0.06);"' : '';

        return (
          '<tr' + rowStyle + '>' +
            '<td><strong>' + UIHelpers.escapeHtml(u.nome) + '</strong>' +
              (u.status === 'PENDENTE' ? ' <span class="badge badge-pendente" style="font-size:0.65rem; padding:0.1rem 0.4rem; margin-left:4px;">Aguardando Aprovação</span>' : '') +
              '<br><small style="color:var(--text-secondary);">' + UIHelpers.escapeHtml(u.email) + '</small></td>' +
            '<td>' + roleSelectHtml + '</td>' +
            '<td>' + statusSelectHtml + '</td>' +
            '<td><span style="font-size:0.8rem; color:var(--text-secondary);">' + UIHelpers.escapeHtml(dtAcesso) + '</span></td>' +
            '<td>' + actionsHtml + '</td>' +
          '</tr>'
        );
      }).join('');

      container.innerHTML =
        alertBanner +
        '<table class="data-table"><thead><tr>' +
          '<th>Usuário</th>' +
          '<th>Papel / Nível</th>' +
          '<th>Status</th>' +
          '<th>Último Acesso / Log</th>' +
          '<th>Ações</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function loadAdminUsers() {
      callServer('admin.listUsers', {}, function (res) {
        rawAdminUsersList = res.data || [];
        filterAdminUsers();
      });
    }

    function filterAdminUsers() {
      var sInput = document.getElementById('user-filter-search');
      var rSelect = document.getElementById('user-filter-role');
      var stSelect = document.getElementById('user-filter-status');

      var search = sInput ? sInput.value.toLowerCase().trim() : '';
      var roleFilter = rSelect ? rSelect.value : '';
      var statusFilter = stSelect ? stSelect.value : '';

      var filtered = rawAdminUsersList.filter(function (u) {
        if (search) {
          var n = String(u.nome || '').toLowerCase();
          var e = String(u.email || '').toLowerCase();
          if (n.indexOf(search) === -1 && e.indexOf(search) === -1) return false;
        }
        if (roleFilter) {
          var uRole = String(u.papel || '').toUpperCase();
          if (roleFilter === 'USUARIO') {
            if (uRole !== 'USUARIO' && uRole !== 'MEMBRO') return false;
          } else if (uRole !== roleFilter) {
            return false;
          }
        }
        if (statusFilter && u.status !== statusFilter) {
          return false;
        }
        return true;
      });

      renderAdminUsersTable(filtered);
    }

    function openEditUserModal(userId) {
      var user = rawAdminUsersList.find(function (u) { return u.id === userId; });
      if (!user) return;
      closeAdminUserModals();
      document.getElementById('edit-user-id').value = user.id;
      document.getElementById('edit-user-nome').value = user.nome || '';
      document.getElementById('edit-user-email').value = user.email || '';
      document.getElementById('edit-user-papel').value = (user.papel === 'USUARIO' || user.papel === 'MEMBRO') ? 'MEMBRO' : user.papel;
      
      var isOwner = user.papel === 'OWNER';
      var statusSelect = document.getElementById('edit-user-status');
      if (statusSelect) {
        statusSelect.value = user.status || 'APROVADO';
        statusSelect.disabled = isOwner;
        if (isOwner) {
          statusSelect.title = 'O status do OWNER é protegido e permanece sempre Aprovado.';
        } else {
          statusSelect.removeAttribute('title');
        }
      }

      document.getElementById('edit-user-senha').value = '';
      var m = document.getElementById('modal-admin-user-edit');
      if (m) m.style.display = 'flex';

    var cachedActiveLogs = [];

    function loadAuditLogs() {
      applyLogFilters();

    function applyLogFilters() {
      var eventType = (document.getElementById('filter-log-type') || {}).value || 'ALL';
      var severity = (document.getElementById('filter-log-severity') || {}).value || 'ALL';
      var moduleName = (document.getElementById('filter-log-module') || {}).value || 'ALL';
      var corrId = ((document.getElementById('filter-log-correlation') || {}).value || '').trim();

      var payload = {
        event_type: eventType,
        severity: severity,
        module: moduleName,
        correlation_id: corrId,
        limit: 100
      };

      var container = document.getElementById('admin-audit-container');
      if (container) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:1.5rem;">Carregando logs estruturados...</p>';
      }

      callServer('logs.query', payload, function (res) {
        if (!res.ok) {
          showToast('Erro ao carregar logs: ' + (res.error || 'Falha na consulta'), 'error');
          return;
        }

        var data = res.data || {};
        var events = data.events || [];
        var metrics = data.metrics || {};
        cachedActiveLogs = events;

        // Atualização dos cards de métricas
        var setEl = function (id, val) {
          var el = document.getElementById(id);
          if (el) el.innerText = val;
        };
        setEl('log-metric-total', metrics.total_eventos !== undefined ? metrics.total_eventos : events.length);
        setEl('log-metric-success', metrics.sucessos !== undefined ? metrics.sucessos : 0);
        setEl('log-metric-errors', metrics.erros !== undefined ? metrics.erros : 0);
        setEl('log-metric-security', metrics.seguranca !== undefined ? metrics.seguranca : 0);
        setEl('log-metric-anomalies', metrics.anomalias !== undefined ? metrics.anomalias : 0);
        setEl('log-metric-error-rate', (metrics.taxa_erros_pct !== undefined ? metrics.taxa_erros_pct : '0.0') + '%');
        setEl('log-count-indicator', events.length + ' de ' + (data.total || events.length) + ' registros');

        if (events.length === 0) {
          if (container) {
            container.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:1.5rem;">Nenhum evento encontrado para os filtros selecionados.</p>';
          }
          return;
        }

        var rows = events.map(function (ev) {
          var sevColor = '#10b981';
          if (ev.severity === 'CRITICAL') sevColor = '#ef4444';
          else if (ev.severity === 'HIGH') sevColor = '#f97316';
          else if (ev.severity === 'MEDIUM') sevColor = '#3b82f6';

          var badgeClass = 'badge-confirmado';
          if (ev.event_type === 'ERROR') badgeClass = 'badge-cancelado';
          else if (ev.event_type === 'SECURITY' || ev.event_type === 'ANOMALY') badgeClass = 'badge-pendente';

          var timeFormatted = UIHelpers.escapeHtml(String(ev.timestamp || '').substring(0, 19).replace('T', ' '));
          var corrShort = ev.correlation_id ? UIHelpers.escapeHtml(ev.correlation_id.substring(0, 14) + '...') : '-';

          return (
            '<tr>' +
            '<td style="white-space:nowrap; font-size:0.78rem;">' + timeFormatted + '</td>' +
            '<td><span class="badge ' + badgeClass + '" style="font-size:0.7rem;">' + UIHelpers.escapeHtml(ev.event_type) + '</span> ' +
            '<span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:' + sevColor + ';" title="Severidade: ' + UIHelpers.escapeHtml(ev.severity) + '"></span></td>' +
            '<td><strong style="font-size:0.8rem;">' + UIHelpers.escapeHtml(ev.module) + '</strong></td>' +
            '<td style="font-size:0.8rem;">' + UIHelpers.escapeHtml(ev.action) + '</td>' +
            '<td style="font-size:0.78rem; color:var(--text-secondary);">' + UIHelpers.escapeHtml(ev.description || '') + '</td>' +
            '<td style="font-size:0.75rem;"><code style="font-size:0.72rem;">' + UIHelpers.escapeHtml(ev.actor_id || '') + '</code></td>' +
            '<td style="font-size:0.72rem;" title="' + UIHelpers.escapeHtml(ev.correlation_id || '') + '"><code>' + corrShort + '</code></td>' +
            '<td><button type="button" class="btn btn-secondary btn-sm" style="padding:0.2rem 0.45rem; font-size:0.72rem;" onclick="App.openLogDetailsModal(\'' + UIHelpers.escapeHtml(ev.event_id) + '\')">🔍 Ver</button></td>' +
            '</tr>'
          );
        }).join('');

        if (container) {
          container.innerHTML =
            '<table class="data-table" style="font-size:0.82rem;"><thead><tr>' +
            '<th>Data/Hora</th><th>Tipo</th><th>Módulo</th><th>Ação</th><th>Descrição</th><th>Ator</th><th>Correlação</th><th>Ações</th>' +
            '</tr></thead><tbody>' + rows + '</tbody></table>';
        }
      });
    }

    function runSecurityAuditCheck() {
      var resultContainer = document.getElementById('sec-audit-check-result');
      if (resultContainer) {
        resultContainer.style.display = 'block';
        resultContainer.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:1rem;">Executando varredura profunda de segurança e conformidade...</p>';
      }

      callServer('security.runAuditCheck', {}, function (res) {
        if (!res.ok) {
          showToast('Falha na auditoria: ' + (res.error || ''), 'error');
          if (resultContainer) resultContainer.style.display = 'none';
          return;
        }

        var report = res.data || {};
        var statusColor = report.passed ? '#10b981' : '#f59e0b';
        var statusText = report.passed ? '✅ Conformidade Total Aprovada' : '⚠️ Avisos de Auditoria Detectados';

        var issuesHtml = (report.issues || []).map(function (iss) {
          return '<li style="color:#ef4444; margin-bottom:4px;">❌ ' + UIHelpers.escapeHtml(iss) + '</li>';
        }).join('');

        var warningsHtml = (report.warnings || []).map(function (w) {
          return '<li style="color:#f59e0b; margin-bottom:4px;">⚠️ ' + UIHelpers.escapeHtml(w) + '</li>';
        }).join('');

        var recsHtml = (report.recommendations || []).map(function (r) {
          return '<li style="color:var(--text-secondary); margin-bottom:4px;">💡 ' + UIHelpers.escapeHtml(r) + '</li>';
        }).join('');

        var checksHtml = (report.verificacoes_realizadas || []).map(function (c) {
          return '<li style="color:var(--text-primary); margin-bottom:4px;">✓ ' + UIHelpers.escapeHtml(c) + '</li>';
        }).join('');

        if (resultContainer) {
          resultContainer.innerHTML =
            '<div style="background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:1rem;">' +
            '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">' +
            '<strong style="color:' + statusColor + '; font-size:1rem;">' + statusText + '</strong>' +
            '<small style="color:var(--text-muted); font-size:0.75rem;">' + UIHelpers.escapeHtml(report.timestamp || '') + '</small>' +
            '</div>' +
            (issuesHtml ? '<ul style="list-style:none; padding-left:0; margin-bottom:0.75rem;">' + issuesHtml + '</ul>' : '') +
            (warningsHtml ? '<ul style="list-style:none; padding-left:0; margin-bottom:0.75rem;">' + warningsHtml + '</ul>' : '') +
            (recsHtml ? '<div style="margin-bottom:0.75rem;"><strong>Recomendações:</strong><ul style="list-style:none; padding-left:0; margin-top:4px;">' + recsHtml + '</ul></div>' : '') +
            '<div><strong>Verificações Automatizadas:</strong><ul style="list-style:none; padding-left:0; margin-top:4px; font-size:0.8rem;">' + checksHtml + '</ul></div>' +
            '</div>';
        }

        showToast(report.passed ? 'Auditoria concluída com sucesso!' : 'Auditoria concluída com observações.', report.passed ? 'success' : 'warning');
        loadOperationalSecurityDashboard();
      });
    }

    function restoreFullBackup() {
      var raw = document.getElementById('restore-json-input').value;
      if (!raw) {
        showToast('Cole o conteúdo JSON do backup antes de restaurar.', 'error');
        return;
      }
      var parsed = null;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        showToast('JSON de backup em formato inválido.', 'error');
        return;
      }
      openConfirmModal(
        'Confirmar Restauração de Backup',
        'Deseja restaurar os registros do backup JSON preservando IDs e relacionamentos?',
        function () {
          callServer('admin.restoreBackup', { backup: parsed }, function (res) {
            showToast(
              'Restauração concluída: ' + res.data.inserted + ' inserido(s), ' + res.data.updated + ' atualizado(s).',
              'success'
            );
            loadDashboard();

    function openResetModal() {
      var modal = document.getElementById('modal-reset-system');
      if (modal) {
        var wordInput = document.getElementById('reset-confirm-word');

        var pwdGroup = document.getElementById('reset-password-group');
        var pwdNotice = document.getElementById('reset-password-notice');
        if (wordInput) wordInput.value = '';

    function executeResetSystem() {
      var wordInput = document.getElementById('reset-confirm-word');
      var pwdInput = document.getElementById('reset-confirm-password');
      var word = wordInput ? wordInput.value.trim().toUpperCase() : '';
      var pwd = pwdInput ? pwdInput.value.trim() : '';

      if (word !== 'RESETAR') {
        showToast('Digite a palavra "RESETAR" para confirmar a operação.', 'error');
        return;
      }

      var hasPwd = Boolean(state.user && state.user.hasPassword);
      if (hasPwd && !pwd) {
        showToast('Informe sua senha de acesso cadastrada para autorizar.', 'error');
        return;
      }

      var btn = document.getElementById('btn-confirm-reset-system');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Reinicializando sistema...</span>';
      }

      callServer('admin.resetData', {
        palavra_confirmacao: word,
        senha: pwd
      }, function (res) {
        closeResetModal();
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '🗑️ Confirmar e Zerar Sistema';
        }

        // Se o servidor retornou o backup automático, dispara o download de contingência
        if (res && res.data && res.data.backup) {
          try {
            var jsonStr = JSON.stringify(res.data.backup, null, 2);
            var blob = new Blob([jsonStr], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'backup_automatico_pre_reset_' + new Date().toISOString().substring(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          } catch (eBlob) {}
        }

        showToast((res && res.data && res.data.mensagem) || 'Sistema reinicializado com sucesso!', 'success');
        setTimeout(function () {
          window.location.reload();
        }, 2000);
      });
    }

    function sendMorningDigestNow() {

    function checkOrEnsureMorningTrigger(isCheckOnly) {
      if (isCheckOnly) {
        callServer('notifications.getTriggerStatus', {}, function (trigRes) {
          var tData = trigRes && trigRes.data ? trigRes.data : {};
          var badge = document.getElementById('morning-trigger-badge');
          var desc = document.getElementById('morning-trigger-status-desc');
          if (tData.configurado) {
            if (badge) {
              badge.className = 'badge badge-confirmado';
              badge.textContent = '🟢 ATIVO (07:00h)';
            }
            if (desc) desc.textContent = 'Gatilho matinal instalado e operando no Apps Script (07:00h às 08:00h).';
          } else if (tData.erro === 'PERMISSAO_NECESSARIA') {
            if (badge) {
              badge.className = 'badge badge-pendente';
              badge.textContent = '🔒 REQUER AUTORIZAÇÃO';
            }
            if (desc) desc.textContent = 'Autorização de gatilhos pendente no Google Apps Script. Clique em "Sincronizar Gatilho" para autorizar.';
          } else {
            if (badge) {
              badge.className = 'badge badge-pendente';
              badge.textContent = '🔴 NÃO ATIVADO';
            }
            if (desc) desc.textContent = 'Gatilho não configurado no Apps Script. Clique para ativar.';
          }
        }, { quiet: true });
        return;
      }

      callServer('notifications.ensureTrigger', {}, function (res) {
        if (!res.ok || (res.data && res.data.ok === false)) {
          var errMsg = (res.data && res.data.mensagem) || res.error || 'Permissão necessária no Google Apps Script';
          showToast(errMsg, 'warning');
          var badge = document.getElementById('morning-trigger-badge');
          var desc = document.getElementById('morning-trigger-status-desc');
          if (badge) {
            badge.className = 'badge badge-pendente';
            badge.textContent = '🔒 REQUER AUTORIZAÇÃO';
          }
          if (desc) desc.textContent = errMsg;
          return;
        }
        var msg = res.data && res.data.mensagem ? res.data.mensagem : 'Gatilho matinal das 07:00h configurado com sucesso!';
        showToast(msg, 'success');
        var badge = document.getElementById('morning-trigger-badge');
        var desc = document.getElementById('morning-trigger-status-desc');
        if (badge) {
          badge.className = 'badge badge-confirmado';
          badge.textContent = '🟢 ATIVO (07:00h)';
        }
        if (desc) desc.textContent = 'Gatilho automático configurado com sucesso para execução diária entre 07:00h e 08:00h.';
      });
    }

    function adjustNotificationsPanelPosition() {
      var panel = document.getElementById('notifications-dropdown-panel');
      var bell = document.getElementById('btn-notifications-bell');
      if (!panel || !bell) return;

      var winWidth = window.innerWidth || document.documentElement.clientWidth || 1024;
      if (winWidth <= 768) {
        panel.style.position = 'fixed';
        panel.style.top = '62px';
        panel.style.left = '50%';
        panel.style.right = 'auto';
        panel.style.transform = 'translateX(-50%)';
        panel.style.maxWidth = 'min(94vw, 420px)';
        panel.style.width = 'calc(100vw - 24px)';
        return;
      }

      panel.style.position = 'absolute';
      panel.style.top = 'calc(100% + 8px)';
      panel.style.width = '390px';
      panel.style.maxWidth = '90vw';

      var bellRect = bell.getBoundingClientRect();
      var panelWidth = 390;

      if (bellRect.right + 200 > winWidth) {
        panel.style.left = 'auto';
        panel.style.right = '0';
        panel.style.transform = 'none';
      } else if (bellRect.left - (panelWidth / 2) < 260) {
        panel.style.left = '0';
        panel.style.right = 'auto';
        panel.style.transform = 'none';
      } else {
        panel.style.left = '50%';
        panel.style.right = 'auto';
        panel.style.transform = 'translateX(-50%)';
      }
    }

    function closeNotificationsPanel() {
      var panel = document.getElementById('notifications-dropdown-panel');
      if (!panel) return;
      panel.classList.remove('open');
      panel.style.display = 'none';
    }

    function onGlobalSearchInput(event) {
      var input = document.getElementById('global-search-input');
      var clearBtn = document.getElementById('global-search-clear-btn');
      var dropdown = document.getElementById('global-search-dropdown');
      if (!input) return;

      var val = input.value.trim();
      if (clearBtn) {
        clearBtn.style.display = val.length > 0 ? 'inline-block' : 'none';
      }

      // Se o usuário limpou o campo, fecha o dropdown imediatamente
      if (val.length === 0) {

        globalSearchResults = null;
        globalSearchActiveIndex = -1;

    function onGlobalSearchFocus() {
      // Não dispara requisições ao focar; apenas reabre resultados prévios se já existirem
      var input = document.getElementById('global-search-input');
      var dropdown = document.getElementById('global-search-dropdown');
      if (input && dropdown && globalSearchResults && input.value.trim().length >= 2) {
        dropdown.style.display = 'flex';

    function triggerGlobalSearch() {
      var input = document.getElementById('global-search-input');
      if (!input) return;
      var term = input.value.trim();
      if (!term || term.length < 2) {
        showToast('Digite ao menos 2 caracteres para pesquisar.', 'warning');
        input.focus();
        return;
      }
      executeGlobalSearch(term);

      var input = document.getElementById('global-search-input');
      var clearBtn = document.getElementById('global-search-clear-btn');
      var dropdown = document.getElementById('global-search-dropdown');
      if (input) {
        input.value = '';

    function executeGlobalSearch(term) {
      var dropdown = document.getElementById('global-search-dropdown');
      var searchBtn = document.getElementById('global-search-submit-btn');
      if (!dropdown) return;

      dropdown.style.display = 'flex';
      dropdown.innerHTML = '<div style="padding:1.5rem; text-align:center; color:var(--text-muted); font-size:0.84rem;"><span>🔍 Buscando "' + UIHelpers.escapeHtml(term) + '" em todo o sistema...</span></div>';

      if (searchBtn) {
        searchBtn.disabled = true;
        searchBtn.innerHTML = '<span class="spinner" style="width:11px; height:11px; border-width:2px; display:inline-block; vertical-align:middle; margin-right:3px;"></span><span>Buscando...</span>';
      }

      callServer('search.global', { term: term }, function (res) {
        if (searchBtn) {
          searchBtn.disabled = false;
          searchBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span>Buscar</span>';
        }

        if (!res.ok) {
          dropdown.innerHTML = '<div style="padding:1rem; text-align:center; color:var(--danger); font-size:0.84rem;">Erro ao pesquisar: ' + UIHelpers.escapeHtml(res.error || '') + '</div>';
          return;
        }

        var data = res.data || {};
        globalSearchResults = data;
        renderGlobalSearchResults(data);
      });
    }

    function renderGlobalSearchResults(data) {
      var dropdown = document.getElementById('global-search-dropdown');
      if (!dropdown) return;

      var term = data.term || '';
      var total = data.total || 0;
      var results = data.results || {};

      if (total === 0) {
        dropdown.innerHTML =
          '<div style="padding:1.75rem 1rem; text-align:center;">' +
          '<span style="font-size:2rem; display:block; margin-bottom:0.4rem;">🔎</span>' +

          '</div>';

      var html = '';

    function onGlobalSearchKeyDown(event) {
      var dropdown = document.getElementById('global-search-dropdown');
      var input = document.getElementById('global-search-input');
      if (!dropdown || !input) return;

      var isOpen = dropdown.style.display !== 'none' && dropdown.style.display !== '';

      if (event.key === 'Escape') {
        closeGlobalSearchDropdown();
        input.blur();
        return;
      }

      var items = dropdown.querySelectorAll('.global-search-item');
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        if (!isOpen) {
          if (input.value.trim().length >= 2) triggerGlobalSearch();
          return;
        }
        if (items.length === 0) return;
        globalSearchActiveIndex = (globalSearchActiveIndex + 1) % items.length;
        updateActiveSearchItem(items);
        return;
      }

      if (event.key === 'ArrowUp') {
        event.preventDefault();
        if (!isOpen || items.length === 0) return;
        globalSearchActiveIndex = (globalSearchActiveIndex - 1 + items.length) % items.length;
        updateActiveSearchItem(items);
        return;
      }

      if (event.key === 'Enter') {
        event.preventDefault();
        if (isOpen && globalSearchActiveIndex >= 0 && items[globalSearchActiveIndex]) {
          items[globalSearchActiveIndex].click();
          return;
        }
        // Executa a busca global multientidades ao teclar Enter
        triggerGlobalSearch();
      }
    }

    function updateActiveSearchItem(items) {
      for (var i = 0; i < items.length; i++) {
        if (i === globalSearchActiveIndex) {
          items[i].classList.add('active');
          items[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } else {
          items[i].classList.remove('active');
        }
      }
    }

            '<div style="font-size:2rem; margin-bottom:0.5rem; opacity:0.6;">🔔</div>' +

        return;
      }

      var html = '';
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        var isUnread = !it.status_leitura;
        var icon = '🔔';
        var cat = String(it.categoria || '').toUpperCase();
        if (cat === 'VENCIMENTOS') icon = '📅';
        else if (cat === 'INVESTIMENTOS') icon = '📈';
        else if (cat === 'FINANCEIRAS' || cat === 'FINANCEIRO') icon = '💰';
        else if (cat === 'SISTEMA') icon = '⚙️';

        var prioBadge = '';
        if (it.prioridade === 'CRITICA') {
          prioBadge = '<span class="badge badge-danger" style="font-size:0.65rem; margin-left:6px;">Crítica</span>';
        } else if (it.prioridade === 'ALTA') {
          prioBadge = '<span class="badge badge-warning" style="font-size:0.65rem; margin-left:6px;">Alta</span>';
        }

        var unreadClass = isUnread ? ' notif-unread' : ' notif-read';
        var dataFmt = it.criado_em ? it.criado_em.substring(0, 16).replace('T', ' ') : '';

        html +=
          '<div class="notif-card-item' + unreadClass + '" id="notif-item-' + it.id + '">' +
            '<div class="notif-card-icon">' + icon + '</div>' +
            '<div style="flex:1; min-width:0;">' +
              '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem; margin-bottom:0.25rem;">' +
                '<strong style="font-size:0.85rem; color:var(--text-primary); line-height:1.2;">' +
                  UIHelpers.escapeHtml(it.titulo || 'Notificação') + prioBadge +
                '</strong>' +
                '<span style="font-size:0.7rem; color:var(--text-muted); white-space:nowrap;">' + UIHelpers.escapeHtml(dataFmt) + '</span>' +
              '</div>' +
              '<p style="font-size:0.8rem; color:var(--text-secondary); margin:0 0 0.5rem 0; line-height:1.35;">' +
                UIHelpers.escapeHtml(it.mensagem || '') +
              '</p>' +
              '<div style="display:flex; align-items:center; justify-content:space-between; gap:0.5rem; flex-wrap:wrap;">' +
                '<div style="display:flex; align-items:center; gap:0.5rem;">' +
                  (it.referencia_modulo ?
                    '<button type="button" class="btn-text-link" onclick="App.navigate(\'' + it.referencia_modulo + '\'); App.closeNotificationsPanel();" style="font-size:0.75rem; font-weight:600; color:var(--primary);">' +

                    '✕ Excluir' +

    function checkAndShowInitialPopup() {
      var presented = [];
      try {
        var raw = sessionStorage.getItem('fin_notifs_presented');
        if (raw) presented = JSON.parse(raw);
      } catch (e) {}

      callServer('notifications.getInitialPopup', { presentedIds: presented }, function (res) {
        var data = res.data;
        if (!data || !data.exibir || !data.total_relevantes) return;

        // Registrar IDs exibidos no sessionStorage para não repetir na mesma sessão
        try {
          var allIds = presented.slice();
          if (data.itens && data.itens.length) {
            for (var k = 0; k < data.itens.length; k++) {
              if (allIds.indexOf(data.itens[k].id) === -1) {
                allIds.push(data.itens[k].id);
              }
            }
          }
          sessionStorage.setItem('fin_notifs_presented', JSON.stringify(allIds));
        } catch (e) {}

        renderInitialPopupBody(data.grupos);
        var modal = document.getElementById('modal-initial-notifications-summary');
        if (modal) modal.style.display = 'flex';
      }, { quiet: true });
    }

    function renderInitialPopupBody(grupos) {
      var body = document.getElementById('initial-notifications-popup-body');
      if (!body || !grupos) return;

      var html = '';

      var renderGroupSection = function (title, items, borderBg, icon) {
        if (!items || items.length === 0) return '';
        var out =
          '<div style="background:var(--bg-secondary); border-left:4px solid ' + borderBg + '; border-radius:6px; padding:0.75rem 0.85rem; margin-bottom:0.6rem;">' +
            '<div style="display:flex; align-items:center; gap:0.4rem; font-weight:700; font-size:0.85rem; margin-bottom:0.4rem; color:var(--text-primary);">' +
              '<span>' + icon + '</span>' +

            '</div>' +
            '<ul style="margin:0; padding-left:1.1rem; font-size:0.8rem; color:var(--text-secondary); line-height:1.45;">';
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          out += '<li style="margin-bottom:0.25rem;"><strong>' + UIHelpers.escapeHtml(it.titulo || '') + ':</strong> ' + UIHelpers.escapeHtml(it.mensagem || '') + '</li>';
        }
        out += '</ul></div>';
        return out;
      };

      html += renderGroupSection('Contas Vencidas em Atraso', grupos.vencidas, 'var(--danger)', '🚨');
      html += renderGroupSection('Contas com Vencimento Hoje', grupos.vencem_hoje, 'var(--warning)', '⚠️');

      html += renderGroupSection('Mercado & Alertas de Investimentos', grupos.mercado_oraculo, '#10b981', '📈');
      html += renderGroupSection('Avisos e Lembretes Operacionais', grupos.outros, 'var(--text-muted)', '🔔');

      body.innerHTML = html;
    }

        setChk('pref-notif-investimentos', p.investimentos_ativo);

      var getChk = function (id) {
        var el = document.getElementById(id);

      var getVal = function (id, fallback) {
        var el = document.getElementById(id);
        return el ? el.value : fallback;
      };

      var payload = {
        central_ativo: getChk('pref-notif-central'),
        popup_ativo: getChk('pref-notif-popup'),
        email_ativo: getChk('pref-notif-email'),
        antecedencia_dias: parseInt(getVal('pref-notif-antecedencia', 3), 10),
        frequencia_atraso_dias: parseInt(getVal('pref-notif-atraso', 1), 10),
        investimentos_ativo: getChk('pref-notif-investimentos'),
        oraculo_ativo: getChk('pref-notif-oraculo'),
        silencioso_inicio: getVal('pref-notif-silencioso-inicio', '22:00'),
        silencioso_fim: getVal('pref-notif-silencioso-fim', '08:00')

  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      var sInput = document.getElementById('global-search-input');
      if (sInput) {
        sInput.focus();
        sInput.select();
      }
    }
  });

  window.addEventListener('click', function (e) {
    if (!e.target.closest('#global-search-container')) {
      App.closeGlobalSearchDropdown();
    }
    if (!e.target.closest('.table-actions-dropdown')) {
      App.closeAllActionDropdowns();
    }
    if (!e.target.closest('#notifications-bell-container')) {
      App.closeNotificationsPanel();
    }
    if (!e.target.closest('.google-presence-cluster-wrapper')) {
      App.closeUserAccountDropdown();
    }
  });

  window.addEventListener('scroll', function () {
    App.closeAllActionDropdowns();
  }, true);

  window.addEventListener('resize', function () {
    App.closeAllActionDropdowns();
    var panel = document.getElementById('notifications-dropdown-panel');
    if (panel && (panel.classList.contains('open') || panel.style.display === 'flex' || panel.style.display === 'block')) {
      App.adjustNotificationsPanelPosition();
    }
  });

  // Eventos de PWA no Google Chrome Android & Desktop
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    if (typeof App !== 'undefined' && App.setDeferredPwaPrompt) {
      App.setDeferredPwaPrompt(e);
    }
    var btn = document.getElementById('btn-pwa-install');
    if (btn) btn.style.display = 'inline-flex';
  });

  window.addEventListener('appinstalled', function () {
    var btn = document.getElementById('btn-pwa-install');
    if (btn) btn.style.display = 'none';
    if (typeof UIHelpers !== 'undefined') {
      UIHelpers.showToast('Finpess instalado com sucesso no seu dispositivo!', 'success');
    }
  });

  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', function () {
      App.init();
    });
  } else {
    App.init();
  }
</script>
