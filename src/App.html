    function runAssetComparison() {
      var t1 = (document.getElementById('comp-ativo-1').value || '').trim();
      var t2 = (document.getElementById('comp-ativo-2').value || '').trim();
      if (!t1 || !t2) {
        showToast('Informe os dois ativos para comparação.', 'warning');
        return;
      }

      callServer('investments.compareAssets', { ticker1: t1, ticker2: t2 }, function (res) {
        var data = res.data;
        if (!data) return;

        var boxResult = document.getElementById('comparison-result-container');
        if (boxResult) boxResult.style.display = 'block';

        var th1 = document.getElementById('comp-th-1');
        var th2 = document.getElementById('comp-th-2');
        if (th1) th1.textContent = data.ativo1.ticker;
        if (th2) th2.textContent = data.ativo2.ticker;

        var body = document.getElementById('comp-table-body');
        if (body && data.comparativo_metricas) {
          body.innerHTML = data.comparativo_metricas.map(function (m) {
            return (
              '<tr>' +
                '<td><strong>' + UIHelpers.escapeHtml(m.metrica) + '</strong></td>' +
                '<td>' + UIHelpers.escapeHtml(m.v1 || '-') + '</td>' +
                '<td>' + UIHelpers.escapeHtml(m.v2 || '-') + '</td>' +
              '</tr>'
            );
          }).join('');
        }

        var parcEl = document.getElementById('comp-parecer-texto');
        if (parcEl) parcEl.textContent = data.parecer_ia || '';
      });
    }

    function toggleNewAssetCard() {
      var card = document.getElementById('card-new-asset');
      if (!card) return;
      var isHidden = card.style.display === 'none' || !card.style.display;
      card.style.display = isHidden ? 'block' : 'none';
      if (isHidden) {
        var dt = document.getElementById('inv-data-ref');
        if (dt && !dt.value) dt.value = toIsoDate(new Date());
        populateInvestmentAccountSelects();
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function toggleNewMovementCard() {
      var card = document.getElementById('card-new-movement');
      if (!card) return;
      var isHidden = card.style.display === 'none' || !card.style.display;
      card.style.display = isHidden ? 'block' : 'none';
      if (isHidden) {
        var dt = document.getElementById('mvi-data');
        if (dt && !dt.value) dt.value = toIsoDate(new Date());
        populateInvestmentAccountSelects();
        var tipoSel = document.getElementById('mvi-tipo');
        if (tipoSel) onMovementTypeChange(tipoSel.value);
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

    function onAssetBankChange(val) {
      var preview = document.getElementById('inv-bank-badge-preview');
      if (!preview) return;
      preview.innerHTML = val && val.trim() ? UIHelpers.getBankBadgeHtml(val) : '';
    }

    function onMovementTypeChange(val) {
      var box = document.getElementById('mvi-box-banco');
      var label = document.getElementById('mvi-conectar-texto');
      if (!box || !label) return;

      if (val === 'APORTE') {
        box.style.display = 'block';
        label.textContent = 'Debitar valor da minha Conta Bancária (cria despesa confirmada)';
      } else if (val === 'RESGATE') {
        box.style.display = 'block';
        label.textContent = 'Creditar valor na minha Conta Bancária (cria receita de resgate)';
      } else if (val === 'RENDIMENTO') {
        box.style.display = 'block';
        label.textContent = 'Receber proventos/dividendos na Conta Bancária (cria receita)';
      } else {
        box.style.display = 'none';
      }
    }

    function populateInvestmentAccountSelects() {
      var accounts = state.bankAccounts || [];
      var activeAccs = accounts.filter(function (a) { return a.situacao === 'ATIVA'; });
      var optHtml = activeAccs.map(function (a) {
        return '<option value="' + UIHelpers.escapeHtml(a.id) + '">' + UIHelpers.escapeHtml(a.nome_identificacao) + ' (' + UIHelpers.escapeHtml(a.instituicao) + ')</option>';
      }).join('');

      var sel1 = document.getElementById('inv-conta-bancaria');
      if (sel1 && optHtml) sel1.innerHTML = optHtml;

      var sel2 = document.getElementById('mvi-conta-bancaria');
      if (sel2 && optHtml) sel2.innerHTML = optHtml;
    }

    function submitInvestmentAsset(ev) {
      ev.preventDefault();
      var debitar = document.getElementById('inv-debitar-conta') ? document.getElementById('inv-debitar-conta').checked : false;
      var contaBancariaId = debitar && document.getElementById('inv-conta-bancaria') ? document.getElementById('inv-conta-bancaria').value : '';

      var payload = {
        nome_ativo: document.getElementById('inv-nome').value,
        classe_ativo: document.getElementById('inv-classe').value,
        instituicao: document.getElementById('inv-instituicao').value,
        valor_aplicado_centavos: UIHelpers.parseInputToCentavos(document.getElementById('inv-aplicado').value),
        valor_mercado_informado_centavos: UIHelpers.parseInputToCentavos(document.getElementById('inv-mercado').value),
        data_referencia: document.getElementById('inv-data-ref').value,
        observacoes: document.getElementById('inv-obs') ? document.getElementById('inv-obs').value : '',
        debitar_conta: debitar,
        conta_bancaria_id: contaBancariaId
      };

      callServer('investments.createAsset', payload, function () {
        showToast('Ativo cadastrado com sucesso!', 'success');
        document.getElementById('form-investment').reset();
        var card = document.getElementById('card-new-asset');
        if (card) card.style.display = 'none';
        state.aiAdviceLoaded = false;
        loadInvestments();
        loadDashboard();
      });
    }

    function submitInvestmentMovement(ev) {
      ev.preventDefault();
      var tipo = document.getElementById('mvi-tipo').value;
      var conectar = document.getElementById('mvi-conectar-conta') ? document.getElementById('mvi-conectar-conta').checked : false;
      var contaId = conectar && document.getElementById('mvi-conta-bancaria') ? document.getElementById('mvi-conta-bancaria').value : '';

      var payload = {
        investimento_id: document.getElementById('mvi-ativo').value,
        tipo_movimento: tipo,
        valor_centavos: UIHelpers.parseInputToCentavos(document.getElementById('mvi-valor').value),
        data_movimento: document.getElementById('mvi-data').value,
        observacoes: document.getElementById('mvi-obs').value,
        conta_bancaria_id: contaId,
        debitar_conta: (tipo === 'APORTE' && conectar),
        creditar_conta: ((tipo === 'RESGATE' || tipo === 'RENDIMENTO') && conectar)
      };

      callServer('investments.recordMovement', payload, function () {
        showToast('Movimentação registrada com sucesso!', 'success');
        document.getElementById('form-inv-movement').reset();
        var card = document.getElementById('card-new-movement');
        if (card) card.style.display = 'none';
        state.aiAdviceLoaded = false;
        loadInvestments();
        loadDashboard();
      });
    }

    function openQuickMovement(assetId, tipo) {
      var card = document.getElementById('card-new-movement');
      if (!card) return;
      card.style.display = 'block';

      var selAtivo = document.getElementById('mvi-ativo');
      if (selAtivo && assetId) selAtivo.value = assetId;

      var selTipo = document.getElementById('mvi-tipo');
      if (selTipo && tipo) {
        selTipo.value = tipo;
        onMovementTypeChange(tipo);
      }

      var dt = document.getElementById('mvi-data');
      if (dt) dt.value = toIsoDate(new Date());

      var valInput = document.getElementById('mvi-valor');
      if (valInput) {
        valInput.value = '';
        setTimeout(function () { valInput.focus(); }, 150);
      }

      populateInvestmentAccountSelects();
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function deleteInvestmentAsset(assetId) {
      var asset = (state.investmentsData && state.investmentsData.ativos || []).find(function (a) { return a.id === assetId; });
      var nome = asset ? asset.nome_ativo : 'este ativo';

      openConfirmModal(
        'Inativar Ativo de Investimento',
        'Tem certeza que deseja inativar o ativo "' + nome + '"? Ele sairá da sua posição consolidada.',
        function () {
          callServer('investments.deleteAsset', { id: assetId }, function () {
            showToast('Ativo inativado com sucesso!', 'success');
            state.aiAdviceLoaded = false;
            loadInvestments();
            loadDashboard();
          });
        }
      );
    }

    function filterInvestmentsTable(query) {
      var q = (query || '').toLowerCase().trim();
      if (!state.investmentsData) return;
      var ativos = state.investmentsData.ativos || [];
      if (!q) {
        renderInvestmentsTable(ativos);
        return;
      }
      var filtered = ativos.filter(function (a) {
        return (
          (a.nome_ativo && a.nome_ativo.toLowerCase().indexOf(q) !== -1) ||
          (a.instituicao && a.instituicao.toLowerCase().indexOf(q) !== -1) ||
          (a.classe_ativo && a.classe_ativo.toLowerCase().indexOf(q) !== -1)
        );
      });
      renderInvestmentsTable(filtered);
    }

    function renderInvestmentsTable(assets) {
      var container = document.getElementById('investments-table-container');
      if (!container) return;

      if (!assets || assets.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); padding:1.5rem; text-align:center;">Nenhum ativo encontrado na carteira.</p>';
        return;

      var rows = assets.map(function (a) {
        var clsMeta = CLASS_INFO[a.classe_ativo] || { label: a.classe_ativo, color: '#64748b', bg: 'rgba(100,116,139,0.1)' };
        var bankBadge = UIHelpers.getBankBadgeHtml(a.instituicao);

        var aplicado = Number(a.valor_aplicado_centavos || 0);
        var mercado = Number(a.valor_mercado_informado_centavos || 0);
        var lucro = mercado - aplicado;
        var rentPct = aplicado > 0 ? ((lucro / aplicado) * 100).toFixed(2) : '0.00';
        var isPositivo = lucro >= 0;

        var dropdownId = 'inv-actions-' + a.id;
        var menuItems = [
          '<button type="button" class="dropdown-action-btn" onclick="App.openQuickMovement(\'' + UIHelpers.escapeHtml(a.id) + '\', \'APORTE\'); App.closeAllActionDropdowns();">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>' +
            '<span>Aportar neste Ativo</span>' +
          '</button>',
          '<button type="button" class="dropdown-action-btn" onclick="App.openQuickMovement(\'' + UIHelpers.escapeHtml(a.id) + '\', \'RESGATE\'); App.closeAllActionDropdowns();">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line></svg>' +
            '<span>Resgatar deste Ativo</span>' +
          '</button>',
          '<button type="button" class="dropdown-action-btn" onclick="App.openQuickMovement(\'' + UIHelpers.escapeHtml(a.id) + '\', \'RENDIMENTO\'); App.closeAllActionDropdowns();">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>' +
            '<span>Registrar Proventos / Rendimentos</span>' +

    var MONTH_NAMES = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];
    var DAY_NAMES = [

    ];

    function toIsoDate(d) {
      var y = d.getFullYear();
      var m = d.getMonth() + 1;
      var day = d.getDate();
      return y + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
    }

    function toIsoDateStr(val) {
      if (!val) return '';
      if (val instanceof Date) return toIsoDate(val);
      var s = String(val).trim();
      var br = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
      if (br) return br[3] + '-' + br[2] + '-' + br[1];
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
      return s;
    }

    function calendarPrev() {
      if (!state.calendarRefDate) state.calendarRefDate = new Date();
      var d = new Date(state.calendarRefDate.getTime());
      if (state.calendarView === 'DIARIA') {
        d.setDate(d.getDate() - 1);
      } else if (state.calendarView === 'ANUAL') {
        d.setFullYear(d.getFullYear() - 1);
      } else {
        d.setMonth(d.getMonth() - 1);
      }
      state.calendarRefDate = d;
      loadCalendar();
    }

    function calendarNext() {
      if (!state.calendarRefDate) state.calendarRefDate = new Date();
      var d = new Date(state.calendarRefDate.getTime());
      if (state.calendarView === 'DIARIA') {
        d.setDate(d.getDate() + 1);
      } else if (state.calendarView === 'ANUAL') {
        d.setFullYear(d.getFullYear() + 1);
      } else {
        d.setMonth(d.getMonth() + 1);
      }
      state.calendarRefDate = d;
      loadCalendar();
    }

    function calendarToday() {
      state.calendarRefDate = new Date();
      loadCalendar();
    }

    function calendarSetView(view) {
      state.calendarView = view;
      ['month', 'day', 'year', 'list'].forEach(function (v) {
        var btn = document.getElementById('btn-fc-view-' + v);
        if (btn) btn.classList.remove('active');
      });
      var map = { 'MENSAL': 'month', 'DIARIA': 'day', 'ANUAL': 'year', 'LISTA': 'list' };
      var activeBtn = document.getElementById('btn-fc-view-' + (map[view] || 'month'));
      if (activeBtn) activeBtn.classList.add('active');
      loadCalendar();
    }

    function calendarGoToDate(isoDate) {
      if (!isoDate) return;
      var parts = isoDate.split('-');
      state.calendarRefDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      calendarSetView('DIARIA');
    }

    function calendarGoToMonth(year, monthIndex) {
      state.calendarRefDate = new Date(year, monthIndex, 1);
      calendarSetView('MENSAL');
    }

    function renderEventPills(evs) {
      if (!evs || evs.length === 0) return '';
      return evs.map(function (ev) {
        var isEntrada = (ev.tipo === 'ENTRADA');
        var isConsignado = Boolean(ev.is_consignado);
        var isMercado = (ev.origem_tipo === 'ECONOMICO');
        var isInvestimento = (ev.origem === 'INVESTIMENTO');

        var pillClass = 'fc-event-saida';
        var sign = '↓ ';
        if (isEntrada) {
          pillClass = 'fc-event-entrada';
          sign = '↑ ';
        } else if (isConsignado) {
          pillClass = 'fc-event-consignado';
          sign = '🏢 ';
        } else if (isMercado) {
          pillClass = 'fc-event-mercado';
          sign = '📊 ';
        } else if (isInvestimento) {
          pillClass = 'fc-event-investimento';
          sign = '📈 ';
        }

        var clickAttr = '';
        if (ev.origem_tipo === 'LANCAMENTO' && ev.id) {
          clickAttr = 'onclick="event.stopPropagation(); App.viewLaunchDetails(\'' + ev.id + '\')"';
        } else if (isConsignado) {
          clickAttr = 'onclick="event.stopPropagation(); App.navigate(\'loans\')"';
        } else if (isMercado) {
          var impactTxt = (ev.detalhes_agenda && ev.detalhes_agenda.impacto) ? String(ev.detalhes_agenda.impacto).replace(/'/g, "\\'") : '';
          var titleEsc = String(ev.titulo || '').replace(/'/g, "\\'");
          clickAttr = 'onclick="event.stopPropagation(); App.showEconomicEventDetails(\'' + titleEsc + '\', \'' + impactTxt + '\')"';
        }

        var valStr = (ev.valor_centavos > 0) ? ' ' + UIHelpers.formatBrl(ev.valor_centavos) : '';
        return '<div class="fc-event-item ' + pillClass + '" ' + clickAttr + ' title="' + UIHelpers.escapeHtml(ev.titulo) + (ev.valor_centavos > 0 ? ' (' + UIHelpers.formatBrl(ev.valor_centavos) + ')' : '') + '">' +
          sign + UIHelpers.escapeHtml(ev.titulo) + valStr +
        '</div>';
      }).join('');
    }

    function renderMonthCalendar(cal, container) {
      var ref = state.calendarRefDate || new Date();
      var year = ref.getFullYear();
      var month = ref.getMonth(); // 0-11
      var todayIso = toIsoDate(new Date());

      var eventsByDate = {};
      (cal.eventos || []).forEach(function (ev) {
        var dIsoKey = toIsoDateStr(ev.data);
        if (!eventsByDate[dIsoKey]) eventsByDate[dIsoKey] = [];
        eventsByDate[dIsoKey].push(ev);
      });

      var firstDay = new Date(year, month, 1);
      var startDayOfWeek = firstDay.getDay(); // 0 = Domingo
      var daysInMonth = new Date(year, month + 1, 0).getDate();
      var daysInPrevMonth = new Date(year, month, 0).getDate();

      var cols = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
      var html = '<div class="fc-month-grid">';

      cols.forEach(function (c) {
        html += '<div class="fc-col-header">' + c + '</div>';
      });

      // Dias do mês anterior
      for (var p = startDayOfWeek - 1; p >= 0; p--) {
        var dayNum = daysInPrevMonth - p;
        var prevMonthIndex = month === 0 ? 11 : month - 1;
        var prevYear = month === 0 ? year - 1 : year;
        var dIso = prevYear + '-' + (prevMonthIndex + 1 < 10 ? '0' + (prevMonthIndex + 1) : prevMonthIndex + 1) + '-' + (dayNum < 10 ? '0' + dayNum : dayNum);
        var evs = eventsByDate[dIso] || [];
        html += '<div class="fc-day-cell fc-other-month" onclick="App.calendarGoToDate(\'' + dIso + '\')">';
        html += '<div class="fc-day-header"><span class="fc-day-number">' + dayNum + '</span></div>';
        html += '<div class="fc-events-list">' + renderEventPills(evs) + '</div>';
        html += '</div>';
      }

      // Dias do mês atual
      for (var d = 1; d <= daysInMonth; d++) {
        var dIso = year + '-' + (month + 1 < 10 ? '0' + (month + 1) : month + 1) + '-' + (d < 10 ? '0' + d : d);
        var isToday = (dIso === todayIso);
        var evs = eventsByDate[dIso] || [];
        html += '<div class="fc-day-cell ' + (isToday ? 'fc-today' : '') + '">';
        html += '<div class="fc-day-header">';
        html += '<span class="fc-day-number">' + d + '</span>';
        if (evs.length > 0) {
          var dayTotal = 0;
          var hasBalanceAffecting = false;
          evs.forEach(function (e) {
            if (e.afeta_saldo !== false) {
              hasBalanceAffecting = true;
              dayTotal += (e.tipo === 'ENTRADA' ? e.valor_centavos : -e.valor_centavos);
            }
          });
          if (hasBalanceAffecting) {
            html += '<small class="' + (dayTotal >= 0 ? 'money-positive' : 'money-negative') + '" style="font-size:0.65rem; font-weight:600;">' + (dayTotal >= 0 ? '+' : '') + UIHelpers.formatBrl(dayTotal) + '</small>';
          }
        }
        html += '</div>';
        html += '<div class="fc-events-list">' + renderEventPills(evs) + '</div>';
        html += '</div>';
      }

      // Dias do próximo mês
      var totalCells = startDayOfWeek + daysInMonth;
      var remaining = (7 - (totalCells % 7)) % 7;
      for (var n = 1; n <= remaining; n++) {
        var nextMonthIndex = month === 11 ? 0 : month + 1;
        var nextYear = month === 11 ? year + 1 : year;
        var dIso = nextYear + '-' + (nextMonthIndex + 1 < 10 ? '0' + (nextMonthIndex + 1) : nextMonthIndex + 1) + '-' + (n < 10 ? '0' + n : n);
        var evs = eventsByDate[dIso] || [];
        html += '<div class="fc-day-cell fc-other-month" onclick="App.calendarGoToDate(\'' + dIso + '\')">';
        html += '<div class="fc-day-header"><span class="fc-day-number">' + n + '</span></div>';
        html += '<div class="fc-events-list">' + renderEventPills(evs) + '</div>';
        html += '</div>';
      }

      html += '</div>';
      container.innerHTML = html;
    }

    function renderYearCalendar(cal, container) {
      var ref = state.calendarRefDate || new Date();
      var year = ref.getFullYear();

      var monthData = {};
      for (var m = 1; m <= 12; m++) {
        monthData[m] = { count: 0, receitas: 0, despesas: 0 };
      }
      (cal.eventos || []).forEach(function (ev) {
        var dIsoKey = toIsoDateStr(ev.data);
        if (dIsoKey && dIsoKey.length >= 7) {
          var evYear = parseInt(dIsoKey.substring(0, 4), 10);
          if (evYear === year) {
            var mNum = parseInt(dIsoKey.substring(5, 7), 10);
            if (monthData[mNum]) {
              monthData[mNum].count++;
              if (ev.tipo === 'ENTRADA') monthData[mNum].receitas += (ev.valor_centavos || 0);
              else if (ev.tipo === 'SAIDA') monthData[mNum].despesas += (ev.valor_centavos || 0);
            }
          }
        }
      });

      var html = '<div class="fc-year-grid">';
      for (var i = 0; i < 12; i++) {
        var mNum = i + 1;
        var md = monthData[mNum];
        var saldoM = md.receitas - md.despesas;

        html +=
          '<div class="fc-year-month-card" onclick="App.calendarGoToMonth(' + year + ', ' + i + ')">' +
            '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem; border-bottom:1px solid var(--border-color); padding-bottom:0.35rem;">' +
              '<h3 style="margin:0; font-size:0.95rem; font-weight:700;">' + MONTH_NAMES[i] + '</h3>' +
              '<span class="badge badge-info">' + md.count + ' ev.</span>' +
            '</div>' +
            '<div style="display:flex; flex-direction:column; gap:0.25rem; font-size:0.78rem;">' +
              '<div style="display:flex; justify-content:space-between;">' +
                '<span style="color:var(--text-secondary);">Receitas:</span>' +
                '<span class="money-positive">+' + UIHelpers.formatBrl(md.receitas) + '</span>' +
              '</div>' +
              '<div style="display:flex; justify-content:space-between;">' +
                '<span style="color:var(--text-secondary);">Despesas:</span>' +
                '<span class="money-negative">-' + UIHelpers.formatBrl(md.despesas) + '</span>' +
              '</div>' +
              '<div style="display:flex; justify-content:space-between; font-weight:700; margin-top:2px; border-top:1px dashed var(--border-color); padding-top:2px;">' +
                '<span>Saldo:</span>' +
                '<span class="' + (saldoM >= 0 ? 'money-positive' : 'money-negative') + '">' + UIHelpers.formatBrl(saldoM) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }

    function renderListCalendar(cal, container) {
      var rows = (cal.eventos || []).map(function (ev) {
        var isEntrada = (ev.tipo === 'ENTRADA');
        var isConsignado = Boolean(ev.is_consignado);
        var clickAttr = '';
        if (ev.origem_tipo === 'LANCAMENTO' && ev.id) {
          clickAttr = '<button type="button" class="btn btn-secondary btn-sm" onclick="App.viewLaunchDetails(\'' + ev.id + '\')">Ver</button>';
        } else if (isConsignado) {
          clickAttr = '<button type="button" class="btn btn-secondary btn-sm" onclick="App.navigate(\'loans\')">Contrato</button>';
        } else if (ev.origem_tipo === 'ECONOMICO') {
          var impactTxt = (ev.detalhes_agenda && ev.detalhes_agenda.impacto) ? String(ev.detalhes_agenda.impacto).replace(/'/g, "\\'") : '';
          var titleEsc = String(ev.titulo || '').replace(/'/g, "\\'");
          clickAttr = '<button type="button" class="btn btn-secondary btn-sm" onclick="App.showEconomicEventDetails(\'' + titleEsc + '\', \'' + impactTxt + '\')">Info</button>';
        }

        var originLabel = ev.origem || ev.origem_tipo;
        if (isConsignado) originLabel = 'CONSIGNADO';

        var valorCol = '';
        if (ev.valor_centavos > 0) {
          valorCol = '<td class="col-money ' + (isEntrada ? 'money-positive' : (isConsignado ? 'money-estimated' : 'money-negative')) + '">' + (isEntrada ? '+' : '-') + UIHelpers.formatBrl(ev.valor_centavos) + '</td>';
        } else {
          valorCol = '<td class="col-money" style="color:var(--text-muted); font-size:0.75rem;">Informativo</td>';
        }

        return (
          '<tr>' +
          '<td>' + UIHelpers.formatDateBr(ev.data) + '</td>' +
          '<td><strong>' + UIHelpers.escapeHtml(ev.titulo) + '</strong></td>' +
          '<td>' + UIHelpers.renderBadge(originLabel) + '</td>' +
          '<td>' + UIHelpers.renderBadge(ev.situacao) + '</td>' +
          '<td>' + UIHelpers.renderBadge(ev.alerta_vencimento) + '</td>' +
          valorCol +
          '<td>' + clickAttr + '</td>' +
          '</tr>'
        );
      }).join('');

      container.innerHTML = rows
        ? '<table class="data-table"><thead><tr><th>Data</th><th>Compromisso</th><th>Origem</th><th>Situação</th><th>Alerta</th><th class="col-money">Valor</th><th>Ação</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<p style="color:var(--text-muted); text-align:center; padding:2rem 0;">Nenhum evento financeiro neste período.</p>';

    function loadCalendar() {
      if (!state.calendarRefDate) state.calendarRefDate = new Date();
      var refDate = state.calendarRefDate;
      var isoRef = toIsoDate(refDate);

      var elVisao = document.getElementById('cal-visao');
      var elDataRef = document.getElementById('cal-data-ref');
      var elTipo = document.getElementById('cal-filtro-tipo');
      var elOrigem = document.getElementById('cal-filtro-origem');
      var elCheckMercado = document.getElementById('cal-check-mercado');
      if (elVisao) elVisao.value = state.calendarView;
      if (elDataRef) elDataRef.value = isoRef;

      var elTitle = document.getElementById('fc-current-title');
      if (elTitle) {
        if (state.calendarView === 'ANUAL') {
          elTitle.textContent = 'Ano de ' + refDate.getFullYear();
        } else if (state.calendarView === 'DIARIA') {
          elTitle.textContent = DAY_NAMES[refDate.getDay()] + ', ' + refDate.getDate() + ' de ' + MONTH_NAMES[refDate.getMonth()] + ' de ' + refDate.getFullYear();
        } else {
          elTitle.textContent = MONTH_NAMES[refDate.getMonth()] + ' de ' + refDate.getFullYear();
        }
      }

      var payload = {
        visao: (state.calendarView === 'LISTA' ? 'MENSAL' : state.calendarView),
        data_referencia: isoRef,
        tipo: elTipo ? elTipo.value : '',
        origem: elOrigem ? elOrigem.value : '',
        incluir_eventos_mercado: elCheckMercado ? elCheckMercado.checked : true,
        ano: String(refDate.getFullYear()),
        mes: isoRef.substring(0, 7)
      };

      callServer('calendar.get', payload, function (res) {
        var cal = res.data || {};
        state.calendarEvents = cal.eventos || [];

        var totalEntradas = 0;
        var totalSaidas = 0;
        var totalConsignado = 0;
        var totalEventosMercado = 0;
        state.calendarEvents.forEach(function (ev) {
          if (ev.afeta_saldo === false) {
            if (ev.is_consignado) totalConsignado += (ev.valor_centavos || 0);
            if (ev.origem_tipo === 'ECONOMICO') totalEventosMercado++;
          } else {
            if (ev.tipo === 'ENTRADA') totalEntradas += (ev.valor_centavos || 0);
            else if (ev.tipo === 'SAIDA') totalSaidas += (ev.valor_centavos || 0);
          }
        });
        var saldo = totalEntradas - totalSaidas;

        var consignadoBadge = totalConsignado > 0
          ? '<div class="fc-summary-item">' +
              '<span class="fc-summary-label" style="display:inline-flex; align-items:center; gap:0.25rem;"><span>Consignado (Folha)</span><span class="info-popover-wrap" data-info-key="cal-resumo-consignado"></span></span>' +
              '<span class="fc-summary-value money-estimated">🏢 ' + UIHelpers.formatBrl(totalConsignado) + '</span>' +
            '</div>'
          : '';
        var mercadoBadge = totalEventosMercado > 0
          ? '<div class="fc-summary-item">' +
              '<span class="fc-summary-label" style="display:inline-flex; align-items:center; gap:0.25rem;"><span>Agenda de Mercado</span><span class="info-popover-wrap" data-info-key="cal-resumo-mercado"></span></span>' +
              '<span class="fc-summary-value" style="color:var(--predicted);">📊 ' + totalEventosMercado + ' evento(s)</span>' +
            '</div>'
          : '';

        var elSummary = document.getElementById('calendar-summary-header');
        if (elSummary) {
          elSummary.innerHTML =
            '<div class="fc-summary-item">' +
              '<span class="fc-summary-label" style="display:inline-flex; align-items:center; gap:0.25rem;"><span>Entradas no Período</span><span class="info-popover-wrap" data-info-key="cal-resumo-entradas"></span></span>' +
              '<span class="fc-summary-value money-positive">+' + UIHelpers.formatBrl(totalEntradas) + '</span>' +
            '</div>' +
            '<div class="fc-summary-item">' +
              '<span class="fc-summary-label" style="display:inline-flex; align-items:center; gap:0.25rem;"><span>Saídas no Período</span><span class="info-popover-wrap" data-info-key="cal-resumo-saidas"></span></span>' +
              '<span class="fc-summary-value money-negative">-' + UIHelpers.formatBrl(totalSaidas) + '</span>' +
            '</div>' +
            '<div class="fc-summary-item">' +
              '<span class="fc-summary-label" style="display:inline-flex; align-items:center; gap:0.25rem;"><span>Saldo Líquido Caixa</span><span class="info-popover-wrap" data-info-key="cal-resumo-saldo"></span></span>' +
              '<span class="fc-summary-value ' + (saldo >= 0 ? 'money-positive' : 'money-negative') + '">' + UIHelpers.formatBrl(saldo) + '</span>' +
            '</div>' +
            consignadoBadge +
            mercadoBadge +
            '<div class="fc-summary-item" style="margin-left:auto;">' +
              '<span class="fc-summary-label" style="display:inline-flex; align-items:center; gap:0.25rem;"><span>Total de Compromissos</span><span class="info-popover-wrap" data-info-key="cal-resumo-total"></span></span>' +
              '<span class="fc-summary-value">' + (cal.total_eventos || state.calendarEvents.length) + ' evento(s)</span>' +
            '</div>';
        }

        var container = document.getElementById('calendar-events-container');
        if (container) {
          if (state.calendarView === 'DIARIA') {
            renderDayCalendar(cal, container);
          } else if (state.calendarView === 'ANUAL') {
            renderYearCalendar(cal, container);
          } else if (state.calendarView === 'LISTA') {
            renderListCalendar(cal, container);
          } else {
            renderMonthCalendar(cal, container);
          }
        }

        var secCalendar = document.getElementById('sec-calendar');
        if (secCalendar && window.UIHelpers && typeof window.UIHelpers.initInfoPopovers === 'function') {
          window.UIHelpers.initInfoPopovers(secCalendar);
        }
      });
    }

    function loadProjections(saveSnapshot) {
      var h = parseInt(document.getElementById('proj-horizonte').value || '6', 10);
      callServer('projections.generate', { horizonte_meses: h, salvar_snapshot: Boolean(saveSnapshot) }, function (res) {
        var p = res.data || {};
        state.currentProjections = p;

        if (saveSnapshot) {
          showToast('Snapshot de projeção salvo com sucesso no banco de dados!', 'success');
        }

        // 1. Atualizar Lista e Cards de Premissas
        var premissas = p.premissas || [];
        var elList = document.getElementById('proj-premissas-list');
        if (elList) {
          elList.innerHTML = premissas.map(function (pr) {
            return '<li>' + UIHelpers.escapeHtml(pr) + '</li>';
          }).join('');
        }

        var elCards = document.getElementById('proj-premissas-cards');
        if (elCards) {
          var icons = ['🏦', '🔄', '💳', '🛡️', '📈'];
          elCards.innerHTML = premissas.map(function (pr, idx) {
            var icon = icons[idx % icons.length];
            return (
              '<div class="detail-item" style="padding:0.65rem 0.85rem;">' +
                '<div style="display:flex; align-items:center; gap:0.5rem; font-weight:600; font-size:0.83rem; color:var(--text-primary); margin-bottom:2px;">' +
                  '<span>' + icon + '</span>' +
                  '<span>Premissa ' + (idx + 1) + '</span>' +
                '</div>' +
                '<small style="color:var(--text-secondary); font-size:0.78rem; line-height:1.4;">' + UIHelpers.escapeHtml(pr) + '</small>' +
              '</div>'
            );
          }).join('');
        }

        // 2. Calcular e Exibir KPIs
        var cenarios = p.cenarios_mensais || [];
        var saldoBase = p.saldo_bancario_confirmado_atual_centavos || 0;
        var totalEntradas = 0;
        var totalSaidas = 0;
        var temAlertaNegativo = false;

        cenarios.forEach(function (c) {
          totalEntradas += (c.receitas_previstas_centavos || 0);
          totalSaidas += ((c.despesas_previstas_centavos || 0) + (c.parcelas_compromissos_centavos || 0));
          if (c.alerta_saldo_negativo) temAlertaNegativo = true;
        });

        var ultimoCenario = cenarios.length > 0 ? cenarios[cenarios.length - 1] : null;
        var saldoFinal = ultimoCenario ? ultimoCenario.saldo_final_projetado_centavos : saldoBase;

        var elSaldoBase = document.getElementById('proj-kpi-saldo-inicial');
        var elReceitas = document.getElementById('proj-kpi-receitas');
        var elSaidas = document.getElementById('proj-kpi-saidas');
        var elSaldoFinal = document.getElementById('proj-kpi-saldo-final');
        var elStatusBadge = document.getElementById('proj-kpi-status-badge');
        var elSaldoDesc = document.getElementById('proj-kpi-saldo-desc');
        var elTableBadge = document.getElementById('proj-table-count-badge');

        if (elSaldoBase) elSaldoBase.textContent = UIHelpers.formatBrl(saldoBase);
        if (elReceitas) elReceitas.textContent = '+' + UIHelpers.formatBrl(totalEntradas);
        if (elSaidas) elSaidas.textContent = '-' + UIHelpers.formatBrl(totalSaidas);
        if (elSaldoFinal) {
          elSaldoFinal.textContent = UIHelpers.formatBrl(saldoFinal);
          elSaldoFinal.className = 'summary-value ' + (saldoFinal >= 0 ? 'money-positive' : 'money-negative');
        }
        if (elStatusBadge) {
          if (temAlertaNegativo) {
            elStatusBadge.className = 'badge badge-cancelado';
            elStatusBadge.textContent = 'Atenção: Déficit';
          } else {
            elStatusBadge.className = 'badge badge-confirmado';
            elStatusBadge.textContent = 'Fluxo Saudável';
          }
        }
        if (elSaldoDesc) {
          elSaldoDesc.textContent = 'Estimativa após ' + cenarios.length + ' mês(es)';
        }
        if (elTableBadge) {
          elTableBadge.textContent = cenarios.length + ' meses projetados';
        }

        // 3. Renderizar Tabela de Cenários Mensais
        var rows = cenarios.map(function (c) {
          var varLiq = c.variacao_futura_liquida_centavos !== undefined
            ? c.variacao_futura_liquida_centavos
            : (c.receitas_previstas_centavos - (c.despesas_previstas_centavos + c.parcelas_compromissos_centavos));

          var statusBadge = c.alerta_saldo_negativo
            ? '<span class="badge badge-cancelado" style="font-size:0.7rem;">⚠️ Déficit Estimado</span>'
            : '<span class="badge badge-confirmado" style="font-size:0.7rem;">✓ Superávit</span>';

          var compLabel = c.competencia;
          var compParts = String(c.competencia).split('-');
          if (compParts.length === 2) {
            var mIdx = parseInt(compParts[1], 10) - 1;
            if (MONTH_NAMES[mIdx]) {
              compLabel = MONTH_NAMES[mIdx] + ' / ' + compParts[0];
            }
          }

          var regsCount = c.registros_componentes ? c.registros_componentes.length : 0;
          var btnComposicao = '<button type="button" class="btn btn-secondary btn-sm" onclick="App.viewProjectionMonthDetails(\'' + UIHelpers.escapeHtml(c.competencia) + '\')" style="font-size:0.72rem; padding:0.25rem 0.5rem;" title="Ver detalhes dos itens que formam este mês">Ver Composição (' + regsCount + ')</button>';

          return (
            '<tr>' +
            '<td><strong>' + UIHelpers.escapeHtml(compLabel) + '</strong></td>' +
            '<td class="col-money">' + UIHelpers.formatBrl(c.saldo_inicial_referencia_centavos) + '</td>' +
            '<td class="col-money money-positive">+' + UIHelpers.formatBrl(c.receitas_previstas_centavos) + '</td>' +
            '<td class="col-money money-negative">-' + UIHelpers.formatBrl(c.despesas_previstas_centavos + c.parcelas_compromissos_centavos) + '</td>' +
            '<td class="col-money ' + (varLiq >= 0 ? 'money-positive' : 'money-negative') + '">' + (varLiq >= 0 ? '+' : '') + UIHelpers.formatBrl(varLiq) + '</td>' +
            '<td class="col-money ' + (c.alerta_saldo_negativo ? 'money-negative' : 'money-estimated') + '"><strong>' + UIHelpers.formatBrl(c.saldo_final_projetado_centavos) + '</strong></td>' +
            '<td>' + statusBadge + '</td>' +
            '<td style="text-align:right;">' + btnComposicao + '</td>' +
            '</tr>'
          );
        }).join('');

        var elTable = document.getElementById('projections-table-container');
        if (elTable) {
          elTable.innerHTML = rows
            ? '<table class="data-table"><thead><tr><th>Competência</th><th class="col-money">Saldo Inicial</th><th class="col-money">Entradas Previstas</th><th class="col-money">Saídas & Parcelas</th><th class="col-money">Variação Líquida</th><th class="col-money">Saldo Final Estimado</th><th>Status</th><th style="text-align:right;">Composição</th></tr></thead><tbody>' + rows + '</tbody></table>'
            : '<p style="color:var(--text-muted); text-align:center; padding:2rem 0;">Nenhum cenário projetado para este horizonte.</p>';
        }

        var secPlanning = document.getElementById('sec-planning');
        if (secPlanning && window.UIHelpers && typeof window.UIHelpers.initInfoPopovers === 'function') {
          window.UIHelpers.initInfoPopovers(secPlanning);
        }
      });
    }

    function viewProjectionMonthDetails(competencia) {
      var p = state.currentProjections;
      if (!p || !p.cenarios_mensais) return;
      var cenario = p.cenarios_mensais.find(function (c) { return c.competencia === competencia; });
      if (!cenario) return;

    function loadCategoryBudgets() {
      var mesEl = document.getElementById('budget-mes-referencia');
      var mes = (mesEl && mesEl.value) ? mesEl.value : new Date().toISOString().substring(0, 7);
      if (mesEl && !mesEl.value) mesEl.value = mes;

      callServer('categories.getBudgetStatus', { mes_referencia: mes }, function (res) {
        var d = res.data || {};
        state.categoryBudgetData = d;

        var elOrc = document.getElementById('budget-kpi-total-orcado');
        var elGasto = document.getElementById('budget-kpi-total-gasto');
        var elSaldo = document.getElementById('budget-kpi-saldo-restante');
        var elPct = document.getElementById('budget-kpi-pct-geral');
        var elSaldoBadge = document.getElementById('budget-kpi-saldo-badge');
        var elPctBadge = document.getElementById('budget-kpi-pct-badge');

        if (elOrc) elOrc.textContent = UIHelpers.formatBrl(d.total_orcado_centavos || 0);
        if (elGasto) elGasto.textContent = UIHelpers.formatBrl(d.total_gasto_centavos || 0);
        if (elSaldo) elSaldo.textContent = UIHelpers.formatBrl(d.saldo_restante_centavos || 0);
        if (elPct) elPct.textContent = (d.percentual_consumido || 0) + '%';

        if (elSaldoBadge) {
          var isPos = (d.saldo_restante_centavos || 0) >= 0;
          elSaldoBadge.textContent = isPos ? 'Margem Livre' : 'Orçamento Estourado';
          elSaldoBadge.className = 'badge ' + (isPos ? 'badge-confirmado' : 'badge-cancelado');
        }

        if (elPctBadge) {
          var pct = d.percentual_consumido || 0;
          if (pct < 70) {
            elPctBadge.className = 'badge badge-confirmado';
            elPctBadge.textContent = '🟢 Saudável';
          } else if (pct < 90) {
            elPctBadge.className = 'badge badge-previsto';
            elPctBadge.textContent = '🟡 Atenção';
          } else if (pct <= 100) {
            elPctBadge.className = 'badge badge-pendente';
            elPctBadge.textContent = '🟠 Crítico';
          } else {
            elPctBadge.className = 'badge badge-cancelado';
            elPctBadge.textContent = '🔴 Estourado';
          }
        }

        renderCategoryBudgets(d);
      });
    }

    function renderCategoryBudgets(data) {
      var grid = document.getElementById('budget-categories-grid');
      if (!grid) return;
      var cats = (data && data.categorias) || [];
      if (cats.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted); padding:1.5rem; text-align:center;">Nenhuma categoria encontrada.</p>';
        return;
      }

      var html = cats.map(function (c) {
        var pct = c.percentual_gasto || 0;
        var barWidth = Math.min(100, pct);
        var barColor = '#10b981';
        var badgeText = '🟢 Até 70%';
        var badgeClass = 'badge-confirmado';

        if (c.alerta === 'AMARELO') {
          barColor = '#f59e0b';
          badgeText = '🟡 Atenção (70-90%)';
          badgeClass = 'badge-previsto';
        } else if (c.alerta === 'LARANJA') {
          barColor = '#f97316';
          badgeText = '🟠 Crítico (90-100%)';
          badgeClass = 'badge-pendente';
        } else if (c.alerta === 'VERMELHO') {
          barColor = '#ef4444';
          badgeText = '🔴 Estourado (> 100%)';
          badgeClass = 'badge-cancelado';
        }

        var tetoFormatado = c.sem_limite ? 'Sem teto definido' : UIHelpers.formatBrl(c.orcamento_mensal_centavos);
        var saldoFormatado = c.sem_limite ? '-' : UIHelpers.formatBrl(c.saldo_centavos);

        return (
          '<div class="card" style="margin:0; border:1px solid var(--border-color); border-radius:10px; padding:14px; background:var(--bg-secondary);">' +
            '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">' +
              '<div>' +
                '<strong style="font-size:0.95rem; color:var(--text-primary);">' + UIHelpers.escapeHtml(c.categoria_nome) + '</strong>' +
                '<div style="font-size:0.75rem; color:var(--text-secondary); margin-top:2px;">Teto: ' + tetoFormatado + '</div>' +
              '</div>' +
              '<span class="badge ' + badgeClass + '" style="font-size:0.68rem;">' + badgeText + '</span>' +
            '</div>' +

            '<div style="margin:10px 0 6px 0;">' +
              '<div style="display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:4px;">' +
                '<span style="color:var(--text-secondary);">Gasto: <strong>' + UIHelpers.formatBrl(c.gasto_mes_centavos) + '</strong></span>' +
                '<span style="font-weight:700; color:' + barColor + ';">' + pct + '%</span>' +
              '</div>' +
              '<div style="height:7px; background:var(--bg-surface); border-radius:4px; overflow:hidden;">' +
                '<div style="height:100%; width:' + barWidth + '%; background:' + barColor + '; border-radius:4px; transition:width 0.3s ease;"></div>' +
              '</div>' +
            '</div>' +

            '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:8px; border-top:1px solid var(--border-color); font-size:0.78rem;">' +
              '<span style="color:var(--text-secondary);">Saldo: <strong style="color:' + (c.saldo_centavos >= 0 ? 'var(--text-primary)' : 'var(--danger)') + ';">' + saldoFormatado + '</strong></span>' +
              '<button type="button" class="btn btn-outline btn-sm" onclick="App.openEditBudgetModal(\'' + UIHelpers.escapeHtml(c.categoria_id) + '\', \'' + UIHelpers.escapeHtml(c.categoria_nome) + '\', ' + ((c.orcamento_mensal_centavos || 0) / 100) + ')" style="font-size:0.72rem; padding:3px 8px;">' +
                (c.sem_limite ? 'Definir Teto' : 'Ajustar Teto') +
              '</button>' +
            '</div>' +
          '</div>'
        );
      }).join('');

      grid.innerHTML = html;

      var secPlanning = document.getElementById('sec-planning');
      if (secPlanning && window.UIHelpers && typeof window.UIHelpers.initInfoPopovers === 'function') {
        window.UIHelpers.initInfoPopovers(secPlanning);
      }
    }

    function renderGoals(data) {
      state.goals = (data && data.metas) || [];

      var elAlvo = document.getElementById('goals-kpi-total-alvo');
      var elAcum = document.getElementById('goals-kpi-total-acumulado');
      var elPct = document.getElementById('goals-kpi-pct-geral');
      var elPctBadge = document.getElementById('goals-kpi-pct-badge');
      var elCount = document.getElementById('goals-count-badge');

      if (elAlvo) elAlvo.textContent = UIHelpers.formatBrl(data.total_alvo_centavos || 0);
      if (elAcum) elAcum.textContent = UIHelpers.formatBrl(data.total_acumulado_centavos || 0);
      if (elPct) elPct.textContent = (data.percentual_geral || 0) + '%';
      if (elPctBadge) elPctBadge.textContent = (data.percentual_geral || 0) + '% conquistado';
      if (elCount) elCount.textContent = state.goals.length + ' metas';

      var emptyEl = document.getElementById('goals-empty-state');
      var gridEl = document.getElementById('goals-grid-container');

      if (state.goals.length === 0) {
        if (emptyEl) emptyEl.style.display = 'block';
        if (gridEl) gridEl.style.display = 'none';
        return;
      }

      if (emptyEl) emptyEl.style.display = 'none';
      if (gridEl) {
        gridEl.style.display = 'grid';
        gridEl.innerHTML = state.goals.map(function (g) {
          var isConcluida = g.situacao === 'CONCLUIDA';
          var pct = Math.min(100, g.percentual_concluido || 0);
          var barColor = isConcluida ? '#10b981' : '#6366f1';
          var statusBadge = isConcluida
            ? '<span class="badge badge-confirmado">🎉 Concluída</span>'
            : '<span class="badge badge-previsto">Em Andamento</span>';

          var deadlineInfo = '';
          if (isConcluida) {
            deadlineInfo = '<span style="color:#10b981; font-weight:600;">Objetivo 100% atingido! Parabéns!</span>';
          } else if (g.data_limite) {
            deadlineInfo = 'Prazo: <strong>' + UIHelpers.formatDateBr(g.data_limite) + '</strong> (' + g.meses_restantes + ' meses) • Guardar ~<strong>' + UIHelpers.formatBrl(g.esforco_mensal_sugerido_centavos) + '</strong>/mês';
          } else {
            deadlineInfo = '<span style="color:var(--text-muted);">Sem data limite definida</span>';
          }

          var catLabel = g.categoria || 'OUTROS';
          var catEmoji = '🎯';
          if (catLabel === 'RESERVA_EMERGENCIA') catEmoji = '🛡️';
          else if (catLabel === 'VIAGEM') catEmoji = '✈️';
          else if (catLabel === 'VEICULO') catEmoji = '🚗';
          else if (catLabel === 'IMOVEL') catEmoji = '🏠';
          else if (catLabel === 'EDUCACAO') catEmoji = '🎓';
          else if (catLabel === 'INVESTIMENTO') catEmoji = '📈';

          return (
            '<div class="card" style="margin:0; border:1px solid var(--border-color); border-radius:12px; padding:16px; background:var(--bg-secondary); display:flex; flex-direction:column; justify-content:space-between;">' +
              '<div>' +
                '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">' +
                  '<div style="display:flex; align-items:center; gap:8px;">' +
                    '<span style="font-size:1.3rem;">' + catEmoji + '</span>' +
                    '<div>' +
                      '<strong style="font-size:1rem; color:var(--text-primary); display:block;">' + UIHelpers.escapeHtml(g.nome) + '</strong>' +
                      '<small style="color:var(--text-secondary); font-size:0.75rem;">' + UIHelpers.escapeHtml(g.descricao || '') + '</small>' +
                    '</div>' +
                  '</div>' +
                  statusBadge +
                '</div>' +

                '<div style="margin:14px 0 8px 0;">' +
                  '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">' +
                    '<span style="font-size:1.15rem; font-weight:700; color:var(--text-primary);">' + UIHelpers.formatBrl(g.valor_atual_centavos) + '</span>' +
                    '<span style="font-size:0.8rem; color:var(--text-secondary);">de ' + UIHelpers.formatBrl(g.valor_alvo_centavos) + '</span>' +
                  '</div>' +
                  '<div style="height:8px; background:var(--bg-surface); border-radius:4px; overflow:hidden;">' +
                    '<div style="height:100%; width:' + pct + '%; background:' + barColor + '; border-radius:4px; transition:width 0.4s ease;"></div>' +
                  '</div>' +
                  '<div style="display:flex; justify-content:space-between; font-size:0.75rem; margin-top:4px; color:var(--text-secondary);">' +
                    '<span>' + pct + '% alcançado</span>' +
                    '<span>Faltam ' + UIHelpers.formatBrl(g.falta_centavos) + '</span>' +
                  '</div>' +
                '</div>' +

                '<div style="font-size:0.78rem; color:var(--text-secondary); background:var(--bg-surface); padding:8px 10px; border-radius:6px; margin:8px 0 12px 0;">' +
                  deadlineInfo +
                '</div>' +
              '</div>' +

              '<div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-color); padding-top:10px; margin-top:6px;">' +
                '<div style="display:flex; gap:0.4rem;">' +
                  '<button type="button" class="btn btn-secondary btn-sm" onclick="App.openEditGoalModal(\'' + UIHelpers.escapeHtml(g.id) + '\')" title="Editar Meta">' +
                    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>' +
                  '</button>' +
                  '<button type="button" class="btn btn-secondary btn-sm" onclick="App.deleteGoal(\'' + UIHelpers.escapeHtml(g.id) + '\')" title="Excluir Meta" style="color:var(--danger);">' +
                    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>' +
                  '</button>' +
                '</div>' +
                '<button type="button" class="btn btn-primary btn-sm" onclick="App.openContributeModal(\'' + UIHelpers.escapeHtml(g.id) + '\', \'' + UIHelpers.escapeHtml(g.nome) + '\', ' + (g.falta_centavos || 0) + ')" style="background:linear-gradient(135deg,#10b981,#059669); font-size:0.75rem; padding:4px 10px;">' +
                  '💰 Guardar Dinheiro' +
                '</button>' +
              '</div>' +
            '</div>'
          );
        }).join('');
      }

      var secGoals = document.getElementById('sec-goals');
      if (secGoals && window.UIHelpers && typeof window.UIHelpers.initInfoPopovers === 'function') {
        window.UIHelpers.initInfoPopovers(secGoals);
      }
    }

    function saveGoal(event) {
      if (event && event.preventDefault) event.preventDefault();

      var goalId = document.getElementById('goal-id').value;
      var payload = {
        nome: document.getElementById('goal-nome').value,
        categoria: document.getElementById('goal-categoria').value,
        data_limite: document.getElementById('goal-data-limite').value || null,
        valor_alvo_centavos: Math.round(parseFloat(document.getElementById('goal-valor-alvo').value || '0') * 100),
        valor_atual_centavos: Math.round(parseFloat(document.getElementById('goal-valor-atual').value || '0') * 100),
        descricao: document.getElementById('goal-descricao').value || ''
      };

      if (goalId) {
        payload.id = goalId;
        callServer('goals.update', payload, function () {
          showToast('Meta atualizada com sucesso!', 'success');
          closeGoalModal();
          loadGoals();
        });
      } else {
        callServer('goals.create', payload, function () {
          showToast('Nova meta criada com sucesso!', 'success');
          closeGoalModal();
          loadGoals();
        });
      }
    }

    function openContributeModal(goalId, nome, faltaCentavos) {
      var idEl = document.getElementById('contribute-goal-id');
      var valEl = document.getElementById('contribute-valor');
      var subEl = document.getElementById('modal-contribute-subtitle');
      var chkEl = document.getElementById('contribute-debitar-conta');
      var selEl = document.getElementById('contribute-conta-id');

      if (idEl) idEl.value = goalId;
      if (valEl) {
        valEl.value = '';
        valEl.focus();
      }
      if (subEl) {
        subEl.textContent = 'Meta: ' + nome + (faltaCentavos > 0 ? ' (Faltam ' + UIHelpers.formatBrl(faltaCentavos) + ')' : '');
      }
      if (chkEl) chkEl.checked = false;
      toggleContributeAccountSelect();

      // Popular contas bancárias disponíveis
      if (selEl) {

      var valor = parseFloat(document.getElementById('contribute-valor').value || '0');
      var debitar = document.getElementById('contribute-debitar-conta').checked;
      var contaId = debitar ? document.getElementById('contribute-conta-id').value : null;

      var catEl = document.getElementById('goal-categoria');

    function switchReportTab(tabId) {

        var sec = document.getElementById('section-rep-' + t);

    function loadReports() {
      var selPeriodo = document.getElementById('rep-filtro-periodo');
      var periodoTipo = selPeriodo ? selPeriodo.value : 'MES_ATUAL';
      var inpIni = document.getElementById('rep-filtro-inicio');
      var inpFim = document.getElementById('rep-filtro-fim');
      var selConta = document.getElementById('rep-filtro-conta');
      var selCat = document.getElementById('rep-filtro-categoria');

      // Popula select de contas bancárias se vazio
      if (selConta && selConta.options.length <= 1 && state.bankAccounts) {
        state.bankAccounts.forEach(function (acc) {
          var opt = document.createElement('option');
          opt.value = acc.id;
          opt.textContent = acc.instituicao + ' - ' + acc.nome_identificacao;
          selConta.appendChild(opt);
        });
      }

      // Popula select de categorias se vazio
      if (selCat && selCat.options.length <= 1 && state.categories) {
        state.categories.forEach(function (cat) {
          var opt = document.createElement('option');
          opt.value = cat.id;
          opt.textContent = (cat.tipo === 'ENTRADA' ? '↑ ' : '↓ ') + cat.nome;
          selCat.appendChild(opt);
        });
      }

      var payload = {
        periodo_tipo: periodoTipo,
        data_inicio: inpIni ? inpIni.value : '',
        data_fim: inpFim ? inpFim.value : '',
        conta_bancaria_id: selConta ? selConta.value : '',
        categoria_id: selCat ? selCat.value : ''
      };

      callServer('reports.getComprehensiveReport', payload, function (res) {
        var r = res.data || {};
        state.comprehensiveReport = r;
        var ex = r.resumo_executivo || {};

        // 1. Atualizar KPIs do Cabeçalho
        var elRec = document.getElementById('rep-kpi-receitas');
        var elDesp = document.getElementById('rep-kpi-despesas');
        var elRes = document.getElementById('rep-kpi-resultado');
        var elBadgeRes = document.getElementById('rep-kpi-resultado-badge');
        var elPoup = document.getElementById('rep-kpi-taxa-poupanca');
        var elCompDesc = document.getElementById('rep-kpi-comprometimento-desc');
        var elPatr = document.getElementById('rep-kpi-patrimonio');

        if (elRec) elRec.textContent = '+' + UIHelpers.formatBrl(ex.receitas_confirmadas_centavos || 0);
        if (elDesp) elDesp.textContent = '-' + UIHelpers.formatBrl(ex.despesas_confirmadas_centavos || 0);
        if (elRes) {

          elRes.textContent = (resVal >= 0 ? '+' : '') + UIHelpers.formatBrl(resVal);
          elRes.className = 'summary-value ' + (resVal >= 0 ? 'money-positive' : 'money-negative');
        }
        if (elBadgeRes) {
          var isSuperavit = (ex.resultado_realizado_centavos || 0) >= 0;
          elBadgeRes.textContent = isSuperavit ? 'Superávit' : 'Déficit';
          elBadgeRes.className = 'badge ' + (isSuperavit ? 'badge-confirmado' : 'badge-cancelado');
        }
        if (elPoup) elPoup.textContent = ((ex.taxa_poupanca_bps || 0) / 100).toFixed(1) + '%';
        if (elCompDesc) elCompDesc.textContent = 'Comprometimento: ' + ((ex.comprometimento_renda_bps || 0) / 100).toFixed(1) + '%';
        if (elPatr) elPatr.textContent = UIHelpers.formatBrl(ex.patrimonio_liquido_estimado_centavos || 0);

        // Subtítulo do DRE
        var dreSub = document.getElementById('rep-dre-subtitle');
        if (dreSub) dreSub.textContent = 'Competência: ' + (r.periodo ? r.periodo.rotulo : 'Período Selecionado');

        // 2. Renderizar DRE Pessoal Gerencial
        var elDre = document.getElementById('rep-dre-container');
        if (elDre) {
          var saldoOp = ex.resultado_realizado_centavos || 0;
          var saldoProj = ex.resultado_projetado_centavos || 0;
          elDre.innerHTML =
            '<table class="data-table"><tbody>' +

              '<tr><td>(-) Despesas Operacionais Pagas</td><td class="col-money money-negative">-' + UIHelpers.formatBrl(ex.despesas_confirmadas_centavos || 0) + '</td></tr>' +
              '<tr style="border-top:1px solid var(--border-color); font-weight:700;"><td>(=) Resultado Líquido Realizado</td><td class="col-money ' + (saldoOp >= 0 ? 'money-positive' : 'money-negative') + '">' + (saldoOp >= 0 ? '+' : '') + UIHelpers.formatBrl(saldoOp) + '</td></tr>' +
              '<tr><td>(+) Receitas Futuras / Previstas</td><td class="col-money money-positive">+' + UIHelpers.formatBrl(ex.receitas_previstas_centavos || 0) + '</td></tr>' +
              '<tr><td>(-) Despesas e Parcelas Previstas</td><td class="col-money money-negative">-' + UIHelpers.formatBrl(ex.despesas_previstas_centavos || 0) + '</td></tr>' +
              '<tr style="border-top:1px solid var(--border-color); font-weight:700;"><td>(=) Resultado Projetado Total</td><td class="col-money ' + (saldoProj >= 0 ? 'money-positive' : 'money-negative') + '">' + (saldoProj >= 0 ? '+' : '') + UIHelpers.formatBrl(saldoProj) + '</td></tr>' +
            '</tbody></table>';

        // 3. Renderizar Evolução Histórica (6 Meses)
        var elEvol = document.getElementById('rep-evolucao-container');
        if (elEvol) {

          var hRows = hList.map(function (hm) {

            return (
              '<tr>' +
              '<td><strong>' + UIHelpers.escapeHtml(hm.nome_mes) + '</strong></td>' +
              '<td class="col-money money-positive">+' + UIHelpers.formatBrl(hm.receitas_centavos) + '</td>' +
              '<td class="col-money money-negative">-' + UIHelpers.formatBrl(hm.despesas_centavos) + '</td>' +
              '<td class="col-money ' + (rM >= 0 ? 'money-positive' : 'money-negative') + '"><strong>' + (rM >= 0 ? '+' : '') + UIHelpers.formatBrl(rM) + '</strong></td>' +
              '</tr>'
            );
          }).join('');
          elEvol.innerHTML =
            '<table class="data-table"><thead><tr><th>Mês</th><th class="col-money">Receitas</th><th class="col-money">Despesas</th><th class="col-money">Resultado</th></tr></thead><tbody>' + (hRows || '<tr><td colspan="4" style="text-align:center;">Sem dados históricos</td></tr>') + '</tbody></table>';
        }

        // 4. Renderizar Distribuição das Despesas por Categoria
        var elDistDesp = document.getElementById('rep-dist-despesas-container');
        if (elDistDesp) {
          var dist = (r.despesas_analise && r.despesas_analise.distribuicao_por_categoria) || [];
          if (dist.length === 0) {
            elDistDesp.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:1.5rem 0;">Nenhuma despesa registrada no período.</p>';

                    '<div style="width:' + Math.min(100, Math.max(2, pcent)) + '%; height:100%; background:var(--danger); border-radius:3px;"></div>' +
                  '</div>' +

          } else {
            var topRows = topList.map(function (it, idx) {
              return (
                '<tr>' +
                '<td><span class="badge" style="background:var(--bg-hover);">' + (idx + 1) + 'º</span></td>' +
                '<td>' + UIHelpers.formatDateBr(it.data) + '</td>' +
                '<td><strong>' + UIHelpers.escapeHtml(it.descricao) + '</strong></td>' +
                '<td>' + UIHelpers.escapeHtml(it.categoria) + '</td>' +
                '<td class="col-money money-negative">-' + UIHelpers.formatBrl(it.valor_centavos) + '</td>' +
                '</tr>'
              );
            }).join('');
            elTopDesp.innerHTML =
              '<table class="data-table"><thead><tr><th>#</th><th>Data</th><th>Descrição</th><th>Categoria</th><th class="col-money">Valor</th></tr></thead><tbody>' + topRows + '</tbody></table>';

              var badgeStatus = c.alerta_estourado
                ? '<span class="badge badge-cancelado">Estourado</span>'

              return (
                '<tr>' +
                '<td>' + UIHelpers.escapeHtml(c.categoria_nome) + '</td>' +
                '<td class="col-money">' + UIHelpers.formatBrl(c.orcamento_centavos) + '</td>' +

                '<td class="col-money">' + UIHelpers.formatBrl(c.previsto_centavos) + '</td>' +
                '<td class="col-money ' + (saldoOrc < 0 ? 'money-negative' : 'money-positive') + '">' + UIHelpers.formatBrl(saldoOrc) + '</td>' +
                '<td>' + badgeStatus + '</td>' +

            elOrc.innerHTML =

    function exportCsv() {
      var payload = collectLaunchFilterPayload(1);
      callServer('launches.exportCsv', payload, function (res) {
        // Adiciona UTF-8 BOM (\uFEFF) para que o Microsoft Excel no Windows abra com acentuação perfeita
        var contentWithBom = '\uFEFF' + res.data.csvContent;
        var blob = new Blob([contentWithBom], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = res.data.filename || 'lancamentos.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('Arquivo CSV exportado com acentuação corrigida (' + res.data.totalRecords + ' registros).', 'success');
      });
    }

    function switchOracleTab(tabName) {
      var btns = document.querySelectorAll('.oracle-tab-btn');
      for (var i = 0; i < btns.length; i++) {
        var b = btns[i];
        if (b.getAttribute('data-tab') === tabName) {
          b.classList.remove('btn-secondary');
          b.classList.add('btn-primary');
        } else {
          b.classList.remove('btn-primary');
          b.classList.add('btn-secondary');
        }
      }
      var subtabs = document.querySelectorAll('.oracle-subtab-content');
      for (var j = 0; j < subtabs.length; j++) {
        subtabs[j].style.display = 'none';
      }
      var target = document.getElementById('oracle-subtab-' + tabName);
      if (target) target.style.display = 'block';

      var secOraculo = document.getElementById('sec-oraculo');
      if (secOraculo && window.UIHelpers && typeof window.UIHelpers.initInfoPopovers === 'function') {
        window.UIHelpers.initInfoPopovers(secOraculo);
      }
    }

    function onSimulationTypeChange() {
      var tipo = document.getElementById('sim-tipo').value;
      var grpCat = document.getElementById('sim-group-categoria');
      var grpPct = document.getElementById('sim-group-percentual');
      var grpVal = document.getElementById('sim-group-valor');

      if (tipo === 'CORTE_DESPESA') {
        if (grpCat) grpCat.style.display = 'block';
        if (grpPct) grpPct.style.display = 'block';
        if (grpVal) grpVal.style.display = 'none';
      } else if (tipo === 'AMORTIZACAO_DIVIDA') {
        if (grpCat) grpCat.style.display = 'none';
        if (grpPct) grpPct.style.display = 'none';
        if (grpVal) {
          grpVal.style.display = 'block';
          grpVal.querySelector('label').textContent = 'Valor da Parcela Mensal Eliminada (R$):';
        }
      } else if (tipo === 'RENDA_EXTRA') {
        if (grpCat) grpCat.style.display = 'none';
        if (grpPct) grpPct.style.display = 'none';
        if (grpVal) {
          grpVal.style.display = 'block';
          grpVal.querySelector('label').textContent = 'Valor da Renda Extra Mensal (R$):';
        }
      }
    }

    function submitOracleSimulation(ev) {
      if (ev && ev.preventDefault) ev.preventDefault();
      var tipo = document.getElementById('sim-tipo').value;
      var catId = document.getElementById('sim-categoria').value;
      var pct = parseInt(document.getElementById('sim-percentual').value, 10) || 15;
      var valCentavos = UIHelpers.parseBrlToCentavos(document.getElementById('sim-valor').value);

      var payload = {
        tipo_simulacao: tipo,
        percentual_corte: pct,
        categoria_id: catId
      };
      if (tipo === 'AMORTIZACAO_DIVIDA') {
        payload.parcela_mensal_eliminada_centavos = valCentavos;
      } else if (tipo === 'RENDA_EXTRA') {
        payload.valor_renda_extra_centavos = valCentavos;
      }

      callServer('oracle.simulateScenario', payload, function (res) {
        var s = res.data;
        var rCard = document.getElementById('sim-result-card');
        if (rCard) rCard.style.display = 'block';

        var rMen = document.getElementById('sim-res-mensal');
        if (rMen) rMen.textContent = (s.cenario_simulado.impacto_mensal_centavos >= 0 ? '+ ' : '- ') + UIHelpers.formatBrl(Math.abs(s.cenario_simulado.impacto_mensal_centavos));

        var rAnual = document.getElementById('sim-res-anual');
        if (rAnual) rAnual.textContent = (s.cenario_simulado.impacto_anual_centavos >= 0 ? '+ ' : '- ') + UIHelpers.formatBrl(Math.abs(s.cenario_simulado.impacto_anual_centavos));

        var rSaude = document.getElementById('sim-res-saude');
        if (rSaude) rSaude.textContent = s.cenario_simulado.score_saude_estimado + ' / 100';

        var rPar = document.getElementById('sim-res-parecer');
        if (rPar) rPar.textContent = s.parecer_tecnico;

        showToast('Cenário hipotético calculado com sucesso!', 'success');
      });
    }

                    '<div>Receitas: <strong>' + UIHelpers.formatBrl(rm.receitas_confirmadas_centavos) + '</strong></div>' +

    function clearOracleChat() {
      state.oracleChatHistory = [];
      renderOracleChat();
      showToast('Conversa limpa com sucesso.', 'info');
    }

    function copyOracleText(msgId) {
      var item = (state.oracleChatHistory || []).find(function (m) { return m.id === msgId; });
      if (!item || !item.text) return;
      if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(item.text).then(function () {
          showToast('Resposta copiada para a área de transferência!', 'success');
        });
      } else {
        showToast('Texto copiado!', 'info');
      }
    }

      if (qInput) qInput.value = qText;
      switchOracleTab('consultor');
      submitOracleQuestion({ preventDefault: function () {} });
    }

    function submitOracleQuestion(ev) {
      if (ev && ev.preventDefault) ev.preventDefault();
      var qInput = document.getElementById('oracle-question');
      var q = qInput ? qInput.value : '';
      if (!q || !q.trim()) return;

      var now = new Date();
      var timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

      if (!state.oracleChatHistory) state.oracleChatHistory = [];

      var userMsgId = 'msg-' + Date.now();
      state.oracleChatHistory.push({
        id: userMsgId,
        sender: 'user',
        text: q.trim(),
        timestamp: timeStr
      });

      if (qInput) qInput.value = '';
      renderOracleChat();

      var btn = document.getElementById('btn-oracle-submit');
      var indicator = document.getElementById('oracle-typing-indicator');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Consultando...</span>';
      }
      if (indicator) indicator.style.display = 'flex';

      var fCont = document.getElementById('oracle-facts-container');
      if (fCont) fCont.innerHTML = '<p style="color:var(--text-muted);">Calculando fatos no servidor...</p>';
      var rCont = document.getElementById('oracle-recommendation-container');
      if (rCont) rCont.innerHTML = '<p style="color:var(--text-muted);">Consultando inteligência analítica do Oráculo...</p>';

      callServer('oracle.ask', { pergunta: q }, function (res) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<span>Consultar</span><span>🚀</span>';
        }
        if (indicator) indicator.style.display = 'none';

        var d = res.data;
        var aiText = d.recomendacao_ia || 'Não foi possível obter resposta no momento.';
        var model = d.provedor_modelo || 'Oráculo IA';

        var oracleMsgId = 'msg-ai-' + Date.now();
        state.oracleChatHistory.push({
          id: oracleMsgId,
          sender: 'oracle',
          text: aiText,
          rawData: d,
          model: model,
          timestamp: String(new Date().getHours()).padStart(2, '0') + ':' + String(new Date().getMinutes()).padStart(2, '0')
        });

        renderOracleChat();

        if (fCont && d.fatos_calculados && d.fatos_calculados.resumo_mensal) {
          var rm = d.fatos_calculados.resumo_mensal;
          fCont.innerHTML =
            '<p><strong>Período analisado:</strong> ' + UIHelpers.escapeHtml(d.periodo_analisado) + '</p>' +
            '<table class="data-table"><tbody>' +
            '<tr><td>Saldo Bancário Confirmado</td><td class="col-money">' + UIHelpers.formatBrl(rm.saldo_bancario_confirmado_centavos) + '</td></tr>' +
            '<tr><td>Receitas Confirmadas Mês</td><td class="col-money">' + UIHelpers.formatBrl(rm.receitas_confirmadas_centavos) + '</td></tr>' +
            '<tr><td>Despesas Confirmadas Mês</td><td class="col-money">' + UIHelpers.formatBrl(rm.despesas_confirmadas_centavos) + '</td></tr>' +
            '<tr><td>Despesas Previstas / Pendentes</td><td class="col-money">' + UIHelpers.formatBrl(rm.despesas_previstas_e_pendentes_centavos) + '</td></tr>' +
            '<tr><td>Saldo Projetado Fim do Mês</td><td class="col-money">' + UIHelpers.formatBrl(rm.saldo_projetado_fim_mes_centavos) + '</td></tr>' +

        }

        if (rCont) {

        }
      });
    }

    function switchSettingsTab(tabName) {
      var btns = document.querySelectorAll('.settings-subtab-btn');
      for (var i = 0; i < btns.length; i++) {
        var b = btns[i];
        if (b.getAttribute('data-stab') === tabName) {
          b.classList.remove('btn-secondary');
          b.classList.add('btn-primary');
        } else {
          b.classList.remove('btn-primary');
          b.classList.add('btn-secondary');
        }
      }
      var subtabs = document.querySelectorAll('.settings-subtab-content');
      for (var j = 0; j < subtabs.length; j++) {
        subtabs[j].style.display = 'none';
      }
      var target = document.getElementById('settings-subtab-' + tabName);
      if (target) target.style.display = 'block';

      if (tabName === 'usuarios') loadAdminUsers();
      else if (tabName === 'auditoria') loadAuditLogs();
      else if (tabName === 'categorias') renderCategoriesTable();
      else if (tabName === 'integracoes') renderTelegramStatus();
      else if (tabName === 'financeiro') loadFinancialParameters();
      else if (tabName === 'notificacoes') loadNotificationPreferences();
      else if (tabName === 'seguranca') loadOperationalSecurityDashboard();
      else if (tabName === 'diagnostico') loadPerformanceMetrics();
    }

    function renderCategoriesTable() {

        container.innerHTML = '<p style="color:var(--text-muted); padding:0.5rem 0;">Nenhuma categoria cadastrada.</p>';
        return;
      }
      var rows = state.categories.map(function (cat) {
        var subBadges = (cat.subcategorias || []).map(function (s) {
          return '<span class="badge" style="background:var(--bg-elevated); border:1px solid var(--border-color); color:var(--text-primary); margin:0.15rem 0.25rem 0.15rem 0; font-size:0.75rem;">' + UIHelpers.escapeHtml(s.nome) + '</span>';

        if (!subBadges) {
          subBadges = '<span style="color:var(--text-muted); font-size:0.75rem;">Nenhuma subcategoria vinculada</span>';
        }

          '<td>' + tipoLabel + '</td>' +

    var rawAdminUsersList = [];

      var p = String(papel || '').toUpperCase();

        return '<span class="badge-role-owner">👑 OWNER</span>';
      } else if (p === 'ADMIN') {
        return '<span class="badge-role-admin">🛡️ ADMIN</span>';

        return '<span class="badge-role-user">👤 USUÁRIO</span>';
      }

      var container = document.getElementById('admin-users-container');
      if (!container) return;

        return;

      var alertBanner = '';

          '<div style="color:var(--text-primary); font-size:0.9rem;">' +

            'Novos usuários cadastrados só conseguem visualizar a planilha após sua aprovação formal.' +
          '</div>' +
        '</div>';

      var rows = users.map(function (u) {
        var isOwner = u.papel === 'OWNER';
