          '<th>Categoria</th>' +
          '<th class="col-center">Conta Padrão <span class="info-popover-wrap" data-info-key="rec-col-conta"></span></th>' +
          '<th class="col-money">Valor Previsto</th>' +
          '<th class="col-center">Situação no Mês <span class="info-popover-wrap" data-info-key="rec-col-situacao"></span></th>' +

        container.innerHTML = rows
          ? '<table class="data-table">' + tableHeader + '<tbody>' + rows + '</tbody></table>'

      }

      UIHelpers.initInfoPopovers(document.getElementById('sec-recurring'));
      loadSubscriptionsInsights();

    function loadRecurringAccounts(forceRefresh) {
      var compEl = document.getElementById('rec-competencia-input');
      var comp = (compEl && compEl.value) ? compEl.value : new Date().toISOString().substring(0, 7);
      if (compEl && !compEl.value) compEl.value = comp;

      if (state.recurringAccounts && state.recurringAccounts.length >= 0 && !forceRefresh) {
        renderRecurringAccountsView(state.recurringAccounts);
        callServer('recurring.list', { competencia: comp }, function (res) {
          state.recurringAccounts = res.data || [];
          renderRecurringAccountsView(state.recurringAccounts);
        }, { quiet: true });
        return;
      }

      callServer('recurring.list', { competencia: comp }, function (res) {
        state.recurringAccounts = res.data || [];
        renderRecurringAccountsView(state.recurringAccounts);
      });
    }

    function openEditRecurringModal(recId) {
      var rule = null;
      for (var i = 0; i < (state.recurringAccounts || []).length; i++) {
        if (state.recurringAccounts[i].id === recId) {
          rule = state.recurringAccounts[i];
          break;
        }
      }
      if (!rule) {
        showToast('Regra recorrente não encontrada.', 'error');
        return;
      }

      state.currentEditRecurringId = recId;
      document.getElementById('rec-edit-id').value = rule.id;
      document.getElementById('rec-edit-nome').value = rule.nome || '';
      var abs = Math.abs(Number(rule.valor_previsto_centavos || 0));
      document.getElementById('rec-edit-valor').value = abs > 0 ? UIHelpers.formatCentavosToBrlInput(abs) : '';
      document.getElementById('rec-edit-dia').value = rule.dia_vencimento || 10;
      document.getElementById('rec-edit-natureza').value = rule.natureza || 'FIXA';
      document.getElementById('rec-edit-recorrencia').value = rule.recorrencia || 'MENSAL';
      document.getElementById('rec-edit-forma').value = rule.forma_pagamento || 'BOLETO';
      var editInicioEl = document.getElementById('rec-edit-inicio');
      if (editInicioEl) editInicioEl.value = rule.data_inicio || '';
      document.getElementById('rec-edit-termino').value = rule.data_termino || '';
      var editParcEl = document.getElementById('rec-edit-parcelas');
      if (editParcEl) {
        if (rule.data_inicio && rule.data_termino) {
          var count = calculateInstallmentsCount(rule.data_inicio, rule.data_termino, rule.recorrencia || 'MENSAL');
          editParcEl.value = count > 0 ? count : '';
        } else {
          editParcEl.value = '';
        }
      }
      if (typeof UIHelpers !== 'undefined' && UIHelpers.attachCurrencyMasks) {
        UIHelpers.attachCurrencyMasks();
      }

      var catSelect = document.getElementById('rec-edit-categoria');
      if (catSelect && state.categories) {
        catSelect.innerHTML = state.categories.map(function (c) {
          return '<option value="' + UIHelpers.escapeHtml(c.id) + '">' + UIHelpers.escapeHtml(c.nome) + ' (' + c.tipo + ')</option>';
        }).join('');
        catSelect.value = rule.categoria_id || '';
      }

      var accSelect = document.getElementById('rec-edit-conta');
      if (accSelect && state.bankAccounts) {
        accSelect.innerHTML = '<option value="">Nenhuma / Definir depois</option>' + state.bankAccounts.map(function (a) {
          return '<option value="' + UIHelpers.escapeHtml(a.id) + '">' + UIHelpers.escapeHtml(a.nome_identificacao) + ' - ' + UIHelpers.escapeHtml(a.instituicao) + '</option>';
        }).join('');
        accSelect.value = rule.conta_bancaria_padrao_id || '';
      }

      var modal = document.getElementById('modal-edit-recurring-backdrop');
      if (modal) modal.classList.add('open');
    }

    function closeEditRecurringModal() {
      var modal = document.getElementById('modal-edit-recurring-backdrop');
      if (modal) modal.classList.remove('open');
      state.currentEditRecurringId = null;
    }

    function submitEditRecurringAccount(ev) {
      ev.preventDefault();
      var recId = document.getElementById('rec-edit-id').value || state.currentEditRecurringId;
      if (!recId) return;

      var valorCentavos = UIHelpers.parseInputToCentavos(document.getElementById('rec-edit-valor').value);
      var payload = {
        id: recId,
        nome: document.getElementById('rec-edit-nome').value,
        valor_previsto_centavos: valorCentavos,
        dia_vencimento: parseInt(document.getElementById('rec-edit-dia').value, 10),
        natureza: document.getElementById('rec-edit-natureza').value,
        recorrencia: document.getElementById('rec-edit-recorrencia').value,
        categoria_id: document.getElementById('rec-edit-categoria').value,
        conta_bancaria_padrao_id: document.getElementById('rec-edit-conta').value,
        forma_pagamento: document.getElementById('rec-edit-forma').value,
        data_inicio: document.getElementById('rec-edit-inicio') ? document.getElementById('rec-edit-inicio').value : undefined,
        data_termino: document.getElementById('rec-edit-termino').value,
        aplicar_ocorrencias_futuras: document.getElementById('rec-edit-apply-future').checked
      };

      callServer('recurring.update', payload, function () {
        showToast('Regra recorrente atualizada com sucesso!', 'success');
        closeEditRecurringModal();
        loadRecurringAccounts();
        loadDashboard();
      }, function (err) {
        showToast('Erro ao atualizar regra: ' + (err && err.message ? err.message : err), 'error');
      });
    }

    function onBankInstitutionInput(val) {
      var container = document.getElementById('bank-badge-preview-container');
      if (!container) return;
      if (!val || !val.trim()) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = UIHelpers.getBankBadgeHtml(val);
    }

    function onCardBrandChange(val) {
      var container = document.getElementById('card-brand-preview-container');
      if (!container) return;
      if (!val || !val.trim()) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = UIHelpers.getCardBrandBadgeHtml(val);
    }

    function submitBankAccount(ev) {
      ev.preventDefault();
      var obs = (document.getElementById('bank-obs').value || '').trim();
      var bandeira = document.getElementById('bank-bandeira') ? document.getElementById('bank-bandeira').value : '';
      if (bandeira) {
        obs = obs ? (obs + ' | Bandeira: ' + bandeira) : ('Bandeira: ' + bandeira);
      }
      var propEl = document.getElementById('bank-proprietario');
      var proprietarioId = propEl ? propEl.value : '';

      var payload = {
        instituicao: document.getElementById('bank-instituicao').value,
        nome_identificacao: document.getElementById('bank-nome').value,
        tipo_conta: document.getElementById('bank-tipo').value,
        proprietario_id: proprietarioId,
        saldo_inicial_centavos: UIHelpers.parseInputToCentavos(document.getElementById('bank-saldo-inicial').value),
        data_saldo_inicial: document.getElementById('bank-data-inicial').value,
        observacoes: obs
      };
      callServer('bankAccounts.create', payload, function () {
        showToast('Conta bancária cadastrada com sucesso!', 'success');
        document.getElementById('bank-instituicao').value = '';
        document.getElementById('bank-nome').value = '';
        var sIni = document.getElementById('bank-saldo-inicial');
        if (sIni) sIni.value = 'R$ 0,00';
        if (document.getElementById('bank-bandeira')) document.getElementById('bank-bandeira').value = '';
        if (document.getElementById('bank-obs')) document.getElementById('bank-obs').value = '';
        var bPrev = document.getElementById('bank-badge-preview-container');
        if (bPrev) bPrev.innerHTML = '';
        var cPrev = document.getElementById('card-brand-preview-container');
        if (cPrev) cPrev.innerHTML = '';
        toggleNewBankAccountCard(false);
        loadBankAccounts();
        loadDashboard();
      });
    }

    function submitOwnTransfer(ev) {
      ev.preventDefault();
      var payload = {
        conta_origem_id: document.getElementById('trf-origem').value,
        conta_destino_id: document.getElementById('trf-destino').value,
        valor_centavos: UIHelpers.parseInputToCentavos(document.getElementById('trf-valor').value),
        data_lancamento: document.getElementById('trf-data').value,
        descricao: document.getElementById('trf-desc').value
      };
      callServer('bankAccounts.transfer', payload, function () {
        showToast('Transferência entre contas próprias registrada sem duplicar receitas/despesas!', 'success');
        document.getElementById('trf-valor').value = '';
        toggleNewTransferCard(false);
        loadBankAccounts();
        loadDashboard();
      });
    }

    function toggleNewBankAccountCard(forceOpen) {
      var card = document.getElementById('card-new-bank-account');
      if (!card) return;
      var isCurrentlyOpen = card.style.display !== 'none';
      var shouldOpen = forceOpen !== undefined ? forceOpen : !isCurrentlyOpen;
      card.style.display = shouldOpen ? 'block' : 'none';
      var btnIcon = document.getElementById('icon-toggle-new-bank');
      if (btnIcon) btnIcon.textContent = shouldOpen ? '✕' : '+';
      if (shouldOpen) {
        var trfCard = document.getElementById('card-new-transfer');
        if (trfCard) trfCard.style.display = 'none';
        var saldoEl = document.getElementById('bank-saldo-inicial');
        if (saldoEl && !saldoEl.value) {
          saldoEl.value = 'R$ 0,00';
        }
        if (typeof UIHelpers !== 'undefined' && UIHelpers.attachCurrencyMasks) {
          UIHelpers.attachCurrencyMasks();
        }
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function toggleNewTransferCard(forceOpen) {
      var card = document.getElementById('card-new-transfer');
      if (!card) return;
      var isCurrentlyOpen = card.style.display !== 'none';
      var shouldOpen = forceOpen !== undefined ? forceOpen : !isCurrentlyOpen;
      card.style.display = shouldOpen ? 'block' : 'none';
      if (shouldOpen) {
        var bankCard = document.getElementById('card-new-bank-account');
        if (bankCard) bankCard.style.display = 'none';
        var btnIcon = document.getElementById('icon-toggle-new-bank');
        if (btnIcon) btnIcon.textContent = '+';
        if (typeof UIHelpers !== 'undefined' && UIHelpers.attachCurrencyMasks) {
          UIHelpers.attachCurrencyMasks();
        }
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function populateBankOwnerSelects() {
      var members = state.groupMembers || [];
      var currentUserId = (state.user && state.user.id) ? String(state.user.id) : '';
      var options = members.map(function (u) {
        var isCurrent = currentUserId && (String(u.id) === currentUserId);
        var label = UIHelpers.escapeHtml(u.nome || u.email);
        if (isCurrent) label += ' (Você)';
        return '<option value="' + UIHelpers.escapeHtml(u.id) + '">' + label + '</option>';
      }).join('');

      var selNew = document.getElementById('bank-proprietario');
      if (selNew) {
        var prevVal = selNew.value;
        selNew.innerHTML = options || '<option value="">(Nenhum usuário no grupo)</option>';
        if (prevVal) {
          selNew.value = prevVal;
        } else if (currentUserId) {
          selNew.value = currentUserId;
        }
      }

      var selEdit = document.getElementById('edit-bank-proprietario');
      if (selEdit) {
        var prevEditVal = selEdit.value;
        selEdit.innerHTML = '<option value="">Sem titular específico</option>' + (options || '');
        if (prevEditVal) {
          selEdit.value = prevEditVal;
        }
      }
    }

    function updateBankAccountsKpis() {
      var totalConfirmado = 0;
      var totalProjetado = 0;
      var totalPrevisto = 0;
      var ativasCount = 0;

      (state.bankAccounts || []).forEach(function (b) {
        if (b.situacao === 'ATIVA') {
          totalConfirmado += Number(b.saldo_confirmado_centavos || 0);
          totalProjetado += Number(b.saldo_projetado_centavos || 0);
          totalPrevisto += Number(b.saldo_previsto_centavos || 0);
          ativasCount++;
        }
      });

      var elConf = document.getElementById('banks-kpi-confirmado');
      if (elConf) {
        elConf.textContent = UIHelpers.formatBrl(totalConfirmado);
        elConf.className = 'summary-value ' + (totalConfirmado >= 0 ? 'summary-val-entrada' : 'summary-val-saida');
      }
      var elPrev = document.getElementById('banks-kpi-previsto');
      if (elPrev) {
        elPrev.textContent = (totalPrevisto > 0 ? '+' : '') + UIHelpers.formatBrl(totalPrevisto);
        elPrev.className = 'summary-value ' + (totalPrevisto >= 0 ? 'summary-val-entrada' : 'summary-val-saida');
      }
      var elProj = document.getElementById('banks-kpi-projetado');
      if (elProj) {
        elProj.textContent = UIHelpers.formatBrl(totalProjetado);
        elProj.className = 'summary-value ' + (totalProjetado >= 0 ? 'summary-val-entrada' : 'summary-val-saida');
      }
      var elAtiv = document.getElementById('banks-kpi-ativas');
      if (elAtiv) {
        elAtiv.textContent = ativasCount + ' ativa(s)';
      }
      var elTotDesc = document.getElementById('banks-kpi-total-desc');
      if (elTotDesc) {
        elTotDesc.textContent = 'De ' + (state.bankAccounts || []).length + ' conta(s) cadastrada(s)';
      }
    }

    function setBanksViewMode(mode) {
      state.banksViewMode = mode;
      try {
        localStorage.setItem('finpess_banks_view_mode', mode);
      } catch (e) {}
      renderBankAccountsView(state.bankAccounts || []);
    }

    function renderBankAccounts(accountsData) {
      if (Array.isArray(accountsData)) {
        state.bankAccounts = accountsData;
        updateBankAccountsKpis();
        renderBankAccountsView(state.bankAccounts);
      } else {
        loadBankAccounts();
      }
    }

    function loadBankAccounts(forceRefresh) {
      if (state.bankAccounts && state.bankAccounts.length >= 0 && !forceRefresh) {
        updateBankAccountsKpis();
        renderBankAccountsView(state.bankAccounts);
        callServer('bankAccounts.list', { includeInactive: true }, function (res) {
          state.bankAccounts = res.data || [];
          populateSelects();
          updateBankAccountsKpis();
          renderBankAccountsView(state.bankAccounts);
        }, { quiet: true });
        if (!state.groupMembers || state.groupMembers.length === 0) {
          callServer('users.listGroupMembers', {}, function (resMembers) {
            state.groupMembers = resMembers.data || [];
            populateBankOwnerSelects();
          }, { quiet: true });
        }
        return;
      }

      callServer('users.listGroupMembers', {}, function (resMembers) {
        state.groupMembers = resMembers.data || [];
        populateBankOwnerSelects();
      });

      callServer('bankAccounts.list', { includeInactive: true }, function (res) {
        state.bankAccounts = res.data || [];
        populateSelects();
        updateBankAccountsKpis();
        renderBankAccountsView(state.bankAccounts);
      });
    }

      if (!container) return;

      var curMode = state.banksViewMode || 'cards';
      var btnCards = document.getElementById('btn-bank-view-cards');
      var btnTable = document.getElementById('btn-bank-view-table');
      if (btnCards && btnTable) {
        if (curMode === 'cards') {
          btnCards.classList.add('active');
          btnTable.classList.remove('active');
        } else {
          btnTable.classList.add('active');

            cardBg: 'linear-gradient(135deg, #FF911A 0%, #FF7A00 50%, #D65A00 100%)'
          },
          'nubank': {
            color: '#820AD1',
            glow: 'rgba(130, 10, 209, 0.24)',
            cardBg: 'linear-gradient(135deg, #9C2AEB 0%, #820AD1 50%, #5E00A3 100%)'
          },

            color: '#005CA9',
            glow: 'rgba(0, 92, 169, 0.24)',
            cardBg: 'linear-gradient(135deg, #0A7CD4 0%, #005CA9 50%, #003F75 100%)'
          },
          'bradesco': {
            color: '#CC092F',
            glow: 'rgba(204, 9, 47, 0.24)',
            cardBg: 'linear-gradient(135deg, #F01844 0%, #CC092F 50%, #94001E 100%)'
          },
          'itau': {
            color: '#EC7000',
            glow: 'rgba(236, 112, 0, 0.24)',

    function openEditBankAccountModal(accId) {
      var acc = (state.bankAccounts || []).find(function (a) { return String(a.id) === String(accId); });
      if (!acc) {
        showToast('Conta bancária não encontrada.', 'error');
        return;
      }
      document.getElementById('edit-bank-id').value = acc.id;
      document.getElementById('edit-bank-nome').value = acc.nome_identificacao || '';
      document.getElementById('edit-bank-instituicao').value = acc.instituicao || '';
      document.getElementById('edit-bank-tipo').value = acc.tipo_conta || 'CORRENTE';
      
      var bandeira = '';
      var rawObs = acc.observacoes || '';
      if (rawObs.indexOf('Bandeira:') !== -1) {
        var m = rawObs.match(/Bandeira:\s*([^\n;|]+)/i);
        if (m && m[1]) {
          bandeira = m[1].trim();
          rawObs = rawObs.replace(/\|\s*Bandeira:\s*[^\n;|]+/i, '').replace(/Bandeira:\s*[^\n;|]+/i, '').trim();
        }
      }
      document.getElementById('edit-bank-bandeira').value = bandeira;
      document.getElementById('edit-bank-situacao').value = acc.situacao || 'ATIVA';
      document.getElementById('edit-bank-obs').value = rawObs;
      var propSelect = document.getElementById('edit-bank-proprietario');
      if (propSelect) {
        propSelect.value = acc.proprietario_id || '';
      }

      onEditBankInstitutionInput(acc.instituicao);
      onEditCardBrandChange(bandeira);

      var modal = document.getElementById('modal-edit-bank-account-backdrop');
      if (modal) modal.classList.add('open');
    }

    function closeEditBankAccountModal() {
      var modal = document.getElementById('modal-edit-bank-account-backdrop');
      if (modal) modal.classList.remove('open');
    }

    function onEditBankInstitutionInput(val) {
      var container = document.getElementById('edit-bank-badge-preview-container');
      if (!container) return;
      if (!val || !val.trim()) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = UIHelpers.getBankBadgeHtml(val);
    }

    function onEditCardBrandChange(val) {
      var container = document.getElementById('edit-card-brand-preview-container');
      if (!container) return;
      if (!val || !val.trim()) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = UIHelpers.getCardBrandBadgeHtml(val);
    }

    function submitEditBankAccount(ev) {
      ev.preventDefault();
      var id = document.getElementById('edit-bank-id').value;
      var nome = (document.getElementById('edit-bank-nome').value || '').trim();
      var instituicao = (document.getElementById('edit-bank-instituicao').value || '').trim();
      var tipo = document.getElementById('edit-bank-tipo').value;
      var bandeira = document.getElementById('edit-bank-bandeira').value;
      var situacao = document.getElementById('edit-bank-situacao').value;
      var obs = (document.getElementById('edit-bank-obs').value || '').trim();
      var propEl = document.getElementById('edit-bank-proprietario');
      var proprietarioId = propEl ? propEl.value : '';

      if (bandeira) {
        obs = obs ? (obs + ' | Bandeira: ' + bandeira) : ('Bandeira: ' + bandeira);
      }

      callServer('bankAccounts.update', {
        id: id,
        nome_identificacao: nome,
        instituicao: instituicao,
        tipo_conta: tipo,
        situacao: situacao,
        observacoes: obs,
        proprietario_id: proprietarioId
      }, function () {
        showToast('Conta bancária atualizada com sucesso!', 'success');
        closeEditBankAccountModal();
        loadBankAccounts();
        loadDashboard();
      });
    }

    function openReconcileAccountModal(accId) {
      var acc = (state.bankAccounts || []).find(function (a) { return String(a.id) === String(accId); });
      if (!acc) {
        showToast('Conta bancária não encontrada.', 'error');
        return;
      }
      document.getElementById('reconcile-bank-id').value = acc.id;
      document.getElementById('reconcile-account-name').textContent = acc.nome_identificacao + ' (' + acc.instituicao + ')';
      
      var saldoConfirmado = Number(acc.saldo_confirmado_centavos || 0);
      document.getElementById('reconcile-current-balance').textContent = UIHelpers.formatBrl(saldoConfirmado);
      
      var inputEl = document.getElementById('reconcile-new-balance');
      inputEl.value = (saldoConfirmado / 100).toFixed(2).replace('.', ',');
      
      document.getElementById('reconcile-create-adjustment').checked = true;
      updateReconcileDiff();

      var modal = document.getElementById('modal-reconcile-account-backdrop');
      if (modal) modal.classList.add('open');
    }

    function closeReconcileAccountModal() {
      var modal = document.getElementById('modal-reconcile-account-backdrop');
      if (modal) modal.classList.remove('open');
    }

    function updateReconcileDiff() {
      var accId = document.getElementById('reconcile-bank-id').value;
      var acc = (state.bankAccounts || []).find(function (a) { return String(a.id) === String(accId); });
      if (!acc) return;

      var currentConfirmado = Number(acc.saldo_confirmado_centavos || 0);
      var rawVal = (document.getElementById('reconcile-new-balance').value || '').trim();
      var parsedCentavos = UIHelpers.parseInputToCentavos(rawVal);
      var diff = parsedCentavos - currentConfirmado;

      var diffVal = document.getElementById('reconcile-diff-value');
      var diffAction = document.getElementById('reconcile-diff-action');
      if (!diffVal || !diffAction) return;

      if (diff === 0) {
        diffVal.textContent = 'R$ 0,00 (Saldos coincidem)';
        diffVal.style.color = 'var(--text-secondary)';
        diffAction.textContent = 'Nenhum lançamento de ajuste será gerado.';
      } else if (diff > 0) {
        diffVal.textContent = '+' + UIHelpers.formatBrl(diff);
        diffVal.style.color = 'var(--success)';
        diffAction.textContent = 'Será gerado um lançamento de Entrada (Ajuste Positivo de Saldo).';
      } else {
        diffVal.textContent = UIHelpers.formatBrl(diff);
        diffVal.style.color = 'var(--danger)';
        diffAction.textContent = 'Será gerado um lançamento de Saída (Ajuste Negativo de Saldo).';
      }
    }

    function submitReconcileAccount(ev) {
      ev.preventDefault();
      var accId = document.getElementById('reconcile-bank-id').value;
      var rawVal = (document.getElementById('reconcile-new-balance').value || '').trim();
      var centavos = UIHelpers.parseInputToCentavos(rawVal);
      var gerarAjuste = document.getElementById('reconcile-create-adjustment').checked;

      callServer('bankAccounts.reconcile', {
        conta_bancaria_id: accId,
        saldo_informado_centavos: centavos,
        gerar_ajuste: gerarAjuste
      }, function (res) {
        var diff = res.data ? res.data.diferenca_centavos : 0;
        if (diff === 0) {
          showToast('Conta conciliada: Saldo já estava em conformidade.', 'success');
        } else if (gerarAjuste) {
          showToast('Conta conciliada! Lançamento de ajuste gerado no valor de ' + UIHelpers.formatBrl(Math.abs(diff)), 'success');
        } else {
          showToast('Conta conciliada sem gerar lançamento de ajuste.', 'info');
        }
        closeReconcileAccountModal();
        loadBankAccounts();
        if (gerarAjuste) {
          loadLaunches(1);
        }
        loadDashboard();
      });
    }

    function toggleAccountStatus(accId) {
      var acc = (state.bankAccounts || []).find(function (a) { return String(a.id) === String(accId); });
      if (!acc) return;
      var newStatus = acc.situacao === 'ATIVA' ? 'INATIVA' : 'ATIVA';
      var msg = newStatus === 'INATIVA'
        ? 'Deseja inativar a conta "' + acc.nome_identificacao + '"? Ela deixará de aparecer como opção para novos lançamentos.'
        : 'Deseja reativar a conta "' + acc.nome_identificacao + '"?';
      
      if (!confirm(msg)) return;

      callServer('bankAccounts.update', { id: acc.id, situacao: newStatus }, function () {
        showToast('Situação da conta alterada para ' + newStatus + '!', 'success');
        loadBankAccounts();
      });
    }

    function viewBankStatement(accountId, startDate, endDate) {
      if (!accountId) return;
      var currentIdEl = document.getElementById('statement-current-account-id');
      if (currentIdEl) currentIdEl.value = accountId;

      var sIni = startDate !== undefined ? startDate : (document.getElementById('statement-filter-inicio') ? document.getElementById('statement-filter-inicio').value : '');
      var sFim = endDate !== undefined ? endDate : (document.getElementById('statement-filter-fim') ? document.getElementById('statement-filter-fim').value : '');

      callServer('bankAccounts.statement', { conta_bancaria_id: accountId, data_inicio: sIni, data_fim: sFim }, function (res) {
        var st = res.data;
        state.currentStatementData = st;
        var card = document.getElementById('bank-statement-card');
        if (!card) return;
        card.style.display = 'block';
        setTimeout(function () {
          card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);

        // Atualiza cabeçalho do extrato
        var titleEl = document.getElementById('bank-statement-title');
        if (titleEl) titleEl.textContent = 'Extrato — ' + st.conta.nome_identificacao;

        var subEl = document.getElementById('bank-statement-subtitle');
        var perDesc = (st.periodo.inicio && st.periodo.inicio !== '1970-01-01' ? UIHelpers.formatDateBr(st.periodo.inicio) : 'Início') + ' até ' + (st.periodo.fim && st.periodo.fim !== '2099-12-31' ? UIHelpers.formatDateBr(st.periodo.fim) : 'Atual');
        if (subEl) subEl.textContent = st.conta.instituicao + ' • Período: ' + perDesc;

        var tipoBadgeEl = document.getElementById('bank-statement-badge-tipo');
        if (tipoBadgeEl) tipoBadgeEl.textContent = st.conta.tipo_conta;

        // Atualiza cards de resumo executivo
        var elAnt = document.getElementById('statement-saldo-anterior');
        if (elAnt) elAnt.textContent = UIHelpers.formatBrl(st.saldo_anterior_centavos || 0);

        var elEnt = document.getElementById('statement-total-entradas');
        if (elEnt) elEnt.textContent = '+' + UIHelpers.formatBrl(st.receitas_confirmadas_periodo_centavos || 0);

        var elSai = document.getElementById('statement-total-saidas');
        if (elSai) elSai.textContent = '-' + UIHelpers.formatBrl(st.despesas_confirmadas_periodo_centavos || 0);

        var elFin = document.getElementById('statement-saldo-final');
        if (elFin) {
          var sFinal = st.saldo_final_confirmado_centavos || 0;
          elFin.textContent = UIHelpers.formatBrl(sFinal);
          elFin.className = 'summary-value summary-val-saldo ' + (sFinal >= 0 ? 'saldo-positivo' : 'saldo-negativo');
        }

        // Renderiza as linhas do extrato com distinção nítida de entradas e saídas
        var rows = (st.lancamentos || []).map(function (l) {
          var isEntrada = l.tipo === 'ENTRADA';
          var rowClass = isEntrada ? 'row-entrada' : 'row-saida';
          var typeBadge = isEntrada
            ? '<span class="badge badge-confirmado">Crédito (+)</span>'
            : '<span class="badge badge-cancelado">Débito (-)</span>';

          var moneyPill = isEntrada
            ? '<span class="money-pill-entrada"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="18 15 12 9 6 15"></polyline></svg> +' + UIHelpers.formatBrl(l.valor_centavos) + '</span>'
            : '<span class="money-pill-saida"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"></polyline></svg> -' + UIHelpers.formatBrl(l.valor_centavos) + '</span>';

          var originBadge = UIHelpers.escapeHtml(l.origem || 'MANUAL');
          if (l.origem === 'TELEGRAM') originBadge = '🤖 Telegram';
          else if (l.origem === 'VOICE') originBadge = '🎤 Voz';
          else if (l.origem === 'SCAN' || l.origem === 'CUPOM') originBadge = '📸 Cupom';

          return (
            '<tr class="' + rowClass + '">' +
            '<td>' + UIHelpers.formatDateBr(l.data_lancamento) + '</td>' +
            '<td><strong>' + UIHelpers.escapeHtml(l.descricao) + '</strong><br><small style="color:var(--text-muted);">Origem: ' + originBadge + (l.forma_pagamento ? ' • ' + l.forma_pagamento : '') + '</small></td>' +
            '<td>' + UIHelpers.escapeHtml(l.categoria_nome || '-') + (l.subcategoria_nome ? '<br><small style="color:var(--text-muted);">' + UIHelpers.escapeHtml(l.subcategoria_nome) + '</small>' : '') + '</td>' +
            '<td>' + typeBadge + '</td>' +
            '<td>' + UIHelpers.renderBadge(l.situacao) + '</td>' +
            '<td class="col-money">' + moneyPill + '</td>' +
            '<td class="col-money"><strong>' + UIHelpers.formatBrl(l.saldo_acumulado_confirmado_centavos) + '</strong></td>' +
            '</tr>'
          );
        }).join('');

        document.getElementById('bank-statement-container').innerHTML = rows
          ? '<table class="data-table"><thead><tr><th>Data</th><th>Descrição / Origem</th><th>Categoria</th><th class="col-center">Tipo</th><th class="col-center">Situação</th><th class="col-money">Movimento</th><th class="col-money">Saldo Acumulado <span class="info-popover-wrap" data-info-key="bank-extrato"></span></th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<p style="color:var(--text-muted); padding:1.25rem 0; text-align:center;">Nenhum lançamento encontrado nesta conta para o período selecionado.</p>';

        UIHelpers.initInfoPopovers(card);
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    function exportStatementCsv() {
      var st = state.currentStatementData;
      if (!st || !st.lancamentos) {
        showToast('Nenhum extrato carregado para exportar.', 'error');
        return;
      }
      var headers = ['Data', 'Tipo', 'Descricao', 'Categoria', 'Subcategoria', 'Forma Pagamento', 'Situacao', 'Valor (R$)', 'Saldo Acumulado (R$)'];
      var lines = [headers.join(';')];
      for (var i = 0; i < st.lancamentos.length; i++) {
        var it = st.lancamentos[i];
        var row = [
          UIHelpers.formatDateBr(it.data_lancamento),
          it.tipo,
          '"' + String(it.descricao || '').replace(/"/g, '""') + '"',
          '"' + String(it.categoria_nome || '').replace(/"/g, '""') + '"',
          '"' + String(it.subcategoria_nome || '').replace(/"/g, '""') + '"',
          it.forma_pagamento || '',
          it.situacao,
          '"' + (it.tipo === 'ENTRADA' ? '+' : '-') + UIHelpers.formatBrl(it.valor_centavos) + '"',
          '"' + UIHelpers.formatBrl(it.saldo_acumulado_confirmado_centavos) + '"'
        ];
        lines.push(row.join(';'));
      }
      // UTF-8 BOM (\uFEFF) para garantir acentuação correta no Excel Windows
      var csvContent = '\uFEFF' + lines.join('\r\n');
      var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'extrato_' + (st.conta.nome_identificacao || 'conta').toLowerCase().replace(/\s+/g, '_') + '_' + new Date().toISOString().substring(0, 10) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('Extrato exportado com sucesso (' + st.lancamentos.length + ' registros).', 'success');
    }

    function renderCreditCardsView(cards) {

      var totalComprometido = 0;
      var totalFaturasMes = 0;
      var totalLimiteGeral = 0;

      for (var i = 0; i < cards.length; i++) {

        callServer('creditCards.list', {}, function (res) {
          state.creditCards = res.data || [];

    function updatePurchaseInstallmentPreview() {
      var cardId = (document.getElementById('pur-card-id') || {}).value;
      var rawVal = (document.getElementById('pur-valor-total') || {}).value;
      var parcelas = parseInt((document.getElementById('pur-parcelas') || {}).value || '1', 10);
      var dataCompra = (document.getElementById('pur-data') || {}).value || new Date().toISOString().substring(0, 10);
      var textEl = document.getElementById('pur-preview-text');
      if (!textEl) return;

      var centavos = UIHelpers.parseInputToCentavos(rawVal);
      if (!cardId || centavos <= 0) {
        textEl.textContent = 'Informe o valor para ver a previsão exata das parcelas e fatura.';
        return;
      }

      var card = (state.creditCards || []).find(function (c) { return c.id === cardId; });
      if (!card) {
        textEl.textContent = 'Selecione um cartão de crédito válido.';
        return;
      }

      var dayCompra = parseInt(dataCompra.substring(8, 10), 10);
      var entraProximoMes = dayCompra > card.dia_fechamento;
      var valorParcela = Math.floor(centavos / parcelas);

      var faturaTexto = entraProximoMes
        ? '⚠️ Data posterior ao corte (dia ' + card.dia_fechamento + '): entrará na fatura do próximo mês.'
        : '✓ Data anterior ao corte (dia ' + card.dia_fechamento + '): entrará na fatura do mês atual.';

      if (parcelas === 1) {
        textEl.innerHTML = '<strong>À vista:</strong> 1x de ' + UIHelpers.formatBrl(centavos) + '<br><small>' + faturaTexto + '</small>';
      } else {
        textEl.innerHTML = '<strong>Parcelamento:</strong> ' + parcelas + 'x de aproximadamente ' + UIHelpers.formatBrl(valorParcela) + '<br><small>' + faturaTexto + '</small>';
      }
    }

    function runPurchaseSimulation(ev) {
      ev.preventDefault();
      var cardId = document.getElementById('sim-card-id').value;
      var valorCentavos = UIHelpers.parseInputToCentavos(document.getElementById('sim-valor').value);
      var parcelas = parseInt(document.getElementById('sim-parcelas').value, 10);
      var dataCompra = document.getElementById('sim-data').value;

      var payload = {
        cartao_id: cardId,
        valor_total_centavos: valorCentavos,
        parcelas_total: parcelas,
        data_compra: dataCompra
      };

      callServer('creditCards.simulate', payload, function (res) {
        var d = res.data;
        var resContainer = document.getElementById('sim-result-container');
        var verdictEl = document.getElementById('sim-verdict-banner');
        var schedEl = document.getElementById('sim-schedule-table');

        if (d.cabe_no_limite) {

          verdictEl.style.border = '1px solid rgba(16,185,129,0.3)';

        } else {
          verdictEl.style.background = 'rgba(239,68,68,0.12)';
          verdictEl.style.border = '1px solid rgba(239,68,68,0.3)';
          verdictEl.style.color = '#dc2626';

        }

        var rows = d.cronograma.map(function (item) {
          return (
            '<tr>' +
              '<td>' + item.numero_parcela + '/' + d.parcelas_total + '</td>' +
              '<td><strong>' + item.mes_competencia + '</strong></td>' +
              '<td>' + UIHelpers.formatDateBr(item.data_vencimento) + '</td>' +
              '<td class="col-money">' + UIHelpers.formatBrl(item.valor_centavos) + '</td>' +
            '</tr>'
          );
        }).join('');

        schedEl.innerHTML =
          '<table class="data-table" style="font-size:0.82rem;">' +
            '<thead><tr><th class="col-center">Parcela <span class="info-popover-wrap" data-info-key="crd-col-parcela"></span></th><th>Competência</th><th>Vencimento Estimado</th><th class="col-money">Valor</th></tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>';

        resContainer.style.display = 'block';
        UIHelpers.initInfoPopovers(resContainer);
      });
    }

    function submitDebt(ev) {
      ev.preventDefault();
      var payload = {
        credor: document.getElementById('div-credor').value,
        descricao: document.getElementById('div-descricao').value,
        valor_original_centavos: UIHelpers.parseInputToCentavos(document.getElementById('div-valor-orig').value),
        valor_atualizado_centavos: UIHelpers.parseInputToCentavos(document.getElementById('div-valor-atual').value),
        data_origem: document.getElementById('div-data-origem').value,
        situacao: document.getElementById('div-situacao').value,
        observacoes: document.getElementById('div-obs').value
      };
      var optimisticId = 'temp_' + Date.now();
      var optDebt = {
        id: optimisticId,
        credor: payload.credor,
        descricao: payload.descricao,
        valor_original_centavos: payload.valor_original_centavos,
        valor_atualizado_centavos: payload.valor_atualizado_centavos,
        data_origem: payload.data_origem,
        situacao: payload.situacao,
        observacoes: payload.observacoes
      };
      if (!state.debts) state.debts = [];
      state.debts.unshift(optDebt);
      renderDebtsView(state.debts);
      showToast('Dívida registrada (sem impacto automático nas despesas mensais até aprovação de acordo).', 'success');

      document.getElementById('div-credor').value = '';
      document.getElementById('div-descricao').value = '';
      document.getElementById('div-valor-orig').value = '';
      document.getElementById('div-valor-atual').value = '';
      if (document.getElementById('div-obs')) document.getElementById('div-obs').value = '';
      toggleNewDebtCard(false);

      callServer('debts.create', payload, function () {
        loadDebts(true);
      }, {
        quiet: true,
        onError: function (err) {
          state.debts = (state.debts || []).filter(function (it) { return it.id !== optimisticId; });
          renderDebtsView(state.debts);
          showToast('Erro ao cadastrar dívida: ' + (err.message || err), 'error');
        }
      });
    }

    function renderDebtsView(debtsList) {
      debtsList = debtsList || state.debts || [];

      // 1. Atualiza os cards de KPIs
      var totalOrig = 0;
      var totalDevedor = 0;
      var emNegociacaoCount = 0;
      var resolvidasCount = 0;
      var totalNegociado = 0;

      debtsList.forEach(function (d) {
        totalOrig += Number(d.valor_original_centavos || 0);
        if (d.situacao !== 'QUITADA' && d.situacao !== 'CANCELADA') {
          totalDevedor += Number(d.valor_atualizado_centavos || 0);
        }
        if (d.situacao === 'EM_NEGOCIACAO' || d.situacao === 'PROTESTADA' || d.situacao === 'ANTIGA') {
          emNegociacaoCount++;
        }
        if (d.situacao === 'ACORDO_ATIVO' || d.situacao === 'QUITADA') {
          resolvidasCount++;
          totalNegociado += Number(d.valor_negociado_centavos || 0);
        }
      });

      var elTot = document.getElementById('debts-kpi-total');
      if (elTot) elTot.textContent = debtsList.length + ' dívida(s)';

      var elOrigDesc = document.getElementById('debts-kpi-original-desc');
      if (elOrigDesc) elOrigDesc.textContent = 'Valor original: ' + UIHelpers.formatBrl(totalOrig);

      var elDev = document.getElementById('debts-kpi-devedor');
      if (elDev) elDev.textContent = UIHelpers.formatBrl(totalDevedor);

      var elNeg = document.getElementById('debts-kpi-negociacao');
      if (elNeg) elNeg.textContent = emNegociacaoCount + ' pendência(s)';

      var elAco = document.getElementById('debts-kpi-acordos');
      if (elAco) elAco.textContent = resolvidasCount + ' resolvida(s)';

      var elNegDesc = document.getElementById('debts-kpi-negociado-desc');
      if (elNegDesc) elNegDesc.textContent = 'Total negociado: ' + UIHelpers.formatBrl(totalNegociado);

      // 2. Renderiza a tabela de dívidas
      var rows = debtsList.map(function (d) {
        var borderColors = {
          'ANTIGA': '#64748b',
          'PROTESTADA': '#ef4444',
          'EM_NEGOCIACAO': '#f59e0b',
          'ACORDO_ATIVO': '#8b5cf6',
          'QUITADA': '#10b981',
          'CANCELADA': '#94a3b8'
        };
        var bColor = borderColors[d.situacao] || '#64748b';

        var acordoInfo = '';
        if (d.situacao === 'ACORDO_ATIVO') {
          var parcelas = d.parcelas || [];
          var pagas = parcelas.filter(function (p) { return p.situacao === 'PAGA'; }).length;
          var totalP = d.quantidade_parcelas || parcelas.length;
          acordoInfo = '<div><strong style="color:#7c3aed;">' + pagas + '/' + totalP + ' pagas</strong><br><small style="color:var(--text-secondary);">' + (d.repercutir_fluxo_caixa ? 'Fluxo: Ativo' : 'Fluxo: Isolado') + '</small></div>';
        } else if (d.situacao === 'QUITADA') {
          acordoInfo = '<span class="badge badge-confirmado">100% Paga</span>';
        } else {
          acordoInfo = '<span style="color:var(--text-secondary); font-size:0.8rem;">Sem acordo ativo</span>';
        }

        var dropdownId = 'debt-actions-' + d.id;
        var menuItems = [];

        if (d.situacao !== 'QUITADA' && d.situacao !== 'CANCELADA') {
          menuItems.push(
            '<button type="button" class="dropdown-action-btn" onclick="App.openDebtAgreementModal(\'' + UIHelpers.escapeHtml(d.id) + '\'); App.closeAllActionDropdowns();">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>' +
              '<span>' + (d.situacao === 'ACORDO_ATIVO' ? 'Renegociar Acordo' : 'Formalizar Acordo') + '</span>' +
            '</button>'
          );
        }

        if (d.parcelas && d.parcelas.length > 0) {
          menuItems.push(
            '<button type="button" class="dropdown-action-btn" onclick="App.viewDebtInstallments(\'' + UIHelpers.escapeHtml(d.id) + '\'); App.closeAllActionDropdowns();">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>' +
              '<span>Ver Parcelas (' + d.parcelas.length + ')</span>' +
            '</button>'
          );
        }

        menuItems.push(
          '<button type="button" class="dropdown-action-btn" onclick="App.openEditDebtModal(\'' + UIHelpers.escapeHtml(d.id) + '\'); App.closeAllActionDropdowns();">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>' +
            '<span>Editar Dívida</span>' +
          '</button>'
        );

        var dropdownHtml =
          '<div class="table-actions-dropdown">' +
            '<button type="button" class="btn-dots-action" onclick="App.toggleRowDropdown(event, \'' + dropdownId + '\')" title="Opções da dívida" aria-label="Ações">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.2"></circle><circle cx="12" cy="12" r="2.2"></circle><circle cx="12" cy="19" r="2.2"></circle></svg>' +
            '</button>' +
            '<div id="' + dropdownId + '" class="table-dropdown-menu">' +
              menuItems.join('') +
            '</div>' +
          '</div>';

        return (
          '<tr style="border-left: 3.5px solid ' + bColor + ';">' +
            '<td>' +
              '<strong>' + UIHelpers.escapeHtml(d.credor) + '</strong><br>' +
              '<small style="color:var(--text-secondary);">' + UIHelpers.escapeHtml(d.descricao) + (d.observacoes ? ' &bull; ' + UIHelpers.escapeHtml(d.observacoes) : '') + '</small>' +
            '</td>' +
            '<td class="col-center">' + UIHelpers.formatDateBr(d.data_origem) + '</td>' +
            '<td class="col-money" style="color:var(--text-secondary);">' + UIHelpers.formatBrl(d.valor_original_centavos) + '</td>' +
            '<td class="col-money"><strong style="color:var(--danger);">' + UIHelpers.formatBrl(d.valor_atualizado_centavos) + '</strong></td>' +
            '<td class="col-center">' + UIHelpers.renderBadge(d.situacao) + '</td>' +
            '<td class="col-center">' + acordoInfo + '</td>' +
            '<td style="text-align:right;">' + dropdownHtml + '</td>' +
          '</tr>'
        );
      }).join('');

      var debtsHeader =
        '<thead><tr>' +
          '<th>Credor / Descrição <span class="info-popover-wrap" data-info-key="debt-col-credor"></span></th>' +
          '<th class="col-center">Data Origem <span class="info-popover-wrap" data-info-key="debt-col-data"></span></th>' +
          '<th class="col-money">Valor Original <span class="info-popover-wrap" data-info-key="debt-col-valor-orig"></span></th>' +
          '<th class="col-money">Valor Atualizado <span class="info-popover-wrap" data-info-key="debt-col-valor-atual"></span></th>' +
          '<th class="col-center">Situação <span class="info-popover-wrap" data-info-key="debt-col-situacao"></span></th>' +
          '<th class="col-center">Acordo / Fluxo <span class="info-popover-wrap" data-info-key="debt-col-acordo"></span></th>' +
          '<th style="text-align:right;">Ações</th>' +
        '</tr></thead>';

      var debtsTableContainer = document.getElementById('debts-table-container');
      if (debtsTableContainer) {
        debtsTableContainer.innerHTML = rows
          ? '<table class="data-table">' + debtsHeader + '<tbody>' + rows + '</tbody></table>'
          : '<p style="color:var(--text-muted); padding:1.5rem; text-align:center;">Nenhuma dívida cadastrada. Use o botão acima para adicionar uma nova pendência financeira.</p>';
      }

      UIHelpers.initInfoPopovers(document.getElementById('sec-debts'));
    }

    function loadDebts(forceRefresh) {
      if (state.debts && state.debts.length >= 0 && !forceRefresh) {
        renderDebtsView(state.debts);
        callServer('debts.list', {}, function (res) {
          state.debts = res.data || [];
          renderDebtsView(state.debts);
        }, { quiet: true });
        return;
      }
      callServer('debts.list', {}, function (res) {
        state.debts = res.data || [];
        renderDebtsView(state.debts);
      });
    }

      var d = (state.debts || []).find(function (it) { return String(it.id) === String(debtId); });

    function updateAgreementPreview() {
      var debtId = document.getElementById('agreement-debt-id').value;
      var d = (state.debts || []).find(function (it) { return String(it.id) === String(debtId); });
      if (!d) return;

      var rawVal = (document.getElementById('agreement-valor-negociado').value || '').trim();
      var centavos = UIHelpers.parseInputToCentavos(rawVal);
      var qtd = parseInt(document.getElementById('agreement-qtd-parcelas').value, 10) || 1;
      if (qtd < 1) qtd = 1;

      var valParcela = Math.round(centavos / qtd);
      var prevEl = document.getElementById('agreement-preview-val');
      if (prevEl) {
        prevEl.textContent = qtd + 'x de aprox. ' + UIHelpers.formatBrl(valParcela) + ' (Total: ' + UIHelpers.formatBrl(centavos) + ')';
      }

      var discEl = document.getElementById('agreement-discount-txt');
      if (discEl) {
        var diff = Number(d.valor_atualizado_centavos || 0) - centavos;
        if (diff > 0) {
          discEl.textContent = 'Economia / Desconto de ' + UIHelpers.formatBrl(diff) + ' em relação ao valor atualizado!';
          discEl.style.color = 'var(--success)';
        } else if (diff < 0) {
          discEl.textContent = 'Acréscimo de juros/custas de ' + UIHelpers.formatBrl(Math.abs(diff)) + '.';
          discEl.style.color = 'var(--text-secondary)';
        } else {
          discEl.textContent = 'Valor integral sem desconto.';
          discEl.style.color = 'var(--text-secondary)';
        }
      }
    }

        valor_negociado_centavos: centavos,
        quantidade_parcelas: qtd,
        primeiro_vencimento_acordo: vencimento,
        proposta_negociacao: proposta,
        repercutir_fluxo_caixa: repercutir
      };

    function calculatePastDueInstallments(dataInicialIso, totalParcelas) {
      if (!dataInicialIso || !totalParcelas) return 0;
      var now = new Date();
      var todayIso = toIsoDate(now);
      var parts = String(dataInicialIso).substring(0, 10).split('-');
      var startYear = parseInt(parts[0], 10);
      var startMonth = parseInt(parts[1], 10);
      var targetDia = parseInt(parts[2] || '1', 10);
      var count = 0;

      for (var i = 1; i <= totalParcelas; i++) {
        var d = new Date(Date.UTC(startYear, startMonth - 1 + (i - 1), 1));
        var ty = d.getUTCFullYear();
        var tm = d.getUTCMonth() + 1;
        var lastDay = new Date(Date.UTC(ty, tm, 0)).getUTCDate();
        var td = Math.min(targetDia, lastDay);
        var dueIso = ty + '-' + String(tm).padStart(2, '0') + '-' + String(td).padStart(2, '0');

        if (dueIso <= todayIso) {
          count++;
        } else {
          break;
        }
      }
      return count;
    }

    function updateLoanPreview() {
      var vContratadoRaw = (document.getElementById('emp-valor-contratado').value || '').trim();
      var vParcelaRaw = (document.getElementById('emp-valor-parcela').value || '').trim();
      var parcelas = parseInt(document.getElementById('emp-parcelas').value, 10) || 0;
      var elPagas = document.getElementById('emp-parcelas-pagas');
      var pagas = elPagas ? (parseInt(elPagas.value, 10) || 0) : 0;
      if (pagas > parcelas) pagas = parcelas;

      var contratadoCentavos = UIHelpers.parseInputToCentavos(vContratadoRaw);
      var parcelaCentavos = UIHelpers.parseInputToCentavos(vParcelaRaw);

      var totalPagarCentavos = parcelas * parcelaCentavos;
      var pendentes = Math.max(0, parcelas - pagas);
      var saldoDevedorCentavos = pendentes * parcelaCentavos;
      var jurosCentavos = totalPagarCentavos - contratadoCentavos;

      var totalEl = document.getElementById('loan-preview-total');
      var jurosEl = document.getElementById('loan-preview-juros');
      if (!totalEl || !jurosEl) return;

      if (parcelas > 0 && parcelaCentavos > 0) {
        var pct = parcelas > 0 ? Math.round((pagas / parcelas) * 100) : 0;
        totalEl.innerHTML = parcelas + 'x de ' + UIHelpers.formatBrl(parcelaCentavos) + ' = <strong>' + UIHelpers.formatBrl(totalPagarCentavos) + '</strong>';
        var txt = '<strong>Progresso:</strong> ' + pagas + '/' + parcelas + ' pagas (' + pct + '%) &bull; <strong>Saldo Devedor Restante:</strong> ' + UIHelpers.formatBrl(saldoDevedorCentavos);
        if (contratadoCentavos > 0 && jurosCentavos > 0) {
          txt += '<br><span style="color:var(--text-muted); font-size:0.75rem;">Juros / Custo Efetivo Total estimado: +' + UIHelpers.formatBrl(jurosCentavos) + ' sobre o valor liberado.</span>';
        }
        jurosEl.innerHTML = txt;
      } else {
        totalEl.textContent = '-';
        jurosEl.textContent = '';
      }
    }

    function onNewLoanDataInicialChange() {
      var elData = document.getElementById('emp-data-inicial');
      var elParcelas = document.getElementById('emp-parcelas');
      var elPagas = document.getElementById('emp-parcelas-pagas');
      if (!elData || !elParcelas || !elPagas) return;
      var numParcelas = parseInt(elParcelas.value, 10) || 0;
      var pastCount = calculatePastDueInstallments(elData.value, numParcelas);
      elPagas.value = pastCount;
      elPagas.max = numParcelas;
      updateLoanPreview();
    }

    function onNewLoanParcelasChange() {
      var elParcelas = document.getElementById('emp-parcelas');
      var elPagas = document.getElementById('emp-parcelas-pagas');
      if (elParcelas && elPagas) {
        var numParcelas = parseInt(elParcelas.value, 10) || 0;
        elPagas.max = numParcelas;
        if (parseInt(elPagas.value, 10) > numParcelas) {
          elPagas.value = numParcelas;
        }
      }
      updateLoanPreview();
    }

    function submitLoan(ev) {
      ev.preventDefault();
      var taxaFloat = parseFloat(String(document.getElementById('emp-taxa').value || '0').replace(',', '.')) || 0;
      var modalidade = document.getElementById('emp-modalidade-cobranca') ? document.getElementById('emp-modalidade-cobranca').value : 'CONSIGNADO_FOLHA';
      var isConsignado = modalidade === 'CONSIGNADO_FOLHA';
      var contaId = !isConsignado && document.getElementById('emp-conta') ? document.getElementById('emp-conta').value : '';

      var elData = document.getElementById('emp-data-inicial');
      var dataInicialVal = (elData && elData.value ? elData.value : '').trim();
      if (!dataInicialVal) {
        var now = new Date();
        var dNext = new Date(now.getFullYear(), now.getMonth() + 1, now.getDate());
        dataInicialVal = dNext.getFullYear() + '-' + String(dNext.getMonth() + 1).padStart(2, '0') + '-' + String(dNext.getDate()).padStart(2, '0');
        if (elData) elData.value = dataInicialVal;
      }

      var elPagas = document.getElementById('emp-parcelas-pagas');
      var pagasVal = elPagas ? parseInt(elPagas.value, 10) : 0;
      if (isNaN(pagasVal) || pagasVal < 0) pagasVal = 0;

      var payload = {
        instituicao: document.getElementById('emp-instituicao').value,
        descricao: document.getElementById('emp-descricao').value,
        tipo_emprestimo: isConsignado ? 'CONSIGNADO' : 'PESSOAL',
        valor_contratado_centavos: UIHelpers.parseInputToCentavos(document.getElementById('emp-valor-contratado').value),
        numero_parcelas: parseInt(document.getElementById('emp-parcelas').value, 10),
        parcelas_pagas: pagasVal,
        valor_parcela_centavos: UIHelpers.parseInputToCentavos(document.getElementById('emp-valor-parcela').value),
        data_inicial: dataInicialVal,
        taxa_juros_mensal_bps: Math.round(taxaFloat * 100),
        desconto_em_folha: isConsignado,
        desconto_em_folha_ja_deduzido_salario: isConsignado,
        conta_bancaria_id: contaId,
        observacoes: document.getElementById('emp-obs') ? document.getElementById('emp-obs').value : ''
      };

      var optimisticId = 'temp_' + Date.now();
      var optLoan = {
        id: optimisticId,
        instituicao: payload.instituicao,
        descricao: payload.descricao,
        situacao: 'ATIVO',
        tipo_emprestimo: payload.tipo_emprestimo,
        desconto_em_folha: isConsignado,
        desconto_em_folha_ja_deduzido_salario: isConsignado,
        valor_contratado_centavos: payload.valor_contratado_centavos,
        numero_parcelas: payload.numero_parcelas,
        parcelas_pagas: pagasVal,
        valor_parcela_centavos: payload.valor_parcela_centavos,
        saldo_devedor_centavos: Math.max(0, (payload.numero_parcelas - pagasVal) * payload.valor_parcela_centavos),
        data_inicial: dataInicialVal,
        taxa_juros_mensal_bps: payload.taxa_juros_mensal_bps,
        conta_bancaria_id: contaId,
        observacoes: payload.observacoes
      };

      if (!state.loans) state.loans = [];
      state.loans.unshift(optLoan);
      renderLoansView(state.loans);
      showToast('Contrato de empréstimo cadastrado com sucesso!', 'success');

      document.getElementById('emp-instituicao').value = '';
      document.getElementById('emp-descricao').value = '';
      document.getElementById('emp-valor-contratado').value = '';
      document.getElementById('emp-valor-parcela').value = '';
      if (elPagas) elPagas.value = '0';
      if (document.getElementById('emp-obs')) document.getElementById('emp-obs').value = '';

      // Reseta campo de data para a próxima data padrão (30 dias à frente)
      if (elData) {
        var now = new Date();
        var dNext = new Date(now.getFullYear(), now.getMonth() + 1, now.getDate());
        elData.value = dNext.getFullYear() + '-' + String(dNext.getMonth() + 1).padStart(2, '0') + '-' + String(dNext.getDate()).padStart(2, '0');
      }

      toggleNewLoanCard(false);

      callServer('loans.create', payload, function () {
        loadLoans(true);
      }, {
        quiet: true,
        onError: function (err) {
          state.loans = (state.loans || []).filter(function (it) { return it.id !== optimisticId; });
          renderLoansView(state.loans);
          showToast('Erro ao cadastrar contrato: ' + (err.message || err), 'error');
        }
      });
    }

    function renderLoansView(loansList) {
      loansList = loansList || state.loans || [];

      // 1. Atualiza os cards de KPIs
      var totalContratado = 0;
      var totalDevedor = 0;
      var totalPagas = 0;
      var totalParcelasGeral = 0;
      var ativosCount = 0;
      var consignadosCount = 0;

      loansList.forEach(function (l) {
        totalContratado += Number(l.valor_contratado_centavos || 0);
        totalDevedor += Number(l.saldo_devedor_centavos || 0);
        totalPagas += Number(l.parcelas_pagas || 0);
        totalParcelasGeral += Number(l.numero_parcelas || 0);
        if (l.situacao === 'ATIVO') ativosCount++;
        if (l.desconto_em_folha_ja_deduzido_salario) consignadosCount++;

      var elContratado = document.getElementById('loans-kpi-contratado');
      if (elContratado) elContratado.textContent = UIHelpers.formatBrl(totalContratado);

      if (elDevedor) elDevedor.textContent = UIHelpers.formatBrl(totalDevedor);

      if (elProgPercent) {
        var pct = totalParcelasGeral > 0 ? Math.round((totalPagas / totalParcelasGeral) * 100) : 0;
        elProgPercent.textContent = pct + '% concluído';
      }

      var elAtivos = document.getElementById('loans-kpi-ativos');
      if (elAtivos) elAtivos.textContent = ativosCount + ' contrato(s)';

      var elConsDesc = document.getElementById('loans-kpi-consignados-desc');

        var isConsignado = Boolean(l.desconto_em_folha_ja_deduzido_salario);
        var borderColor = isConsignado ? '#0d9488' : '#2563eb';

        var progressHtml =

              '<span>' + pct + '%</span>' +
            '</div>' +
            '<div style="background:var(--border-color); height:6px; border-radius:3px; overflow:hidden;">' +
              '<div style="background:' + (pct === 100 ? 'var(--success)' : (isConsignado ? '#0d9488' : '#2563eb')) + '; width:' + pct + '%; height:100%;"></div>' +
            '</div>' +
          '</div>';

        var dropdownId = 'loan-actions-' + l.id;
        var menuItems = [
          '<button type="button" class="dropdown-action-btn" onclick="App.viewLoanInstallments(\'' + UIHelpers.escapeHtml(l.id) + '\'); App.closeAllActionDropdowns();">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>' +
            '<span>Ver Cronograma de Parcelas</span>' +

            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>' +
            '<span>Editar Contrato</span>' +
          '</button>'

        var dropdownHtml =
          '<div class="table-actions-dropdown">' +
            '<button type="button" class="btn-dots-action" onclick="App.toggleRowDropdown(event, \'' + dropdownId + '\')" title="Opções do empréstimo" aria-label="Ações">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.2"></circle><circle cx="12" cy="12" r="2.2"></circle><circle cx="12" cy="19" r="2.2"></circle></svg>' +
            '</button>' +

              menuItems.join('') +

        return (
          '<tr style="border-left: 3.5px solid ' + borderColor + ';">' +
            '<td>' +
              '<div style="display:flex;align-items:center;gap:10px;">' +
                bankBadge +
                '<div>' +
                  '<div style="font-weight:600; color:var(--text-primary);">' + UIHelpers.escapeHtml(l.instituicao) + '</div>' +
                  '<small style="color:var(--text-secondary);">' + UIHelpers.escapeHtml(l.descricao) + (l.observacoes ? ' &bull; ' + UIHelpers.escapeHtml(l.observacoes) : '') + '</small>' +

            '<td class="col-center">' + progressHtml + '</td>' +

          '</tr>'
        );
      }).join('');

      var loansHeader =
        '<thead><tr>' +
          '<th>Instituição / Descrição <span class="info-popover-wrap" data-info-key="loan-col-instituicao"></span></th>' +
          '<th class="col-center">Modalidade <span class="info-popover-wrap" data-info-key="loan-col-modalidade"></span></th>' +
          '<th class="col-money">Parcela <span class="info-popover-wrap" data-info-key="loan-col-parcela"></span></th>' +
          '<th class="col-center">Progresso <span class="info-popover-wrap" data-info-key="loan-col-progresso"></span></th>' +
          '<th class="col-money">Saldo Devedor <span class="info-popover-wrap" data-info-key="loan-col-saldo-devedor"></span></th>' +
          '<th class="col-center">Situação <span class="info-popover-wrap" data-info-key="loan-col-situacao"></span></th>' +
          '<th style="text-align:right;">Ações</th>' +
        '</tr></thead>';

      var loansTableContainer = document.getElementById('loans-table-container');
      if (loansTableContainer) {
        loansTableContainer.innerHTML = rows
          ? '<table class="data-table">' + loansHeader + '<tbody>' + rows + '</tbody></table>'
          : '<p style="color:var(--text-muted); padding:1.5rem; text-align:center;">Nenhum empréstimo cadastrado. Use o botão acima para adicionar um novo contrato.</p>';

      UIHelpers.initInfoPopovers(document.getElementById('sec-loans'));

    function loadLoans(forceRefresh) {
      if (state.loans && state.loans.length >= 0 && !forceRefresh) {
        renderLoansView(state.loans);
        callServer('loans.list', {}, function (res) {
          state.loans = res.data || [];
          renderLoansView(state.loans);
        }, { quiet: true });
        return;
      }
      callServer('loans.list', {}, function (res) {
        state.loans = res.data || [];
        renderLoansView(state.loans);
      });
    }

    function viewLoanInstallments(loanId) {
      var l = (state.loans || []).find(function (it) { return String(it.id) === String(loanId); });
      if (!l) {
        showToast('Empréstimo não encontrado.', 'error');
        return;
      }

      var isConsignado = Boolean(l.desconto_em_folha_ja_deduzido_salario);
      var subEl = document.getElementById('modal-loan-inst-sub');
      if (subEl) {
        subEl.textContent = l.instituicao + ' — ' + l.descricao + ' (' + (isConsignado ? '🏢 Desconto em Folha' : '💳 Pago pelo Usuário') + ')';
      }

      var parcelas = l.parcelas || [];
      var rows = parcelas.map(function (p) {
        var isPaga = p.situacao === 'PAGA';
        var actionBtn = isPaga
          ? '<span class="badge badge-confirmado">✓ Paga em ' + UIHelpers.formatDateBr(p.data_pagamento) + '</span>'
          : '<button type="button" class="btn btn-primary btn-sm" onclick="App.payLoanInstallment(\'' + UIHelpers.escapeHtml(p.id) + '\', \'' + UIHelpers.escapeHtml(l.id) + '\')">' + (isConsignado ? 'Baixar Parcela (Folha)' : 'Pagar Parcela (Banco)') + '</button>';

        var regraTexto = isConsignado
          ? '<span style="color:#0d9488; font-size:0.75rem; font-weight:500;">Holerite (Sem Débito)</span>'
          : '<span style="color:#2563eb; font-size:0.75rem; font-weight:500;">Débito em Conta</span>';

        return (
          '<tr>' +
            '<td class="col-center"><strong>' + p.numero_parcela + '/' + p.total_parcelas + '</strong></td>' +
            '<td class="col-center">' + UIHelpers.formatDateBr(p.data_vencimento) + '</td>' +
            '<td class="col-money"><strong>' + UIHelpers.formatBrl(p.valor_centavos) + '</strong></td>' +
            '<td class="col-center">' + regraTexto + '</td>' +
            '<td class="col-center">' + UIHelpers.renderBadge(p.situacao) + '</td>' +
            '<td style="text-align:right;">' + actionBtn + '</td>' +
          '</tr>'
        );
      }).join('');

      var container = document.getElementById('loan-installments-list-container');
      if (container) {
        container.innerHTML = rows
          ? '<table class="data-table"><thead><tr><th class="col-center">Parcela</th><th class="col-center">Vencimento</th><th class="col-money">Valor</th><th class="col-center">Impacto</th><th class="col-center">Situação</th><th style="text-align:right;">Ação</th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<p style="color:var(--text-muted); padding:1rem; text-align:center;">Nenhuma parcela gerada para este contrato.</p>';
      }

      var modal = document.getElementById('modal-loan-installments-backdrop');
      if (modal) {
        modal.classList.add('open');
        UIHelpers.initInfoPopovers(modal);
      }
    }

    function closeLoanInstallmentsModal() {
      var modal = document.getElementById('modal-loan-installments-backdrop');
      if (modal) modal.classList.remove('open');
    }

    function payLoanInstallment(parcelaId, loanId) {
      var l = (state.loans || []).find(function (it) { return String(it.id) === String(loanId); });
      var isConsignado = l && l.desconto_em_folha_ja_deduzido_salario;

      var confirmMsg = isConsignado
        ? 'Deseja confirmar a baixa desta parcela consignada? O contrato será atualizado SEM debitar o saldo da conta bancária (já deduzido do salário).'
        : 'Deseja confirmar o pagamento desta parcela? Será gerado um débito confirmado na sua conta bancária.';

      if (!confirm(confirmMsg)) return;

      callServer('loans.payInstallment', { parcela_id: parcelaId }, function () {
        showToast(isConsignado ? 'Parcela baixada no contrato com sucesso!' : 'Parcela paga e débito bancário registrado com sucesso!', 'success');
        loadLoans();
        if (!isConsignado) {
          loadBankAccounts();
          loadLaunches(1);
        }
        loadDashboard();
        setTimeout(function () {
          viewLoanInstallments(loanId);
        }, 300);
      });
    }

    function onEditLoanModalidadeChange() {
      var select = document.getElementById('edit-loan-modalidade-cobranca');
      if (!select) return;
      var isConsignado = select.value === 'CONSIGNADO_FOLHA';
      var contaGroup = document.getElementById('edit-loan-conta-group');
      if (contaGroup) {
        contaGroup.style.display = isConsignado ? 'none' : 'block';
      }
      var helper = document.getElementById('edit-loan-modalidade-helper');
      if (helper) {
        if (isConsignado) {
          helper.innerHTML = '✓ <strong>Proteção ativada:</strong> Como o valor já é retido no seu contracheque pelo empregador, as parcelas serão contabilizadas para quitação do contrato <strong>sem duplicar saídas na sua conta bancária</strong>.';
        } else {
          helper.innerHTML = '💳 <strong>Débito em conta / Boleto:</strong> Você recebe seu salário integral e a cada parcela paga será gerado um <strong>lançamento de despesa confirmado</strong> na conta bancária selecionada.';
        }
      }
    }

    function updateEditLoanPreview() {
      var vContratadoRaw = (document.getElementById('edit-loan-valor-contratado').value || '').trim();
      var vParcelaRaw = (document.getElementById('edit-loan-valor-parcela').value || '').trim();
      var parcelas = parseInt(document.getElementById('edit-loan-parcelas').value, 10) || 0;
      var elPagas = document.getElementById('edit-loan-parcelas-pagas');
      var pagas = elPagas ? (parseInt(elPagas.value, 10) || 0) : 0;
      if (pagas > parcelas) pagas = parcelas;

      var contratadoCentavos = UIHelpers.parseInputToCentavos(vContratadoRaw);
      var parcelaCentavos = UIHelpers.parseInputToCentavos(vParcelaRaw);

      var totalPagarCentavos = parcelas * parcelaCentavos;
      var pendentes = Math.max(0, parcelas - pagas);
      var saldoDevedorCentavos = pendentes * parcelaCentavos;
      var jurosCentavos = totalPagarCentavos - contratadoCentavos;

      var totalEl = document.getElementById('edit-loan-preview-total');
      var jurosEl = document.getElementById('edit-loan-preview-juros');
      if (!totalEl || !jurosEl) return;

      if (parcelas > 0 && parcelaCentavos > 0) {
        var pct = parcelas > 0 ? Math.round((pagas / parcelas) * 100) : 0;
        totalEl.innerHTML = parcelas + 'x de ' + UIHelpers.formatBrl(parcelaCentavos) + ' = <strong>' + UIHelpers.formatBrl(totalPagarCentavos) + '</strong>';
        var txt = '<strong>Progresso:</strong> ' + pagas + '/' + parcelas + ' pagas (' + pct + '%) &bull; <strong>Saldo Devedor Restante:</strong> ' + UIHelpers.formatBrl(saldoDevedorCentavos);
        if (contratadoCentavos > 0 && jurosCentavos > 0) {
          txt += '<br><span style="color:var(--text-muted); font-size:0.75rem;">Juros / Custo Efetivo Total estimado: +' + UIHelpers.formatBrl(jurosCentavos) + ' sobre o valor liberado.</span>';
        }
        jurosEl.innerHTML = txt;
      } else {
        totalEl.textContent = '-';
        jurosEl.textContent = '';
      }
    }

    function onEditLoanDataInicialChange() {
      var elData = document.getElementById('edit-loan-data-inicial');
      var elParcelas = document.getElementById('edit-loan-parcelas');
      var elPagas = document.getElementById('edit-loan-parcelas-pagas');
      if (!elData || !elParcelas || !elPagas) return;
      var numParcelas = parseInt(elParcelas.value, 10) || 0;
      var pastCount = calculatePastDueInstallments(elData.value, numParcelas);
      elPagas.value = pastCount;
      elPagas.max = numParcelas;
      updateEditLoanPreview();
    }

    function onEditLoanParcelasChange() {
      var elParcelas = document.getElementById('edit-loan-parcelas');
      var elPagas = document.getElementById('edit-loan-parcelas-pagas');
      if (elParcelas && elPagas) {
        var numParcelas = parseInt(elParcelas.value, 10) || 0;
        elPagas.max = numParcelas;
        if (parseInt(elPagas.value, 10) > numParcelas) {
          elPagas.value = numParcelas;
        }
      }
      updateEditLoanPreview();
    }

    function openEditLoanModal(loanId) {
      var l = (state.loans || []).find(function (it) { return String(it.id) === String(loanId); });
      if (!l) {
        showToast('Empréstimo não encontrado.', 'error');
        return;
      }
      populateSelects();

      document.getElementById('edit-loan-id').value = l.id;
      document.getElementById('edit-loan-instituicao').value = l.instituicao || '';
      document.getElementById('edit-loan-descricao').value = l.descricao || '';
      document.getElementById('edit-loan-situacao').value = l.situacao || 'ATIVO';

      var isConsignado = l.tipo_emprestimo === 'CONSIGNADO' || Boolean(l.desconto_em_folha);
      var modSelect = document.getElementById('edit-loan-modalidade-cobranca');
      if (modSelect) {
        modSelect.value = isConsignado ? 'CONSIGNADO_FOLHA' : 'PAGO_USUARIO';
      }
      onEditLoanModalidadeChange();

      var vContratado = l.valor_contratado_centavos ? UIHelpers.formatCentavosToInput(l.valor_contratado_centavos) : '';
      var vParcela = l.valor_parcela_centavos ? UIHelpers.formatCentavosToInput(l.valor_parcela_centavos) : '';
      var numParcelas = l.numero_parcelas || 24;
      var taxaFloat = (l.taxa_juros_mensal_bps || 0) / 100;
      var taxaStr = taxaFloat > 0 ? String(taxaFloat.toFixed(2)).replace('.', ',') : '1,50';

      document.getElementById('edit-loan-valor-contratado').value = vContratado;
      document.getElementById('edit-loan-parcelas').value = numParcelas;
      document.getElementById('edit-loan-valor-parcela').value = vParcela;
      document.getElementById('edit-loan-data-inicial').value = l.data_inicial ? l.data_inicial.substring(0, 10) : '';
      document.getElementById('edit-loan-taxa').value = taxaStr;

      var pastCount = calculatePastDueInstallments(l.data_inicial, numParcelas);
      var currentPagas = (l.parcelas_pagas !== undefined && l.parcelas_pagas !== null && l.parcelas_pagas > 0)
        ? l.parcelas_pagas
        : pastCount;
      var elPagas = document.getElementById('edit-loan-parcelas-pagas');
      if (elPagas) {
        elPagas.value = currentPagas;
        elPagas.max = numParcelas;
      }

      if (document.getElementById('edit-loan-conta')) {
        document.getElementById('edit-loan-conta').value = l.conta_bancaria_id || '';
      }
      document.getElementById('edit-loan-obs').value = l.observacoes || '';

      updateEditLoanPreview();

      var modal = document.getElementById('modal-edit-loan-backdrop');
      if (modal) {
        modal.classList.add('open');
        if (UIHelpers && UIHelpers.initInfoPopovers) {
          UIHelpers.initInfoPopovers(modal);
        }
      }
    }

    function submitEditLoan(ev) {
      ev.preventDefault();
      var id = document.getElementById('edit-loan-id').value;
      var taxaFloat = parseFloat(String(document.getElementById('edit-loan-taxa').value || '0').replace(',', '.')) || 0;
      var modalidade = document.getElementById('edit-loan-modalidade-cobranca') ? document.getElementById('edit-loan-modalidade-cobranca').value : 'CONSIGNADO_FOLHA';
      var isConsignado = modalidade === 'CONSIGNADO_FOLHA';
      var contaId = !isConsignado && document.getElementById('edit-loan-conta') ? document.getElementById('edit-loan-conta').value : '';

      var elData = document.getElementById('edit-loan-data-inicial');
      var dataInicialVal = (elData && elData.value ? elData.value : '').trim();

      var elPagas = document.getElementById('edit-loan-parcelas-pagas');
      var pagasVal = elPagas ? parseInt(elPagas.value, 10) : 0;
      if (isNaN(pagasVal) || pagasVal < 0) pagasVal = 0;

      var payload = {
        id: id,
        instituicao: document.getElementById('edit-loan-instituicao').value,
        descricao: document.getElementById('edit-loan-descricao').value,
        situacao: document.getElementById('edit-loan-situacao').value,
        tipo_emprestimo: isConsignado ? 'CONSIGNADO' : 'PESSOAL',
        desconto_em_folha: isConsignado,
        valor_contratado_centavos: UIHelpers.parseInputToCentavos(document.getElementById('edit-loan-valor-contratado').value),
        numero_parcelas: parseInt(document.getElementById('edit-loan-parcelas').value, 10),
        parcelas_pagas: pagasVal,
        valor_parcela_centavos: UIHelpers.parseInputToCentavos(document.getElementById('edit-loan-valor-parcela').value),
        data_inicial: dataInicialVal,
        taxa_juros_mensal_bps: Math.round(taxaFloat * 100),
        conta_bancaria_id: contaId,
        observacoes: document.getElementById('edit-loan-obs').value
      };

      // Optimistic Update: atualiza o estado em memória imediatamente
      var previousCopy = null;
      var updatedLoan = null;
      if (state.loans) {
        for (var i = 0; i < state.loans.length; i++) {
          if (String(state.loans[i].id) === String(id)) {
            previousCopy = Object.assign({}, state.loans[i]);
            state.loans[i].instituicao = payload.instituicao;
            state.loans[i].descricao = payload.descricao;
            state.loans[i].situacao = payload.situacao;
            state.loans[i].tipo_emprestimo = payload.tipo_emprestimo;
            state.loans[i].desconto_em_folha = isConsignado;
            state.loans[i].desconto_em_folha_ja_deduzido_salario = isConsignado;
            state.loans[i].valor_contratado_centavos = payload.valor_contratado_centavos;
            state.loans[i].numero_parcelas = payload.numero_parcelas;
            state.loans[i].parcelas_pagas = pagasVal;
            state.loans[i].valor_parcela_centavos = payload.valor_parcela_centavos;
            state.loans[i].saldo_devedor_centavos = Math.max(0, (payload.numero_parcelas - pagasVal) * payload.valor_parcela_centavos);
            state.loans[i].data_inicial = dataInicialVal;
            state.loans[i].taxa_juros_mensal_bps = payload.taxa_juros_mensal_bps;
            state.loans[i].conta_bancaria_id = contaId;
            state.loans[i].observacoes = payload.observacoes;
            updatedLoan = state.loans[i];
            break;
          }
        }
      }

      closeEditLoanModal();
      if (updatedLoan) renderLoansView(state.loans);
      showToast('Contrato de empréstimo e cronograma atualizados com sucesso!', 'success');

      callServer('loans.update', payload, function () {
        loadLoans(true);
      }, {
        quiet: true,
        onError: function (err) {
          if (previousCopy && state.loans) {
            for (var k = 0; k < state.loans.length; k++) {
              if (String(state.loans[k].id) === String(id)) {
                state.loans[k] = previousCopy;
                break;
              }
            }
            renderLoansView(state.loans);
          }
          showToast('Erro ao atualizar contrato: ' + (err.message || err), 'error');
        }
      });
    }

      state.radarSlideIndex = idx;
      renderRadarSlide();

    function consultInvestmentAi() {
      var btnFull = document.getElementById('btn-refresh-ai-full');
      if (btnFull) {
        btnFull.disabled = true;
        btnFull.innerHTML = '<span class="loading-spinner" style="width:12px;height:12px;border-width:2px;display:inline-block;margin-right:4px;"></span> Processando com IA...';
      }

      callServer('investments.getAiAdvice', {}, function (res) {
