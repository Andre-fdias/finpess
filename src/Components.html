<script>
  /**
   * Utilitários visuais e componentes compartilhados no frontend.
   */
  var UIHelpers = (function () {
    function escapeHtml(str) {
      if (str === undefined || str === null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatBrl(centavos) {
      var n = Number(centavos || 0);
      if (!Number.isFinite(n)) n = 0;
      var neg = n < 0;
      var abs = Math.abs(Math.round(n));
      var reais = Math.floor(abs / 100);
      var cents = abs % 100;
      var rStr = String(reais).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      var cStr = String(cents).padStart(2, '0');
      return (neg ? '-R$ ' : 'R$ ') + rStr + ',' + cStr;
    }

    function formatCentavosToBrlInput(centavos) {
      var n = Number(centavos || 0);
      if (!Number.isFinite(n) || n < 0) n = 0;
      var abs = Math.round(n);
      var reais = Math.floor(abs / 100);
      var cents = abs % 100;
      var rStr = String(reais).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      var cStr = String(cents).padStart(2, '0');
      return 'R$ ' + rStr + ',' + cStr;
    }

    function applyCurrencyMask(input) {
      if (!input) return;
      var raw = String(input.value || '').replace(/\D/g, '');
      if (!raw) {
        input.value = (input.id === 'bank-saldo-inicial') ? 'R$ 0,00' : '';
        return;
      }
      var cents = parseInt(raw, 10);
      if (isNaN(cents) || cents <= 0) {
        input.value = (input.id === 'bank-saldo-inicial') ? 'R$ 0,00' : '';
        return;
      }
      input.value = formatCentavosToBrlInput(cents);
      try {
        var len = input.value.length;
        input.setSelectionRange(len, len);
      } catch (e) {}
    }

    function attachCurrencyMasks() {
      var selectors = [
        '#lan-valor', '#lan-edit-valor', '#rec-valor', '#rec-edit-valor', '#bank-saldo-inicial',
        '#trf-valor', '#div-valor-orig', '#div-valor-atual', '#emp-valor-contratado',
        '#emp-valor-parcela', '#inv-aplicado', '#inv-mercado', '#mvi-valor', '#cat-orcamento',
        '#crd-limite-total', '#edit-crd-limite-total', '#pur-valor-total', '#pay-inv-valor', '#sim-valor',
        '#reconcile-new-balance', '#agreement-valor-negociado',
        'input[data-type="currency"]', '.mask-money'
      ];
      var inputs = document.querySelectorAll(selectors.join(','));
      for (var i = 0; i < inputs.length; i++) {
        var input = inputs[i];
        if (input.getAttribute('data-masked') === 'true') continue;
        input.setAttribute('data-masked', 'true');
        input.setAttribute('placeholder', 'R$ 0,00');
        input.setAttribute('inputmode', 'numeric');

        input.addEventListener('input', function (e) {
          applyCurrencyMask(e.target);
          if (e.target.id === 'emp-valor-contratado' || e.target.id === 'emp-valor-parcela') {
            if (window.App && typeof App.updateLoanPreview === 'function') {
              App.updateLoanPreview();
            }
          } else if (e.target.id === 'agreement-valor-negociado') {
            if (window.App && typeof App.updateAgreementPreview === 'function') {
              App.updateAgreementPreview();
            }
          } else if (e.target.id === 'pur-valor-total') {
            if (window.App && typeof App.updatePurchaseInstallmentPreview === 'function') {
              App.updatePurchaseInstallmentPreview();
            }
          } else if (e.target.id === 'reconcile-new-balance') {
            if (window.App && typeof App.updateReconcileDiff === 'function') {
              App.updateReconcileDiff();
            }
          }
        });

        input.addEventListener('focus', function (e) {
          if (!e.target.value && e.target.id === 'bank-saldo-inicial') {
            e.target.value = 'R$ 0,00';
          }
          if (e.target.value) {
            setTimeout(function () {
              try {
                if (e.target.selectionStart === e.target.selectionEnd) {
                  var len = e.target.value.length;
                  e.target.setSelectionRange(len, len);
                }
              } catch (err) {}
            }, 10);
          }
        });

        input.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace' || e.key === 'Delete') {
            if (e.target.selectionStart === 0 && e.target.selectionEnd === e.target.value.length) {
              e.preventDefault();
              e.target.value = (e.target.id === 'bank-saldo-inicial') ? 'R$ 0,00' : '';
              e.target.dispatchEvent(new Event('input', { bubbles: true }));
            }
          }
        });

        input.addEventListener('blur', function (e) {
          var raw = String(e.target.value || '').replace(/\D/g, '');
          var cents = parseInt(raw, 10) || 0;
          if (cents <= 0) {
            e.target.value = (e.target.id === 'bank-saldo-inicial') ? 'R$ 0,00' : '';
          }
        });

        input.addEventListener('paste', function (e) {
          var text = (e.clipboardData || window.clipboardData).getData('text') || '';
          if (text) {
            e.preventDefault();
            var parsed = parseInputToCentavos(text);
            if (parsed > 0) {
              e.target.value = formatCentavosToBrlInput(parsed);
              try {
                var len = e.target.value.length;
                e.target.setSelectionRange(len, len);
              } catch (err) {}
              e.target.dispatchEvent(new Event('input', { bubbles: true }));
            } else {
              e.target.value = '';
            }
          }
        });
      }
    }

    function parseInputToCentavos(rawValue) {
      if (rawValue === undefined || rawValue === null) return 0;
      if (typeof rawValue === 'number') {
        return Math.round(rawValue * 100);
      }
      var str = String(rawValue).replace(/R\$/gi, '').replace(/\s+/g, '').trim();
      if (!str) return 0;
      if (str.indexOf(',') !== -1) {
        var commaParts = str.split(',');
        var wholePart = commaParts[0].replace(/\D/g, '') || '0';
        var decPart = (commaParts[1] || '').replace(/\D/g, '');
        if (decPart.length > 2) {
          decPart = decPart.substring(0, 2);
        } else if (decPart.length === 1) {
          decPart = decPart + '0';
        } else if (decPart.length === 0) {
          decPart = '00';
        }
        return (parseInt(wholePart, 10) * 100) + parseInt(decPart, 10);
      }
      var dotParts = str.split('.');
      if (dotParts.length === 2 && dotParts[1].length <= 2 && dotParts[1].length > 0) {
        var whole = dotParts[0].replace(/\D/g, '') || '0';
        var dec = dotParts[1].replace(/\D/g, '');
        if (dec.length === 1) dec = dec + '0';
        return (parseInt(whole, 10) * 100) + parseInt(dec, 10);
      }
      var onlyDigits = str.replace(/\D/g, '');
      if (!onlyDigits) return 0;
      return parseInt(onlyDigits, 10) * 100;
    }

    function formatDateBr(isoStr) {
      if (!isoStr) return '-';
      var s = String(isoStr).substring(0, 10);
      var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return escapeHtml(isoStr);
      return m[3] + '/' + m[2] + '/' + m[1];
    }

    /**
     * Localiza instituição bancária no catálogo oficial TOP_BANKS por nome, id ou apelido.
     */
    function findBank(instituicaoNome) {
      var raw = String(instituicaoNome || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
      if (!raw) return null;

      for (var i = 0; i < TOP_BANKS.length; i++) {
        var b = TOP_BANKS[i];
        var bNameNorm = b.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        if (bNameNorm === raw || b.id === raw) return b;
        if (b.aliases) {
          for (var a = 0; a < b.aliases.length; a++) {
            var aliasNorm = b.aliases[a].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
            if (raw === aliasNorm || raw.indexOf(aliasNorm) !== -1 || aliasNorm.indexOf(raw) !== -1) {
              return b;
            }
          }
        } else if (raw.indexOf(bNameNorm) !== -1 || bNameNorm.indexOf(raw) !== -1) {
          return b;
        }
      }
      return null;
    }

    /**
     * Renderiza barra de progresso de teto de gastos no estilo Bento Grid / Zen.
     */
    function renderCategoryBudgetBar(spentCentavos, budgetCentavos) {
      var spent = Number(spentCentavos || 0);
      var budget = Number(budgetCentavos || 0);
      if (budget <= 0) {
        return '<small style="color:var(--text-muted); font-size:0.72rem;">Sem teto definido</small>';
      }

      var pct = Math.round((spent / budget) * 100);
      var widthPct = Math.min(pct, 100);
      var colorClass = 'zen-progress-green';
      if (pct > 100) {
        colorClass = 'zen-progress-red';
      } else if (pct >= 75) {
        colorClass = 'zen-progress-amber';
      }

      return (
        '<div class="zen-budget-cell">' +
          '<div class="zen-budget-header">' +
            '<span style="color:var(--text-secondary);">' + pct + '% do teto</span>' +
            '<span style="color:' + (pct > 100 ? 'var(--danger)' : 'var(--text-muted)') + ';">' + (pct > 100 ? '⚠️ Estourou' : formatBrl(budget - spent) + ' livre') + '</span>' +
          '</div>' +
          '<div class="zen-progress-track">' +
            '<div class="zen-progress-fill ' + colorClass + '" style="width:' + widthPct + '%;"></div>' +
          '</div>' +
        '</div>'
      );
    }

    /**

     */
    function renderMonthlyBarChartSvg(evolucaoMensal) {
      if (!evolucaoMensal || evolucaoMensal.length === 0) {
        return '<p class="text-muted" style="text-align:center; padding:2rem 1rem;">Sem dados suficientes para exibir o gráfico mensal.</p>';
      }
      var maxVal = 1000;
      for (var i = 0; i < evolucaoMensal.length; i++) {
        var r = (Number(evolucaoMensal[i].receitas_confirmadas_centavos) || 0) + (Number(evolucaoMensal[i].receitas_previstas_centavos) || 0);
        var d = (Number(evolucaoMensal[i].despesas_confirmadas_centavos) || 0) + (Number(evolucaoMensal[i].despesas_previstas_centavos) || 0);
        if (r > maxVal) maxVal = r;
        if (d > maxVal) maxVal = d;
      }

      var svgWidth = 600;
      var svgHeight = 220;
      var chartBottom = 175;
      var usableHeight = 135;
      var slotWidth = Math.floor(svgWidth / evolucaoMensal.length);

      var barsHtml = [];
      for (var j = 0; j < evolucaoMensal.length; j++) {
        var m = evolucaoMensal[j];
        var rConf = Number(m.receitas_confirmadas_centavos) || 0;
        var rPrev = Number(m.receitas_previstas_centavos) || 0;
        var dConf = Number(m.despesas_confirmadas_centavos) || 0;
        var dPrev = Number(m.despesas_previstas_centavos) || 0;

        var totalRec = (rConf + rPrev);
        var totalDesp = (dConf + dPrev);

        var recHeight = totalRec > 0 ? Math.max(6, Math.round((totalRec / maxVal) * usableHeight)) : 2;
        var despHeight = totalDesp > 0 ? Math.max(6, Math.round((totalDesp / maxVal) * usableHeight)) : 2;
        var xBase = j * slotWidth + 20;

        var rawMes = String(m.competencia || '');
        var labelMes = rawMes;
        if (rawMes.length === 7) {
          var ySuffix = rawMes.substring(2, 4);
          var mNum = rawMes.substring(5, 7);
          var mNames = {'01':'jan','02':'fev','03':'mar','04':'abr','05':'mai','06':'jun','07':'jul','08':'ago','09':'set','10':'out','11':'nov','12':'dez'};
          labelMes = (mNames[mNum] || mNum) + '/' + ySuffix;
        }

        barsHtml.push(
          '<g class="chart-bar-group">' +
          '<rect x="' + xBase + '" y="' + (chartBottom - recHeight) + '" width="22" height="' + recHeight + '" rx="4" fill="var(--success)" opacity="' + (rConf > 0 ? '1' : '0.82') + '">' +
          '<title>Receitas: ' + formatBrl(totalRec) + ' (' + (rConf > 0 ? 'Confirmadas' : 'Previstas') + ')</title>' +
          '</rect>' +
          '<rect x="' + (xBase + 26) + '" y="' + (chartBottom - despHeight) + '" width="22" height="' + despHeight + '" rx="4" fill="var(--danger)" opacity="' + (dConf > 0 ? '1' : '0.82') + '">' +
          '<title>Despesas: ' + formatBrl(totalDesp) + ' (' + (dConf > 0 ? 'Pagas' : 'Previstas') + ')</title>' +
          '</rect>' +
          '<text x="' + (xBase + 24) + '" y="198" text-anchor="middle" fill="var(--text-secondary)" font-size="11" font-weight="600">' + escapeHtml(labelMes) + '</text>' +
          '</g>'
        );
      }

      return (
        '<svg viewBox="0 0 ' + svgWidth + ' ' + svgHeight + '" width="100%" height="220" preserveAspectRatio="none" role="img" aria-label="Evolução mensal de receitas e despesas" style="display:block; width:100%; height:220px; overflow:visible;">' +
        '<line x1="10" y1="' + chartBottom + '" x2="' + (svgWidth - 10) + '" y2="' + chartBottom + '" stroke="var(--chart-grid)" stroke-width="1" />' +
        barsHtml.join('') +
        '</svg>'
      );
    }

    /**
     * Renderizador de Markdown elegante e seguro para o Oráculo IA.
     * Suporta títulos, listas, tabelas, blocos, negrito, itálico e códigos sem bibliotecas externas.
     */
    function renderMarkdown(md) {
      if (!md) return '';
      var text = String(md);
      var lines = text.split(/\r?\n/);
      var html = [];
      var inList = false;
      var listType = '';
      var inTable = false;
      var tableHeaderDone = false;

      function closeList() {
        if (inList) {
          html.push(listType === 'ul' ? '</ul>' : '</ol>');
          inList = false;
          listType = '';
        }
      }

      function closeTable() {
        if (inTable) {
          html.push('</tbody></table></div>');
          inTable = false;
          tableHeaderDone = false;
        }
      }

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var trimmed = line.trim();

        if (!trimmed) {
          closeList();
          closeTable();
          continue;
        }

        // Tabela Markdown (| col1 | col2 |)
        if (trimmed.indexOf('|') !== -1 && trimmed.startsWith('|') && trimmed.endsWith('|')) {
          closeList();
          var cols = trimmed.slice(1, -1).split('|').map(function (c) { return c.trim(); });

          if (cols.every(function (c) { return /^:?-+:?$/.test(c); })) {
            tableHeaderDone = true;
            continue;
          }

          if (!inTable) {
            inTable = true;
            html.push('<div class="table-responsive" style="margin:0.75rem 0; overflow-x:auto;"><table class="data-table" style="font-size:0.86rem; width:100%; border-collapse:collapse;">');
            html.push('<thead><tr>' + cols.map(function (c) { return '<th style="background:var(--bg-elevated); padding:6px 10px; border-bottom:2px solid var(--border-color); text-align:left;">' + formatInlineMd(c) + '</th>'; }).join('') + '</tr></thead><tbody>');
          } else {
            html.push('<tr>' + cols.map(function (c) { return '<td style="padding:6px 10px; border-bottom:1px solid var(--border-color);">' + formatInlineMd(c) + '</td>'; }).join('') + '</tr>');
          }
          continue;
        } else {
          closeTable();
        }

        // Headings (###, ##, #)
        var mH3 = trimmed.match(/^###\s+(.+)$/);
        if (mH3) {
          closeList();
          html.push('<h4 style="margin:0.9rem 0 0.35rem 0; font-size:1rem; font-weight:700; color:var(--text-primary); border-bottom:1px solid var(--border-color); padding-bottom:0.25rem;">' + formatInlineMd(mH3[1]) + '</h4>');
          continue;
        }

        var mH2 = trimmed.match(/^##\s+(.+)$/);
        if (mH2) {
          closeList();
          html.push('<h3 style="margin:1.1rem 0 0.45rem 0; font-size:1.1rem; font-weight:700; color:var(--primary);">' + formatInlineMd(mH2[1]) + '</h3>');
          continue;
        }

        var mH1 = trimmed.match(/^#\s+(.+)$/);
        if (mH1) {
          closeList();
          html.push('<h2 style="margin:1.25rem 0 0.5rem 0; font-size:1.2rem; font-weight:800; color:var(--text-primary);">' + formatInlineMd(mH1[1]) + '</h2>');
          continue;
        }

        // Linha divisória horizontal (---)
        if (/^---+$/.test(trimmed)) {
          closeList();
          html.push('<hr style="border:0; border-top:1px solid var(--border-color); margin:0.75rem 0;" />');
          continue;
        }

        // Blockquote (> )
        var mQuote = trimmed.match(/^>\s+(.+)$/);
        if (mQuote) {
          closeList();
          html.push('<blockquote style="margin:0.5rem 0; padding:0.5rem 0.85rem; border-left:3.5px solid var(--primary); background:var(--bg-elevated); border-radius:0 6px 6px 0; font-size:0.88rem; color:var(--text-secondary);">' + formatInlineMd(mQuote[1]) + '</blockquote>');
          continue;
        }

        // Lista com marcadores (- ou *)
        var mBullet = trimmed.match(/^[-*]\s+(.+)$/);
        if (mBullet) {
          if (!inList || listType !== 'ul') {
            closeList();
            inList = true;
            listType = 'ul';
            html.push('<ul style="margin:0.35rem 0 0.5rem 0; padding-left:1.35rem; line-height:1.6;">');
          }
          html.push('<li style="margin-bottom:0.25rem;">' + formatInlineMd(mBullet[1]) + '</li>');
          continue;
        }

        // Lista numerada (1. )
        var mNum = trimmed.match(/^\d+\.\s+(.+)$/);
        if (mNum) {
          if (!inList || listType !== 'ol') {
            closeList();
            inList = true;
            listType = 'ol';
            html.push('<ol style="margin:0.35rem 0 0.5rem 0; padding-left:1.35rem; line-height:1.6;">');
          }
          html.push('<li style="margin-bottom:0.25rem;">' + formatInlineMd(mNum[1]) + '</li>');
          continue;
        }

        closeList();
        html.push('<p style="margin:0.4rem 0; line-height:1.6; color:var(--text-primary);">' + formatInlineMd(trimmed) + '</p>');
      }

      closeList();
      closeTable();
      return html.join('\n');
    }

    function formatInlineMd(str) {
      if (!str) return '';
      var s = escapeHtml(str);

      // Inline code
      s = s.replace(/`([^`]+)`/g, '<code style="background:var(--bg-elevated); padding:2px 5px; border-radius:4px; font-size:0.85em; color:var(--primary); font-family:monospace;">$1</code>');

      // Negrito **bold** ou __bold__
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong style="color:var(--text-primary); font-weight:700;">$1</strong>');
      s = s.replace(/__([^_]+)__/g, '<strong style="color:var(--text-primary); font-weight:700;">$1</strong>');

      // Itálico *italic* ou _italic_
      s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      s = s.replace(/_([^_]+)_/g, '<em>$1</em>');

      return s;
    }

    /**
     * Gera o HTML de um ícone de informação acionável por hover ou clique com o card já incluído.
     */
    function renderInfoIcon(infoKey, alignRight) {
      var keyEsc = escapeHtml(infoKey);
      var item = INFO_CATALOG[infoKey];
      var alignAttr = alignRight ? ' data-align="right"' : '';
      var alignClass = alignRight ? ' align-right' : '';

      if (!item) {
        return (
          '<span class="info-popover-wrap" data-info-key="' + keyEsc + '"' + alignAttr + '>' +
            '<button type="button" class="info-help-btn" onclick="UIHelpers.toggleInfoPopover(event, this)" aria-label="Informações">' +
              '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">' +
                '<circle cx="12" cy="12" r="10"></circle>' +
                '<line x1="12" y1="16" x2="12" y2="12"></line>' +
                '<line x1="12" y1="8" x2="12.01" y2="8"></line>' +
              '</svg>' +
            '</button>' +
          '</span>'
        );
      }

      var formulaHtml = item.formula ? '<div class="info-popover-formula"><strong>Fórmula:</strong> ' + escapeHtml(item.formula) + '</div>' : '';
      var tipHtml = item.tip ? '<div class="info-popover-tip">💡 ' + escapeHtml(item.tip) + '</div>' : '';

      return (
        '<span class="info-popover-wrap" data-info-key="' + keyEsc + '"' + alignAttr + '>' +
          '<button type="button" class="info-help-btn" onclick="UIHelpers.toggleInfoPopover(event, this)" aria-label="Informações sobre ' + escapeHtml(item.title) + '">' +
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">' +
              '<circle cx="12" cy="12" r="10"></circle>' +
              '<line x1="12" y1="16" x2="12" y2="12"></line>' +
              '<line x1="12" y1="8" x2="12.01" y2="8"></line>' +
            '</svg>' +
          '</button>' +
          '<div class="info-popover-card' + alignClass + '" role="tooltip">' +
            '<div class="info-popover-header">' +
              '<div style="display:flex; align-items:center; gap:0.4rem;">' +
                '<span class="info-popover-badge">ℹ️</span>' +
                '<span class="info-popover-title">' + escapeHtml(item.title) + '</span>' +
              '</div>' +
              '<button type="button" class="info-popover-close-btn" onclick="UIHelpers.closeAllInfoPopovers(event)" aria-label="Fechar informativo">✕</button>' +
            '</div>' +
            '<p class="info-popover-desc">' + escapeHtml(item.desc) + '</p>' +
            formulaHtml +
            tipHtml +
          '</div>' +
        '</span>'
      );
    }

    /**
     * Inicializa todos os elementos .info-popover-wrap que ainda não possuam conteúdo injetado.
     */
    function initInfoPopovers(root) {
      var scope = root || (typeof document !== 'undefined' ? document : null);
      if (!scope || !scope.querySelectorAll) return;

      var wraps = scope.querySelectorAll('.info-popover-wrap');
      for (var i = 0; i < wraps.length; i++) {
        var wrap = wraps[i];
        var key = wrap.getAttribute('data-info-key');
        if (!key || !INFO_CATALOG[key]) continue;

        var item = INFO_CATALOG[key];

        if (!wrap.querySelector('.info-help-btn')) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'info-help-btn';
          btn.setAttribute('aria-label', 'Informações sobre ' + item.title);
          btn.onclick = function (e) { toggleInfoPopover(e, this); };
          btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
          wrap.appendChild(btn);
        }

        if (!wrap.querySelector('.info-popover-card')) {
          var card = document.createElement('div');
          card.className = 'info-popover-card';
          var isRight = wrap.getAttribute('data-align') === 'right';
          if (!isRight && typeof window !== 'undefined') {
            var rect = wrap.getBoundingClientRect();
            var docWidth = Math.min(window.innerWidth || 10000, (document.documentElement && document.documentElement.clientWidth) || 10000);
            if (rect.left + 310 > docWidth - 16 || wrap.closest('.page-header-actions, .bank-card-bento-top-actions')) {
              isRight = true;
            }
          }
          if (isRight) {
            card.classList.add('align-right');
          }
          card.setAttribute('role', 'tooltip');

          var formulaHtml = item.formula ? '<div class="info-popover-formula"><strong>Fórmula:</strong> ' + escapeHtml(item.formula) + '</div>' : '';
          var tipHtml = item.tip ? '<div class="info-popover-tip">💡 ' + escapeHtml(item.tip) + '</div>' : '';

          card.innerHTML =
            '<div class="info-popover-header">' +
              '<div style="display:flex; align-items:center; gap:0.4rem;">' +
                '<span class="info-popover-badge">ℹ️</span>' +
                '<span class="info-popover-title">' + escapeHtml(item.title) + '</span>' +
              '</div>' +
              '<button type="button" class="info-popover-close-btn" onclick="UIHelpers.closeAllInfoPopovers(event)" aria-label="Fechar informativo">✕</button>' +
            '</div>' +
            '<p class="info-popover-desc">' + escapeHtml(item.desc) + '</p>' +
            formulaHtml +
            tipHtml;

          wrap.appendChild(card);
        }
      }
    }

    /**
     * Alterna a exibição do popover explicativo, criando o conteúdo sob demanda caso não exista.
     */
    function toggleInfoPopover(ev, elOrKey) {
      if (ev) {
        ev.stopPropagation();
        ev.preventDefault();
      }
      var wrap = (elOrKey && elOrKey.closest)
        ? elOrKey.closest('.info-popover-wrap')
        : (typeof document !== 'undefined' ? document.querySelector('.info-popover-wrap[data-info-key="' + elOrKey + '"]') : null);
      if (!wrap) return;

      var key = wrap.getAttribute('data-info-key');
      var item = INFO_CATALOG[key];
      if (!item) return;

      var card = wrap.querySelector('.info-popover-card');
      var wasOpen = card && card.classList.contains('show');

      closeAllInfoPopovers();

      if (wasOpen) return;

      if (!card) {
        card = document.createElement('div');
        card.className = 'info-popover-card';
        if (wrap.getAttribute('data-align') === 'right') {
          card.classList.add('align-right');
        }
        card.setAttribute('role', 'tooltip');

        var formulaHtml = item.formula ? '<div class="info-popover-formula"><strong>Fórmula:</strong> ' + escapeHtml(item.formula) + '</div>' : '';
        var tipHtml = item.tip ? '<div class="info-popover-tip">💡 ' + escapeHtml(item.tip) + '</div>' : '';

        card.innerHTML =
          '<div class="info-popover-header">' +
            '<div style="display:flex; align-items:center; gap:0.4rem;">' +
              '<span class="info-popover-badge">ℹ️</span>' +
              '<span class="info-popover-title">' + escapeHtml(item.title) + '</span>' +
            '</div>' +
            '<button type="button" class="info-popover-close-btn" onclick="UIHelpers.closeAllInfoPopovers(event)" aria-label="Fechar informativo">✕</button>' +
          '</div>' +
          '<p class="info-popover-desc">' + escapeHtml(item.desc) + '</p>' +
          formulaHtml +
          tipHtml;

        wrap.appendChild(card);
      }

      // Posicionamento inteligente (evita sair da tela pela direita ou em iframes)
      if (typeof window !== 'undefined') {
        var rect = wrap.getBoundingClientRect();
        var cardWidth = 300;
        var docWidth = Math.min(window.innerWidth || 10000, (document.documentElement && document.documentElement.clientWidth) || 10000);
        if (wrap.getAttribute('data-align') === 'right' || wrap.closest('.page-header-actions, .bank-card-bento-top-actions') || rect.left + cardWidth > docWidth - 16) {
          card.classList.add('align-right');
        } else {
          card.classList.remove('align-right');
        }
      }

      card.classList.add('show');
    }

    function closeAllInfoPopovers(ev) {
      if (ev && ev.stopPropagation) {
        ev.stopPropagation();
      }
      if (typeof document === 'undefined') return;
      var openCards = document.querySelectorAll('.info-popover-card.show');
      for (var i = 0; i < openCards.length; i++) {
        openCards[i].classList.remove('show');
      }
    }

    // Listener global para fechar popovers ao clicar fora ou apertar Escape, e auto-init
    if (typeof document !== 'undefined') {
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.info-popover-wrap')) {
          closeAllInfoPopovers();
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeAllInfoPopovers();
        }
      });
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          initInfoPopovers();
        });
      } else {
        setTimeout(function () {
          initInfoPopovers();
        }, 50);
      }
    }

    return {
      TOP_BANKS: TOP_BANKS,
      findBank: findBank,
      getBankBadgeHtml: getBankBadgeHtml,
      getBankCardLogoHtml: getBankCardLogoHtml,
      getCardBrandBadgeHtml: getCardBrandBadgeHtml,
      getCardBrandLogoHtml: getCardBrandLogoHtml,
      renderCategoryBudgetBar: renderCategoryBudgetBar,
      escapeHtml: escapeHtml,
      formatBrl: formatBrl,
      formatCentavosToBrlInput: formatCentavosToBrlInput,
      formatCentavosToInput: formatCentavosToBrlInput,
      applyCurrencyMask: applyCurrencyMask,
      maskCurrencyInput: applyCurrencyMask,
      attachCurrencyMasks: attachCurrencyMasks,
      parseInputToCentavos: parseInputToCentavos,
      formatDateBr: formatDateBr,
      renderBadge: renderBadge,
      renderMonthlyBarChartSvg: renderMonthlyBarChartSvg,
      renderMarkdown: renderMarkdown,
      INFO_CATALOG: INFO_CATALOG,
      renderInfoIcon: renderInfoIcon,
      initInfoPopovers: initInfoPopovers,
      toggleInfoPopover: toggleInfoPopover,
      closeAllInfoPopovers: closeAllInfoPopovers
    };
  })();
</script>
