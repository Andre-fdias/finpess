<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="finpessBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background com cantos arredondados -->
  <rect width="512" height="512" rx="115" fill="url(#finpessBg)"/>
  
  <!-- Escudo Protetor com sombra -->
  <g filter="url(#shadow)">
    <path d="M256 80 L395 138 V255 C395 348 333 418 256 444 C179 418 117 348 117 255 V138 Z" 
          fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Barras de Crescimento Patrimonial -->
    <rect x="175" y="275" width="34" height="90" rx="8" fill="#ffffff" opacity="0.95"/>
    <rect x="239" y="215" width="34" height="150" rx="8" fill="#ffffff" opacity="0.95"/>
    <rect x="303" y="160" width="34" height="205" rx="8" fill="#34d399"/>
    
    <!-- Linha de Tendência de Lucro / Crescimento -->
    <polyline points="158 255 228 190 285 230 358 138" 
              fill="none" stroke="#fbbf24" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ponta da Flecha -->
    <polygon points="368,138 338,136 358,165" fill="#fbbf24"/>
  </g>
</svg>

